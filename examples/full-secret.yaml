# Complete reference for `kind: Secret` — every field of `spec` and every source form.
# A Secret is a bag of KEY=value pairs, encrypted at rest. It is consumed by
# `Container.secret` (env or /run/secrets files), `Volume.<block>.passwordSecret`,
# `Image.pullSecret` and `provision.truenas.*Secret`.
#
# The three sources (stringData, fromEnvFile, fromEnv) can be combined in ONE document;
# they are shown separately below for clarity. Precedence when combined:
# fromEnvFile first, then stringData overrides it (inline wins over the file).
#
#   delonix stack apply -f examples/full-secret.yaml --dry-run
#
# NOTE: there is no `data:` (base64) field — the engine only reads the three below.
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: inline-secret
  labels:                      # free-form labels stored with the resource
    app: demo
  annotations:                 # free-form annotations
    delonix.io/purpose: "example only"
spec:
  # stringData: inline KEY: value pairs. Values are CLEARTEXT in the manifest, so the
  # apply prints a warning — fine for dev, never commit real values.
  stringData:
    password: change-me        # the key `passwordSecret` fields look for
    apiKey: dummy-api-key      # `apiKeySecret` fields look for `apiKey` (or `token`)
    username: demo             # `pullSecret` wants `username` + `password`
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: file-secret
spec:
  # fromEnvFile: load `KEY=value` lines from a .env-style file, keeping the values OUT of
  # the manifest. A relative path is resolved against the manifest's own folder.
  fromEnvFile: ./secret-source.env
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: env-map-secret
spec:
  # fromEnv, mapping form: `<key in the secret>: <environment variable to read>`.
  # The key is what the consumer looks up; the variable is whatever the CI job exports.
  # An unset variable is an ERROR at apply time, never an empty secret.
  fromEnv:
    password: EXAMPLE_DB_PASSWORD
    token: EXAMPLE_API_TOKEN
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: env-list-secret
spec:
  # fromEnv, list form: shorthand when the key name and the variable name are the same.
  fromEnv:
    - DATABASE_URL
    - SENTRY_DSN
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: combined-secret
spec:
  # All three sources at once: the file gives the base, stringData overrides `LOG_LEVEL`,
  # fromEnv adds a value read from the process environment.
  fromEnvFile: ./secret-source.env
  stringData:
    LOG_LEVEL: debug
  fromEnv:
    - EXAMPLE_EXTRA
