# kind: FirewallPolicy — a forma UNIFICADA do firewall declarativo. A direcção
# vem de `spec.direction` (ingress|egress) em vez do nome do Kind. Resolve a
# confusão de que, aqui, `kind: Ingress` é firewall L4 (não o Ingress L7/HTTP do
# k8s). `kind: Egress` continua a ser aceite (é reescrito no load, com aviso) — este é
# só a superfície unificada equivalente.
#
#   delonix stack apply -f examples/firewallpolicy.yaml
# ---------------------------------------------------------------------------
# Os recursos que as políticas abaixo referenciam. Estão aqui DE PROPÓSITO: um
# exemplo que nomeia um container inexistente dá `unresolved reference(s)` a
# quem o copia, e copiar é a primeira coisa que se faz com um exemplo.
# ---------------------------------------------------------------------------
---
apiVersion: delonix.io/v1
kind: Network
metadata:
  name: sdn-demo
spec:
  driver: bridge
---
apiVersion: delonix.io/v1
kind: Container
metadata:
  name: dbapp
spec:
  image: postgres:16-alpine
  network: sdn-demo          # a firewall L4 só actua em containers na SDN
  env:
    - POSTGRES_PASSWORD=exemplo
---
apiVersion: delonix.io/v1
kind: FirewallPolicy
metadata:
  name: db-inbound
spec:
  direction: ingress         # = kind: Ingress
  target: dbapp              # container-alvo (na SDN)
  defaultPolicy: deny
  rules:
    - proto: tcp
      port: "5432"
      from: 10.219.0.0/16
      note: postgres-from-sdn
---
apiVersion: delonix.io/v1
kind: FirewallPolicy
metadata:
  name: db-outbound
spec:
  direction: egress          # = kind: Egress
  target: dbapp
  defaultPolicy: deny
  rules:
    - proto: udp
      port: "53"
      note: dns
    - proto: tcp
      port: "443"
      to: 0.0.0.0/0
      note: https
