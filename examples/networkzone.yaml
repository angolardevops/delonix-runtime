# A segment realized by a cluster provider — Proxmox VE's own SDN — written as a
# `Network` with the provider's part inline in `spec.provider` (ADR-0070, ADR-0071).
# Everything outside `provider` is provider-neutral; `provider.spec` is typed for the
# provider named by `provider.type`, and a key that provider does not have is refused.
#
# The document never names the infrastructure endpoint: it is realized by the
# zone provider the runtime has configured, which today is a Proxmox node
# registered through DELONIX_PROXMOX_URL/_NODE and a credential (see "Remote
# providers" in the README). With no provider configured, `apply` refuses;
# `manifest validate` does not need one.
#
# metadata.name is the vnet's SDN id on the node (a lowercase letter and up to
# seven more lowercase letters or digits; the provider checks the exact format).
# `zone` is the SDN zone the vnet lives in. A zone is shared by its vnets: the
# networks that name the same zone are applied as one zone, created with the
# first and removed with the last. Everything the zone-level `dns` says must be
# identical on every network of that zone.
#
# Ownership: every vnet's alias ends with this engine's owner mark
# (`[delonix-owner:<token>]`), and a zone is the engine's only if it created it.
# A zone or vnet of the same name that is not is refused, never adopted, never
# deleted. Each apply and teardown is one transaction under the cluster's SDN
# lock: refused while someone else's SDN changes are pending, rolled back if a
# step fails. There is no update in place: `apply` ensures every network listed
# is present, and one dropped from the manifest stays until the whole zone is
# torn down (`stack apply --prune`, `stack destroy`, or
# `--replace NetworkZone/<zone>`).
apiVersion: networking.delonix.io/v1alpha1
kind: Network
metadata: { name: labnet1 }
spec:
  subnet: 10.80.0.0/24
  gateway: 10.80.0.1
  provider:
    type: proxmox
    spec:
      zone: lab
      alias: "lab network 1"
      dhcpRange: [{ start: 10.80.0.100, end: 10.80.0.150 }]
      reservations: [{ ip: 10.80.0.20, mac: "BC:24:11:00:00:20" }]
      # dns: { server: pdns, zone: lab.example, reverseServer: pdns }
      #   `server`/`reverseServer` name DNS controllers registered on the cluster
      #   by its administrator; the engine never creates one. The node writes the
      #   records (an A and a PTR per guest that gets an address from a DHCP
      #   range, and `<vnet>-gw` for each subnet's gateway). `dns` without a
      #   `dhcpRange` is refused. Changing it converges live.
---
apiVersion: networking.delonix.io/v1alpha1
kind: Network
metadata: { name: labnet2 }
spec:
  provider:
    type: proxmox
    spec: { zone: lab }
