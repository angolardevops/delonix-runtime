# kind: ShareVolume — an isolated, individually-quota'd slice of an existing
# network share, so multiple container/vm/pod can share ONE NAS export without
# seeing each other's data or exhausting each other's quota. Each ShareVolume is
# a real subdirectory of the parent's own mount, registered as its own named
# volume — consume it exactly like any other volume: `-v <name>:/path`.
#
# The parent is a `kind: Volume` with a network-share block (`nfs:`/`cifs:`/
# `webdav:`) — see examples/storage.yaml. `kind: Storage` still loads, rewritten
# into exactly this with a deprecation warning, but the manifest you write today
# should use the block.
#
# Apply with:  delonix sharevolume apply -f sharevolume.yaml
# (the storageRef below must already exist — this file creates it first)
apiVersion: delonix.io/v1
kind: Volume
metadata:
  name: nas
spec:
  nfs:
    server: 10.0.0.5
    share: /pool/data
---
apiVersion: delonix.io/v1
kind: ShareVolume
metadata:
  name: app-a
spec:
  storageRef: nas             # required — an existing network-share volume
  quota: 5G                   # optional; SOFT quota (measured usage + alert), omit = unlimited
  alertPct: 90                 # optional; usage % above which ls/describe flag a WARN (default 90)
---
apiVersion: delonix.io/v1
kind: ShareVolume
metadata:
  name: app-b
spec:
  storageRef: nas              # the SAME parent share — app-a and app-b never see each other's files
  quota: 2G
