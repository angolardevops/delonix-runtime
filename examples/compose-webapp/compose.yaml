# A web application, its Postgres and Redis, a background worker and an
# optional scheduler: the stack shape of docker/awesome-compose's
# Python/Postgres/Redis samples, cookiecutter-django's production compose and
# Sentry/Mastodon self-hosted. Written for this repository (Apache-2.0), not
# copied from any of them: the keys are the ones those files use, the
# services are small enough to run in a minute.
#
#   delonix migrate assess -f examples/compose-webapp/compose.yaml
#   delonix compose up -f examples/compose-webapp/compose.yaml
#   delonix compose up -f examples/compose-webapp/compose.yaml --profile scheduler
#   delonix compose down -f examples/compose-webapp/compose.yaml -v
name: shop

# An extension field holding the settings every app service shares, merged
# into each one with `<<: *app` — how almost every real compose file avoids
# repeating itself.
x-app: &app
  build:
    context: ./app
  image: shop-app:dev
  env_file: .env
  environment:
    DATABASE_HOST: db
    REDIS_HOST: redis
  restart: unless-stopped
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres's parallel queries use POSIX shared memory.
    shm_size: 128mb
    # A database needs time to checkpoint before it is killed.
    stop_grace_period: 30s
    env_file: .env
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    <<: *app
    command: ["python", "/app/web.py"]
    ports:
      - "8000"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [frontend, backend]

  worker:
    <<: *app
    command: ["python", "/app/worker.py"]
    stop_grace_period: 20s
    volumes:
      - worker-data:/data

  scheduler:
    <<: *app
    command: ["python", "/app/scheduler.py"]
    profiles: [scheduler]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
  worker-data:
