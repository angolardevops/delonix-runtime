# `kind: Secret` reading from the PROCESS's environment (`fromEnv`).
#
# This is the shape a CI job has: the value arrives as an environment variable
# from the runner's own secret store, there is no file to point at, and nothing
# should be written into the manifest. Neither `stringData` (cleartext in the
# file) nor `fromEnvFile` (a path) could express it.
#
#   PGPASSWORD=… NAS_TOKEN=… delonix stack apply -f examples/secret-from-env.yaml
#
# A variable that is NOT set is an ERROR, never an empty secret: a secret
# quietly holding "" because a job forgot to export something is worse than an
# apply that stops — the resource gets created, the apply reports success, and
# the failure surfaces much later as an authentication error that names nothing.
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: nas-cred
spec:
  # Mapping form: the key is what the CONSUMER looks for, the value is the
  # environment variable. `provision.truenas.passwordSecret` wants `password`,
  # `Tunnel.tokenSecretRef` wants `token` — and the environment rarely calls
  # them that.
  fromEnv:
    password: PGPASSWORD
    apiKey: NAS_TOKEN
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: app-env
spec:
  # List form: the shorthand for when the key name and the variable name are
  # the same.
  fromEnv:
    - DATABASE_URL
    - SENTRY_DSN
