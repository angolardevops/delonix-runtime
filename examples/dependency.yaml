# kind: Dependency (alias: KnowDepends) — alcançabilidade DIRIGIDA entre containers.
# Ao contrário de uma Network (bidirecional), abre UM sentido: `from` alcança `to`,
# mas `to` NÃO inicia para `from`. Caso clássico: a app conhece a DB, a DB não
# conhece a app — a DB deixa de ficar exposta a todos os containers da rede.
#
# É AÇÚCAR, e agora diz-se: no `load` cada Dependency é reescrita para um
# `kind: NetworkPolicy` com `direction: ingress`, default-deny no `to` + um allow
# por `from`. Corre `stack apply --dry-run` para ver a política real — antes desta
# fusão a tradução era invisível, e um `to` nomeado por uma Dependency E por uma
# FirewallPolicy obrigava o motor a AVISAR sobre o seu próprio gémeo.
#
# Várias Dependency para o mesmo `to` acumulam: fundem-se numa só política (a
# anotação `delonix.io/from-dependencies` regista de quais vieram). A regra nomeia
# o peer por WORKLOAD (`fromWorkload`), não por IP — o endereço de um container
# vem da SDN e muda num restart, por isso uma regra escrita como CIDR é uma regra
# que deixa de casar com o workload para que foi escrita.
# Aplicar com `delonix stack apply -f dependency.yaml`.
---
apiVersion: networking.delonix.io/v1alpha1
kind: Network
metadata: { name: appnet }
spec:
  driver: bridge
---
apiVersion: compute.delonix.io/v1alpha1
kind: Pod
metadata: { name: db }
spec:
  network: appnet
  containers:
    - name: db
      image: "postgres:16"
      env:
        - { name: POSTGRES_PASSWORD, value: dev }
---
apiVersion: compute.delonix.io/v1alpha1
kind: Pod
metadata: { name: app }
spec:
  network: appnet
  containers:
    - name: app
      image: "alpine:3.19"
      command: ["sleep", "infinity"]
---
apiVersion: networking.delonix.io/v1alpha1
kind: Dependency
metadata: { name: app-knows-db }
spec:
  from: app          # quem inicia (o "conhecedor")
  to: db             # alvo protegido (aceita um nome ou uma lista: [db, cache])
  ports: ["5432"]    # opcional — vazio = qualquer porta
  proto: tcp         # opcional — default any
