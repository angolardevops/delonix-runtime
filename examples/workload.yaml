# Workload — one declarative object for BOTH compute types (ADR-0001).
#
#   delonix stack apply -f examples/workload.yaml
#   delonix stack apply --dry-run -f examples/workload.yaml   # see what it lowers to
#
# A `kind: Workload` is sugar: it does NOT survive the load — it is rewritten into
# a `kind: Container` or `kind: VirtualMachine` and flows through the normal per-Kind apply,
# exactly like a `kind: Stack` child. `spec.type` picks the type; the block named
# after the type (`container:` / `vm:`) is the SAME spec the standalone Kind takes
# (see examples/container.yaml and examples/vm.yaml for every field).
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: web
  namespace: default
spec:
  type: container          # container | vm   (pod / microvm are reserved — a clear error, not silent)
  container:               # == kind: Container spec (examples/container.yaml)
    image: nginx:alpine
    restartPolicy: always
    env:
      - TZ=Africa/Luanda
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: db
spec:
  type: vm                 # lowers to kind: VirtualMachine
  vm:                      # == kind: VirtualMachine spec (examples/vm.yaml)
    disk: delonix-vm-k8s:1.34
    vcpus: 2
    memory: 4G
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: web-app
spec:
  type: pod                # lowers to kind: Pod (real multi-container pod)
  pod:                     # == kind: Pod spec (examples/pod-multi.yaml)
    containers:
      - { name: web, image: nginx:latest }
      - { name: sidecar, image: busybox:latest }
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: fast-vm
spec:
  type: microvm            # lowers to kind: VirtualMachine, forcing the microVM hypervisor
  microvm:                 # == kind: VirtualMachine spec, but backend is forced to cloud-hypervisor
    disk: ubuntu-24.04.qcow2   # needs a CH-bootable image (not the libvirt-only k8s golden)
    vcpus: 2
    memory: 2G
    # backend: libvirt       # <- a contradiction: type: microvm rejects it (use type: vm)
