# VM com volumes montados — fecha o gap "dar storage a uma VM sem escrever
# cloud-init nem XML de libvirt". O `spec.volumes` refere um `kind: Volume` por
# NOME — local, ou com um bloco de rede (`nfs:`/`cifs:`/`webdav:`) para um NAS —
# e o motor partilha-o para dentro da VM por **virtio-9p**, injectando o mount
# no guest.
#
#   delonix stack apply -f examples/vm-volumes.yaml
#
# Notas:
#  * Só o backend **libvirt** materializa 9p — o apply escolhe-o sozinho quando
#    há volumes (o Cloud Hypervisor não suporta 9p).
#  * O volume tem de existir antes da VM (o stack aplica-os primeiro; o
#    `stack validate` confirma a referência).
---
# Um volume de rede (NAS) — vira o directório partilhado para a VM.
apiVersion: storage.delonix.io/v1alpha1
kind: Volume
metadata:
  name: dados-nas
spec:
  nfs:
    server: 10.0.0.5
    share: /mnt/pool/dados
---
apiVersion: compute.delonix.io/v1alpha1
kind: VirtualMachine
metadata:
  name: app-vm
spec:
  disk: k8s-golden           # imagem base (qcow2/raw)
  vcpus: 2
  memory: 2G
  volumes:
    - name: dados-nas        # o kind: Volume acima
      mountPath: /mnt/dados  # onde a VM o monta
      readOnly: false
