# ============================================================================
# kind: Workload — UM objecto declarativo para todo o tipo de compute (ADR-0001/0006)
# kind: Workload — ONE declarative object for every compute type (ADR-0001/0006)
#
# PT: Um Workload é açúcar: NÃO sobrevive ao load — é reescrito no Kind alvo e
#     flui pelo apply normal desse Kind. `spec.type` escolhe o alvo e o bloco com
#     o nome do type carrega EXACTAMENTE o spec desse Kind (nada é redefinido):
#       type: container -> spec.container == kind: Container     (compute/container.yaml)
#       type: vm        -> spec.vm        == kind: VirtualMachine (compute/virtualmachine.yaml)
#       type: pod       -> spec.pod       == kind: Pod           (compute/pod.yaml)
#       type: microvm   -> spec.microvm   == kind: VirtualMachine, backend FORÇADO a cloud-hypervisor
#     Exactamente UM bloco, o que casa com `type` (qualquer outro é erro). O
#     `metadata` (name/namespace/labels/annotations) é herdado pelo recurso baixado.
# EN: A Workload is sugar: it does NOT survive the load — it is rewritten into the
#     target Kind and flows through that Kind's normal apply. `spec.type` picks
#     the target and the block named after the type carries EXACTLY that Kind's
#     spec (nothing is redefined):
#       type: container -> spec.container == kind: Container     (compute/container.yaml)
#       type: vm        -> spec.vm        == kind: VirtualMachine (compute/virtualmachine.yaml)
#       type: pod       -> spec.pod       == kind: Pod           (compute/pod.yaml)
#       type: microvm   -> spec.microvm   == kind: VirtualMachine, backend FORCED to cloud-hypervisor
#     Exactly ONE block, the one matching `type` (any other is an error). The
#     `metadata` (name/namespace/labels/annotations) is inherited by the lowered resource.
#
# PT: Aplicar:   delonix stack apply -f examples/compute/workload.yaml
#     Ver o que baixa:  delonix stack apply --dry-run -f examples/compute/workload.yaml
# EN: Apply:     delonix stack apply -f examples/compute/workload.yaml
#     See what it lowers to:  delonix stack apply --dry-run -f examples/compute/workload.yaml
# ============================================================================

# ── 1. recursos de apoio para os cenários abaixo ────────────────────────────
#      supporting resources for the scenarios below
---
apiVersion: networking.delonix.io/v1alpha1
kind: Network
metadata:
  name: wl-net
spec:
  driver: bridge
---
apiVersion: core.delonix.io/v1alpha1
kind: Secret
metadata:
  name: wl-secret
spec:
  stringData:
    API_TOKEN: example-token-not-real
---
apiVersion: storage.delonix.io/v1alpha1
kind: Volume
metadata:
  name: wl-data
spec:
  driver: local

# ── 2. type: container — o spec de Container plano, todos os campos ──────────
#      type: container — the flat Container spec, every field
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-container
  namespace: default                  # PT: herdado pelo Container baixado | EN: inherited by the lowered Container
  labels: { tier: backend }
  annotations: { example.delonix.io/note: lowers-to-container }
spec:
  type: container                     # PT: container | vm | pod | microvm | EN: container | vm | pod | microvm
  container:
    image: nginx:alpine               # PT: OBRIGATÓRIO | EN: REQUIRED
    detach: true
    command: ["nginx", "-g", "daemon off;"]
    entrypoint: /docker-entrypoint.sh
    user: "101:101"
    hostname: wl-container-host
    restartPolicy: always             # PT: default é "no" | EN: default is "no"
    addHost: ["legacy-api:10.0.0.9"]
    labels: ["team=platform"]
    logDriver: json
    network: wl-net
    ports: ["18090:80"]
    expose: 80
    networkAlias: [wl-web]
    netBps: 10mbit
    netBurst: 20mbit
    memory: 256M
    cpus: "0.5"
    cpuWeight: "200"
    cpuset: "0"
    ioWeight: "100"
    cgroupParent: { name: wl-tier, memoryMax: "1073741824", cpus: "2", pidsMax: "512" }
    readOnly: true
    capDrop: ["ALL"]
    capAdd: ["NET_BIND_SERVICE"]
    securityOpt: ["no-new-privileges"]
    userns: true
    volumes: ["wl-data:/var/lib/app"]
    tmpfs: ["/tmp"]
    env: ["TZ=Africa/Luanda"]
    secret: [wl-secret]
    secretFiles: true
    ulimit: ["nofile=1024:2048"]
    sysctl: ["net.core.somaxconn=1024"]

# ── 3. type: container — o spec de Container agrupado ────────────────────────
#      type: container — the grouped Container spec
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-container-grouped
spec:
  type: container
  container:
    image: busybox:latest
    command: ["sleep", "infinity"]
    restartPolicy: unless-stopped     # PT: no | on-failure[:max] | always | unless-stopped | EN: no | on-failure[:max] | always | unless-stopped
    resources: { memory: 128M, cpus: "0.25", cpuWeight: "100", ioWeight: "50" }
    network: { name: wl-net, alias: [wl-grouped], rateBps: 5mbit, rateBurst: 10mbit }
    security: { readOnly: true, capDrop: [ALL], userns: true }
    storage: { volumes: ["wl-data:/data"], tmpfs: ["/tmp"] }
    env: { vars: ["MODE=grouped"], secrets: [wl-secret], secretFiles: false }
    limits: { ulimit: ["nofile=512:1024"], sysctl: ["net.core.somaxconn=512"] }

# ── 4. type: pod — um pod multi-contentor (forma k8s), todos os campos de pod ─
#      type: pod — a multi-container pod (k8s-shaped), every pod-level field
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-pod
spec:
  type: pod
  pod:
    network: wl-net                   # PT: rede SDN do netns partilhado do pod | EN: SDN network of the pod's shared netns
    restartPolicy: OnFailure          # PT: Always | OnFailure | Never | EN: Always | OnFailure | Never
    hostname: wl-pod-host
    shareProcessNamespace: true       # PT: os membros veem os processos uns dos outros | EN: members see each other's processes
    hostAliases:
      - ip: 10.0.0.9
        hostnames: [legacy-api]
    volumes:
      - name: scratch
        emptyDir: { medium: Memory }
      - name: data
        persistentVolumeClaim: { claimName: wl-data }
      - name: host-files
        hostPath: { path: /srv/www }
    containers:
      - name: web
        image: nginx:latest
        command: ["/bin/sh", "-c"]
        args: ["nginx -g 'daemon off;'"]
        workingDir: /usr/share/nginx/html
        ports:
          - { containerPort: 80, hostPort: 18091, protocol: TCP, hostIP: 127.0.0.1 }
        env:
          - { name: TZ, value: Africa/Luanda }
        volumeMounts:
          - { name: scratch, mountPath: /tmp/cache }
          - { name: data, mountPath: /var/lib/web }
          - { name: host-files, mountPath: /usr/share/nginx/html, readOnly: true }
        resources:
          limits: { cpu: "500m", memory: 256Mi }
        securityContext:
          privileged: false
          runAsUser: 101
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
      - name: sidecar
        image: busybox:latest
        command: ["sleep", "infinity"]

# ── 5. type: vm — um spec de VirtualMachine completo (backend libvirt), plano ─
#      type: vm — a full VirtualMachine spec (libvirt backend), flat shape
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-vm
spec:
  type: vm
  vm:
    disk: delonix-vm-base:ubuntu-24.04
    provider: { type: libvirt }       # PT: `vm` aceita qualquer backend (ao contrário de `microvm`) | EN: `vm` accepts any backend (unlike `microvm`)
    restartPolicy: always
    vcpus: 2
    memory: 4G
    hugepages: false
    cpuAffinity: "0-1"
    network: wl-net
    netMode: nat
    ip: 192.168.122.60
    vnc: true
    hostname: wl-vm
    sshKeys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExample admin@example"]
    userData: "@/etc/delonix/examples/user-data.yaml"
    volumes:
      - { name: wl-data, mountPath: /mnt/data, readOnly: false }
    machine: q35
    cpuModel: host-model
    cpuTopology: { sockets: 1, cores: 2, threads: 1 }
    tpm: true
    video: virtio
    bootOrder: [hd]
    extraDisks:
      - { source: /var/lib/libvirt/images/wl-extra.qcow2, bus: virtio, format: qcow2, readOnly: false, target: vdb }
    extraNics:
      - { type: network, source: default, model: virtio }
    libvirtXmlOverlay:
      - "<memballoon model='virtio'/>"

# ── 6. type: vm — o spec de VirtualMachine agrupado ──────────────────────────
#      type: vm — the grouped VirtualMachine spec
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-vm-grouped
spec:
  type: vm
  vm:
    disk: delonix-vm-base:ubuntu-24.04
    resources: { vcpus: 2, memory: 2G }
    network: { name: wl-net, mode: nat, staticIp: 192.168.122.61 }
    cloudInit: { hostname: wl-vm-grouped }
    provider: { type: libvirt, spec: { machine: q35 } }

# ── 7. type: microvm — VM no hipervisor microVM; backend FORÇADO a cloud-hypervisor
#      type: microvm — a VM on the microVM hypervisor; backend FORCED to cloud-hypervisor
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: wl-microvm
spec:
  type: microvm
  microvm:
    disk: delonix-vm-base:ubuntu-24.04  # PT: precisa de imagem que arranque em CH (não a golden k8s só-libvirt) | EN: needs an image that boots on CH (not the libvirt-only k8s golden)
    provider: { type: cloud-hypervisor }   # PT: opcional: só o valor cloud-hypervisor é aceite | EN: optional: only the value cloud-hypervisor is accepted
    vcpus: 2
    memory: 2G
    network: wl-net
    firmware: /usr/local/share/delonix/CLOUDHV.fd
    hostname: wl-microvm
    restartPolicy: on-failure
    hugepages: false
    cpuAffinity: "2-3"
    sshKeys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExample admin@example"]
