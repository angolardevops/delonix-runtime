# kind: Pod — the familiar k8s schema: spec.containers[] with structured
# ports/env/resources/securityContext + pod-level volumes. Apply with:
#   delonix stack apply -f examples/pod.yaml
#
# The SAME schema is still accepted on a `kind: Container`, but with a
# deprecation warning, and it is deliberately not rewritten for you: a
# `kind: Container` named `web` creates a container called `web`, while this
# creates the pod netns `pod-web` whose member is `web-c0`. Renaming a workload
# behind your back would break DNS, HTTPRoute backends and cross-references.
#
# For a pod with SEVERAL containers sharing the namespaces, see pod-multi.yaml.
# The flat single-container spec (see examples/*, `image:` at the top) still works.
# ---------------------------------------------------------------------------
# A rede que o pod usa, declarada aqui para o exemplo validar sozinho.
# ---------------------------------------------------------------------------
apiVersion: delonix.io/v1
kind: Network
metadata:
  name: web-net
spec:
  driver: bridge
---
apiVersion: delonix.io/v1
kind: Pod
metadata:
  name: web
  namespace: default
spec:
  # delonix extensions (pod-level):
  network: web-net            # host | none | <custom network>
  restartPolicy: Always       # Always | OnFailure | Never  (delonix values also OK)
  expose: 80                  # auto-register this HTTP port in the L7 proxy (optional)
  hostAliases:                # extra /etc/hosts entries, k8s shape (one entry per hostname)
    - ip: 10.0.0.9
      hostnames: [legacy-api, legacy-api.internal]
  containers:
    - name: web
      image: nginx:latest
      command: ["/bin/sh", "-c"]         # overrides ENTRYPOINT (k8s semantics)
      args: ["nginx -g 'daemon off;'"]   # overrides CMD
      ports:
        - containerPort: 80
          hostPort: 8080                 # published only when hostPort is set
          protocol: TCP
      env:
        - name: TZ
          value: UTC
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: scratch
          mountPath: /tmp/cache
      resources:
        limits:
          cpu: "500m"                     # 500m → 0.5 cores
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE"]
  volumes:
    - name: site
      hostPath:
        path: /srv/www                    # bind mount
    - name: scratch
      emptyDir: {}                        # ephemeral → tmpfs
