# Volume — a named local volume (data survives `container rm`). For NETWORK
# storage (NFS/SMB/WebDAV) the SAME Kind takes an `nfs:`/`cifs:`/`webdav:` block
# (see examples/storage.yaml).
# Apply with:  delonix volumes apply -f examples/volume.yaml
apiVersion: storage.delonix.io/v1alpha1
kind: Volume
metadata:
  name: appdata
spec:
  driver: local             # local | nfs (for a NAS, prefer an `nfs:` block — storage.yaml)
  quota: null               # size cap, e.g. "2g" (hard cap as root, monitored in rootless)
  device: null              # nfs export "server:/export" (only with driver: nfs)
  mountOptions: null        # mount options, e.g. "vers=4,ro" (only with driver: nfs)  (alias: options)
