# kind: NetworkGateway — aliases and filter rules on a perimeter firewall
# appliance (ADR-0051). `spec.provider` names a registered gateway provider:
# `opnsense`, registered through DELONIX_OPNSENSE_URL and a credential — a
# generated API key/secret pair (DELONIX_OPNSENSE_CREDENTIAL names a
# `kind: Secret` with `key` and `secret`); an account's password is refused by
# the appliance. `manifest validate` does not contact it.
#
# Aliases are applied before rules and removed after them, because the
# appliance checks a rule's source against its alias table. A rule is FOUND by
# its `description` and an alias by its `name`, but OWNED only when it carries
# this document's owner mark — a firewall category `delonix-owner:<token>` the
# engine creates and attaches. One with the same name and no mark is refused,
# never adopted, and the teardown leaves it alone. The apply is also refused
# while the appliance has changes someone saved and did not apply: its apply
# pushes everything staged. There is no update in place: a changed spec is
# removed and applied again.
#
# `policies` declare one direction of a target's policy in the shape a
# NetworkPolicy has, lowered to the appliance's filter rules (ADR-0059 F3d):
# rule n lands as `<name>#<n>` at `sequence + n - 1`, and the default verdict
# as `<name>#default` right after. The appliance loads filter rules in
# `sequence` order, so the first match here is its first match. A peer that
# names this engine's workloads has no form on the appliance and is refused.
apiVersion: networking.delonix.io/v1alpha1
kind: NetworkGateway
metadata: { name: edge }
spec:
  # ADR-0071 block form; the scalar `provider: opnsense` is the same thing.
  provider: { type: opnsense }
  aliases:
    - name: delonix_web
      kind: host            # host | network
      content: ["10.20.0.10", "10.20.0.11"]
      description: web tier
  rules:
    - description: office to web tier
      source: 192.168.1.0/24   # an alias name, a CIDR, or any
      destination: delonix_web
      protocol: TCP            # omit for any protocol
  policies:
    - name: web-in
      target: delonix_web      # an alias name, a prefix, or an address
      direction: ingress       # ingress (to the target) | egress (from it)
      defaultPolicy: deny      # the last rule's verdict; deny when omitted
      sequence: 30000          # the first rule's position on the appliance
      rules:
        - { proto: tcp, port: "443", from: 192.168.1.0/24 }
        - { proto: tcp, port: "22", from: 10.9.0.0/24, log: true }
        - { port: "8000-8080", action: deny, stateful: false }
