# ============================================================================
# kind: Service (ADR-0032) — um conjunto de workloads seleccionado por label
# kind: Service (ADR-0032) — a set of workloads picked by label
#
# PT: `type: DNS` (default) publica o conjunto como MÚLTIPLOS registos DNS `A`
#     sob <nome>.<namespace>.delonix.internal, em ordem rotativa a cada consulta
#     (round-robin) — sem VIP, sem dataplane L4, sem daemon. `type: VirtualIP`
#     (ADR-0066) pega UM endereço do pool de VIP do operador; o nome resolve para
#     esse endereço e o holder faz DNAT de cada ligação nova para um backend
#     pronto. A membership é recomputada dentro de um TTL do índice DNS (~2s): um
#     workload acrescentado, removido ou relabelado aparece sem reaplicar.
# EN: `type: DNS` (default) publishes the set as MULTIPLE DNS `A` records under
#     <name>.<namespace>.delonix.internal, in rotating order (round-robin) — no
#     VIP, no L4 dataplane, no daemon. `type: VirtualIP` (ADR-0066) takes ONE
#     address from the operator's VIP pool; the name resolves to that address and
#     the holder DNATs each new connection to a ready backend. Membership is
#     recomputed within a DNS-index TTL (~2s): a workload added, removed or
#     relabelled shows up without re-applying.
#
# PT: Campos spec: selector.matchLabels (AND lógico), port (porta do CONTAINER,
#     nunca de host/VIP), type, vip, readiness, publish. Um selector vazio/sem
#     match resolve para conjunto vazio — não é erro, mas o apply avisa.
# EN: spec fields: selector.matchLabels (logical AND), port (the CONTAINER-side
#     port, never a host/VIP port), type, vip, readiness, publish. An empty/no-match
#     selector resolves to an empty set — not an error, but apply warns.
#
# PT: Aplicar:  delonix stack apply -f examples/networking/service.yaml
# EN: Apply:    delonix stack apply -f examples/networking/service.yaml
# ============================================================================

# ── 0. Recursos de apoio INLINE — a rede e os workloads que os Services apanham
#      Supporting resources INLINE — the network and workloads the Services pick
---
apiVersion: networking.delonix.io/v1alpha1
kind: Network
metadata: { name: appnet }
spec: { driver: bridge }
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: web-1
  labels: { app: web, tier: frontend, track: stable }   # PT: labels viajam pelo Workload → container rotulado | EN: labels flow through Workload → labelled container
spec:
  type: container
  container: { image: "nginx:alpine", network: appnet }
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: web-2
  labels: { app: web, tier: frontend, track: canary }
spec:
  type: container
  container: { image: "nginx:alpine", network: appnet }
---
apiVersion: compute.delonix.io/v1alpha1
kind: Workload
metadata:
  name: api-1
  namespace: team-a            # PT: um namespace diferente de `default` | EN: a namespace other than `default`
  labels: { app: api }
spec:
  type: container
  container: { image: "caddy:alpine", network: appnet }

# ── 1. selector de uma label, namespace `default` ────────────────────────────
#      single-label selector, namespace `default`
#
# PT: Clientes resolvem web.default.delonix.internal e recebem web-1 e web-2 em rotação.
# EN: Clients resolve web.default.delonix.internal and get web-1 and web-2 in rotation.
---
apiVersion: networking.delonix.io/v1alpha1
kind: Service
metadata:
  name: web
  namespace: default
spec:
  selector:
    matchLabels:
      app: web                 # PT: toda a label listada tem de corresponder | EN: every listed label must match
  port: 80                     # PT: porta CONTAINER-side onde os membros escutam | EN: container-side port the members listen on

# ── 2. selector multi-label — estreita o conjunto só ao track estável (web-1) ─
#      multi-label selector — narrows the set to the stable track only (web-1)
---
apiVersion: networking.delonix.io/v1alpha1
kind: Service
metadata:
  name: web-stable
spec:                          # PT: namespace omitido = `default` | EN: namespace omitted = `default`
  selector:
    matchLabels:
      app: web
      track: stable
  port: 80

# ── 3. Service noutro namespace — resolve como api.team-a.delonix.internal ────
#      Service in another namespace — resolves as api.team-a.delonix.internal
#
# PT: O isolamento de namespace aplica-se ao DNS: outros namespaces dão NXDOMAIN
#     (excepto os serviços em `default`).
# EN: Namespace isolation applies to DNS: other namespaces get NXDOMAIN (except
#     services in `default`).
---
apiVersion: networking.delonix.io/v1alpha1
kind: Service
metadata:
  name: api
  namespace: team-a
spec:
  selector:
    matchLabels:
      app: api
  port: 8080

# ── 4. type: VirtualIP (ADR-0066) — UM endereço do pool de VIP do operador ───
#      type: VirtualIP (ADR-0066) — ONE address from the operator's VIP pool
#
# PT: O nome resolve para esse endereço e o holder faz DNAT de cada ligação nova
#     para um backend PRONTO (numgen aleatório). Pronto = a porta aceita um TCP
#     connect do holder E (se declarado) está healthy. Pool por
#     `delonix network vip-pool set`.
# EN: The name resolves to that address and the holder DNATs each new connection
#     to a READY backend (random numgen). Ready = the port accepts a TCP connect
#     from the holder AND (if declared) is healthy. Pool set via
#     `delonix network vip-pool set`.
---
apiVersion: networking.delonix.io/v1alpha1
kind: Service
metadata:
  name: web-vip
  namespace: default
spec:
  selector:
    matchLabels:
      app: web                 # PT: mesmos backends da #1: web-1 e web-2 | EN: same backends as #1: web-1 and web-2
  port: 80                     # PT: porta CONTAINER-side (= porta do VIP; uma só em v1) | EN: container-side port (= the VIP port; a single one in v1)
  type: VirtualIP              # PT: DNS (default) | VirtualIP | EN: DNS (default) | VirtualIP
  vip: 10.80.0.5               # PT: IPv4 pontilhado dentro do pool; omitir = IPAM escolhe | EN: dotted IPv4 inside the pool; omit = IPAM picks
  readiness:                   # PT: knobs da sonda TCP (todos opcionais) | EN: knobs of the TCP readiness probe (all optional)
    tcp:
      intervalSeconds: 2       # PT: default 2 s | EN: default 2 s
      timeoutMilliseconds: 500 # PT: default 500 ms | EN: default 500 ms
      successThreshold: 1      # PT: sucessos para admitir; default 1 | EN: successes to admit; default 1
      failureThreshold: 2      # PT: falhas para ejectar; default 2 | EN: failures to eject; default 2
  publish: [8080, 8443]        # PT: portas de host que levam aos backends do VIP (127.0.0.1 salvo DELONIX_PUBLISH_ADDR) | EN: host ports that lead to the VIP's backends (127.0.0.1 unless DELONIX_PUBLISH_ADDR)
