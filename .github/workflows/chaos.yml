name: Chaos

# Corre o arnês de caos (`scripts/chaos.sh`) num runner LIMPO.
#
# Porque existe um workflow separado do `ci.yml`: os testes unitários e o clippy
# provam propriedades do código; isto prova propriedades do SISTEMA A CORRER, e
# só as encontra quem o parte de propósito. Todos os bugs mais graves desta série
# vieram daqui e nenhum de leitura de código:
#
#   * o holder volta e cada container fica sem rede PARA SEMPRE;
#   * `container rm` deixava o rootfs inteiro em disco (a fuga de disk-pressure);
#   * o isolamento por namespace estava desligado — e nada falhava, porque uma
#     firewall que nunca é instalada não devolve erro;
#   * uma recuperação falhada derrubava a infra que tinha acabado de arrancar.
#
# E — a razão de ser deste ficheiro — vários deles SÓ aparecem num host limpo. O
# instalador morria em qualquer máquina sem GPU; os limites de recurso são inertes
# numa sessão sem cgroup delegado. Nenhum dos dois é visível na máquina de quem
# escreve o código. Um runner do GitHub é uma VM limpa: é o ambiente certo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal, à segunda de manhã. O caos não é só um gate de PR: apanha
    # regressões que vêm de mudanças no HOST (kernel, systemd, iproute2), não do
    # nosso código — e essas ninguém dispara com um commit.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Nº de containers no cenário `scale`'
        default: '30'
      scenarios:
        description: 'Cenários a correr (vazio = todos)'
        default: ''

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: chaos harness (runner limpo)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instala protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Instala toolchain fixada
        run: rustup show

      # As mesmas dependências que o `install.sh` exige. Deliberadamente NÃO se
      # corre o `install.sh` aqui: este job tem de exercitar o motor, e um
      # instalador partido deve falhar no seu próprio teste, não neste.
      - name: Dependências rootless
        run: sudo apt-get install -y -qq slirp4netns uidmap nftables iproute2 conntrack

      - name: Constrói o binário
        run: cargo build --release -p delonix-runtime-bin

      # O passo que este projecto aprendeu à força: sem um cgroup DELEGADO os
      # limites de recurso são silenciosamente inertes, e o arnês reportá-lo-ia
      # como ambiente em vez de os testar. Medido: numa sessão sem delegação,
      # `-m 128M` deixa `memory.max=max`.
      - name: Prepara a delegação de cgroup
        run: |
          sudo loginctl enable-linger "$USER" || true
          systemctl --user show-environment >/dev/null 2>&1 \
            && echo "gestor de utilizador: presente" \
            || echo "gestor de utilizador: AUSENTE (os cenários de limites farão skip)"

      # O Ubuntu 23.10+ traz `kernel.apparmor_restrict_unprivileged_userns=1`: um
      # binário SEM perfil não pode criar user namespaces, e o motor morre logo no
      # `unshare()`. É o mesmo perfil que o `install.sh` escreve. A primeira versão
      # deste workflow omitiu-o de propósito («o arnês não deve depender do
      # instalador») e o resultado foi uma bateria inteira de SKIPs a tapar a causa.
      - name: Perfil AppArmor para userns
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile delonix %s/target/release/delonix flags=(unconfined) {\n  userns,\n}\n' "$PWD" \
              | sudo tee /etc/apparmor.d/delonix >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/delonix
            echo "perfil AppArmor instalado"
          else
            echo "o host não restringe userns — perfil desnecessário"
          fi

      # PREFLIGHT, e faz DUAS perguntas distintas que nunca se podem confundir:
      #
      #   1. este host CONSEGUE correr o motor?   → problema de AMBIENTE
      #   2. o motor arranca?                     → problema de CÓDIGO
      #
      # A lição que o obrigou a existir: o arnês silencia a saída de cada comando
      # (é o que o torna legível), por isso um motor que nem arranca produzia uma
      # parede de SKIPs sem UMA linha a dizer porquê.
      #
      # MEDIDO no runner alojado `ubuntu-24.04`: user namespaces não privilegiados
      # estão bloqueados —
      #
      #     unshare: write failed /proc/self/uid_map: Operation not permitted
      #
      # …e sem eles um motor rootless não corre de todo. Isso NÃO é uma falha do
      # Delonix, e marcar o job vermelho por causa disso todas as semanas só ensina
      # a ignorar o CI. Quando o ambiente não dá, o job diz-o alto e sai verde SEM
      # afirmar que passou; quando o ambiente dá e o motor falha, é vermelho.
      - name: Preflight — o ambiente suporta rootless?
        id: preflight
        run: |
          if unshare -r -n true 2>/tmp/userns.err; then
            echo "userns=ok" >> "$GITHUB_OUTPUT"
            echo "user namespaces: disponíveis"
          else
            echo "userns=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning title=Arnês de caos NÃO CORREU::user namespaces não privilegiados bloqueados neste runner — $(cat /tmp/userns.err)"
            {
              echo '## Arnês de caos — NÃO CORREU'
              echo
              echo 'O runner alojado não permite user namespaces não privilegiados:'
              echo
              echo '```'
              cat /tmp/userns.err
              echo '```'
              echo
              echo 'Um motor rootless não corre sem eles. **Isto não é um resultado do arnês** —'
              echo 'nada foi provado nesta corrida.'
              echo
              echo 'Para o exercitar a sério é preciso um runner **self-hosted**, ou uma VM'
              echo '(`delonix vm create` + `scripts/chaos.sh`), que é como os achados desta'
              echo 'série foram encontrados.'
              [ -e /dev/kvm ] && echo && echo '`/dev/kvm` está presente: uma VM aninhada neste runner é viável como passo seguinte.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Puxa a imagem de teste
        if: steps.preflight.outputs.userns == 'ok'
        run: |
          ./target/release/delonix image pull docker.io/library/redis:7-alpine

      # Só corre quando o ambiente dá. Aqui um erro é do MOTOR, e é vermelho.
      - name: Preflight — o motor arranca?
        if: steps.preflight.outputs.userns == 'ok'
        run: |
          set -x
          export DELONIX_ROOT=/tmp/dlx-preflight DELONIX_NET_RUNTIME_DIR=/tmp/dlx-pf
          mkdir -p "$DELONIX_ROOT" "$DELONIX_NET_RUNTIME_DIR"
          for d in images layers blobs; do ln -sfn "$HOME/.local/share/delonix/$d" "$DELONIX_ROOT/$d"; done
          ./target/release/delonix net netns up
          ./target/release/delonix container run -d --name preflight --net none \
            docker.io/library/redis:7-alpine sleep 20
          ./target/release/delonix container ps
          ./target/release/delonix container rm -f preflight
          ./target/release/delonix net netns down || true
          rm -rf "$DELONIX_ROOT" "$DELONIX_NET_RUNTIME_DIR"

      # `systemd-run --scope -p Delegate=yes` é o que dá ao arnês um cgroup onde
      # os limites aplicam mesmo. Se o runner não tiver gestor de utilizador, o
      # arnês faz SKIP dos cenários afectados e continua — o exit code só reflecte
      # FALHAS, nunca skips.
      - name: Corre o arnês de caos
        if: steps.preflight.outputs.userns == 'ok'
        env:
          DELONIX_CHAOS_BIN: ./target/release/delonix
          DELONIX_CHAOS_SCALE: ${{ github.event.inputs.scale || '30' }}
          DELONIX_CHAOS_IMAGE: docker.io/library/redis:7-alpine
        run: |
          set -o pipefail
          if systemctl --user show-environment >/dev/null 2>&1; then
            systemd-run --user --scope -p Delegate=yes -q -- \
              bash scripts/chaos.sh ${{ github.event.inputs.scenarios }} 2>&1 | tee chaos.log
          else
            bash scripts/chaos.sh ${{ github.event.inputs.scenarios }} 2>&1 | tee chaos.log
          fi

      # A bateria E2E ao lado do caos, e não no `ci.yml`, pela mesma razão: toca
      # no estado REAL (containers, redes, volumes) e precisa do mesmo ambiente
      # rootless que os passos acima já montaram. Duplicá-lo noutro workflow era
      # manter duas cópias do preflight.
      #
      # Porque isto passou a ser um gate: a bateria não corria desde a v0.3.0 —
      # quarenta e quatro versões — e quando correu tinha nove falhas, oito delas
      # porque o TESTE codificava um bug que entretanto foi corrigido. Uma bateria
      # que ninguém corre não prova nada e ainda mente sobre o que cobre.
      #
      # `DELONIX_ROOT`/`DELONIX_NET_RUNTIME_DIR` próprios: mesmo isolamento do
      # arnês, para o E2E nunca tocar no que outro passo deixou de pé.
      - name: Bateria E2E da CLI
        if: steps.preflight.outputs.userns == 'ok'
        run: |
          set -o pipefail
          E2E=/tmp/dlx-e2e
          rm -rf "$E2E"; mkdir -p "$E2E/root" "$E2E/run"
          for d in images layers blobs; do
            ln -sfn "$HOME/.local/share/delonix/$d" "$E2E/root/$d"
          done
          export DELONIX_ROOT="$E2E/root" DELONIX_NET_RUNTIME_DIR="$E2E/run"
          export DELONIX_NO_CGROUP_WARN=1 OUT=/tmp/delonix-e2e
          export E2E_IMAGE=docker.io/library/redis:7-alpine
          bash scripts/e2e.sh ./target/release/delonix 2>&1 | tee e2e.log
          ./target/release/delonix net netns down >/dev/null 2>&1 || true

      # O resumo no sumário do job para não ser preciso abrir os logs — e para
      # que um SKIP fique visível em vez de se perder no ruído. Um skip não falha
      # o job, mas é informação: significa que aquela propriedade não foi provada.
      - name: Resumo
        if: always() && steps.preflight.outputs.userns == 'ok'
        run: |
          {
            echo '## Arnês de caos'
            echo
            echo '```'
            sed -n '/── resumo ──/,$p' chaos.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo '(sem resumo — ver o log do passo anterior)'
            echo '```'
            echo
            echo '## Bateria E2E'
            echo
            echo '```'
            grep -E '^ (PASS|FAIL|SKIP)=|^ *- ' e2e.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo '(sem resumo)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guarda o log
        if: always() && steps.preflight.outputs.userns == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: chaos-log
          path: |
            chaos.log
            e2e.log
          retention-days: 30

      # O motor deixa infra por-nó (holder netns, slirp) e directórios de
      # container. Num runner descartável não faria diferença — mas se este job
      # alguma vez correr num runner self-hosted, deixar isso para trás é
      # exactamente a fuga que o próprio arnês existe para apanhar.
      - name: Limpeza
        if: always()
        run: bash scripts/chaos.sh --clean || true
