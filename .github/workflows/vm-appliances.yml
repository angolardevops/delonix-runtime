# Constrói uma imagem de appliance (OPNsense, Proxmox, TrueNAS) e publica-a no
# ghcr — as que o `delonix vm create --disk <nome>` usa sem instalação nenhuma.
#
# Um produto por execução, de propósito: cada build arranca uma VM com 4-6 GiB
# e escreve vários GiB em disco, e o runner não tem folga para os fazer em
# paralelo.
#
# Disparo MANUAL — publicar uma imagem oficial é uma decisão explícita.
#
# OS ISOs: os TRÊS scripts obtêm e verificam o media sozinhos (v0.48.0). Basta
# a `version`; `iso_url`/`iso_sha256` ficam para um media que o fabricante não
# publique no sítio do costume — uma build interna, um mirror próprio.
#
# A nota anterior dizia que os ISOs do Proxmox «NÃO são descarregáveis da
# máquina onde isto foi escrito» e por isso exigia os dois inputs. O host que
# ela nomeia (`download.proxmox.com`) responde mesmo 000 daqui — mas **não é
# de lá que os ISOs vêm**: a página oficial de downloads
# (proxmox.com/en/downloads/…/iso) aponta EXCLUSIVAMENTE para
# `enterprise.proxmox.com` (verificado a 2026-08-13: 9 ocorrências, zero da
# outra), que é onde estão os ISOs e o `SHA256SUMS`, e por onde as quatro
# imagens novas foram construídas. `download.proxmox.com` serve os
# repositórios apt, não este media. É o host que o `build-proxmox.sh` usa por
# omissão (`PROXMOX_MIRROR` para o trocar).
#
# O checksum nunca é opcional: com `iso_url` o `iso_sha256` passa a ser
# obrigatório, e sem ele o script resolve-o no `SHA256SUMS` do fabricante. Um
# download por verificar não chega ao build por nenhum dos dois caminhos.
name: VM appliance images

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Appliance a construir"
        type: choice
        options:
          - opnsense
          - pve
          - pbs
          - pmg
          - pdm
          - truenas
        required: true
      version:
        description: "Versão COMPLETA, para DESCARREGAR (ex.: 26.1.2, 9.2-1, 25.10.5) — tem de existir no fabricante. Vazio = a versão fixada no script"
        default: ""
      tag:
        description: "Tag de publicação (vazio = a SÉRIE da versão, `26.1.2` → `26.1`). A convenção deste projecto é a série, como `delonix-vm-k8s:1.34`"
        default: ""
      iso_url:
        description: "URL do ISO — só para media que o fabricante não publique no sítio do costume. Vazio = o script descarrega e verifica sozinho"
        default: ""
      iso_sha256:
        description: "SHA-256 do ISO — OBRIGATÓRIO se iso_url for dado"
        default: ""
      dest_repo:
        description: "Repositório OCI de destino"
        default: "ghcr.io/angolardevops/delonix-vm-appliances"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler qemu-system-x86 qemu-utils xorriso python3-venv curl
          # Sem /dev/kvm os scripts caem para TCG sozinhos; vale registar qual foi.
          if [ -w /dev/kvm ]; then echo "KVM: disponível"; else echo "KVM: AUSENTE (build em TCG, lento)"; fi

      - name: Espaço em disco
        run: |
          # Um build escreve o ISO (~2 GiB), a árvore extraída (~2 GiB) e o
          # disco da VM (cresce até ~4 GiB). O `/` do runner não tem folga
          # para isso; `/mnt` tem.
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo mkdir -p /mnt/appliances && sudo chown "$USER" /mnt/appliances
          df -h / /mnt

      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compila delonix
        run: cargo build --release --locked -p delonix-runtime-bin

      - name: Valida os inputs
        id: vars
        run: |
          set -euo pipefail
          p='${{ inputs.product }}'
          # Um URL sem checksum é a única combinação recusada: o caminho normal
          # resolve o hash no `SHA256SUMS` do fabricante, e quem traz um media
          # de outro sítio tem de trazer também com que o provar.
          if [ -n '${{ inputs.iso_url }}' ] && [ -z '${{ inputs.iso_sha256 }}' ]; then
            echo "::error::iso_sha256 é obrigatório quando iso_url é dado"; exit 1
          fi
          case "$p" in
            opnsense) echo "name=opnsense" ;;
            pve)      echo "name=proxmox-ve" ;;
            pbs)      echo "name=proxmox-backup-server" ;;
            pmg)      echo "name=proxmox-mail-gateway" ;;
            pdm)      echo "name=proxmox-datacenter-manager" ;;
            truenas)  echo "name=truenas-scale" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Descarrega e verifica o ISO (só com iso_url)
        if: ${{ inputs.iso_url != '' }}
        working-directory: /mnt/appliances
        run: |
          set -euo pipefail
          curl -fL --no-progress-meter -o src.iso '${{ inputs.iso_url }}'
          # Falha FECHADO: um ISO por verificar nunca chega ao build.
          echo '${{ inputs.iso_sha256 }}  src.iso' | sha256sum -c -

      - name: Constrói a imagem
        working-directory: /mnt/appliances
        env:
          OUT_DIR: /mnt/appliances
          MEDIA_CACHE: /mnt/appliances/.media
        run: |
          set -euo pipefail
          S="$GITHUB_WORKSPACE/scripts/appliances"
          # Com `iso_url` passa-se o CAMINHO; sem ele passa-se a VERSÃO (vazia =
          # a fixada no script) e é o script que descarrega e verifica. Os dois
          # caminhos existem no mesmo argumento: um ficheiro que existe é usado
          # tal e qual, o resto é tratado como versão.
          # `if` e não `[ … ] && SRC=…`: sob `set -e` a forma curta só é segura
          # porque o teste está ANTES do `&&` — reordená-la um dia faria o passo
          # sair com 1 sem uma linha de erro. Medido, e não vale o risco.
          SRC='${{ inputs.version }}'
          if [ -n '${{ inputs.iso_url }}' ]; then SRC=/mnt/appliances/src.iso; fi
          case '${{ inputs.product }}' in
            opnsense) "$S/build-opnsense.sh" ${SRC:+"$SRC"} ;;
            truenas)  "$S/build-truenas.sh"  ${SRC:+"$SRC"} ;;
            *)        "$S/build-proxmox.sh" '${{ inputs.product }}' ${SRC:+"$SRC"} ;;
          esac
          rm -f src.iso
          ls -lh /mnt/appliances/*.qcow2

      - name: Prova que arranca e serve
        # O OPNsense fica de fora: a web UI dele só escuta na LAN, e uma sonda
        # pela WAN receberia recusa — o comportamento CORRECTO de uma firewall.
        if: ${{ inputs.product != 'opnsense' }}
        working-directory: /mnt/appliances
        env:
          OUT_DIR: /mnt/appliances
        # Nomeia o produto: sem argumento o script verifica todas as imagens
        # presentes, e uma execução de CI constrói UMA.
        run: |
          "$GITHUB_WORKSPACE/scripts/appliances/verify-boot.sh" '${{ inputs.product }}'

      - name: Regista e publica
        id: publish
        env:
          DELONIX_ROOT: /mnt/appliances/root
          # Um PAT com `write:packages` (secret GHCR_TOKEN) tem precedência;
          # sem ele, o GITHUB_TOKEN — que não CRIA um package novo no namespace
          # de um user (403), só publica em packages que já existam.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D=./target/release/delonix
          N='${{ steps.vars.outputs.name }}'
          case '${{ inputs.product }}' in
            opnsense) STEM=opnsense; VCPUS=2; MEM=2G ;;
            pve)      STEM=pve;      VCPUS=4; MEM=4G ;;
            pbs)      STEM=pbs;      VCPUS=2; MEM=2G ;;
            pmg)      STEM=pmg;      VCPUS=2; MEM=2G ;;
            pdm)      STEM=pdm;      VCPUS=2; MEM=2G ;;
            truenas)  STEM=truenas;  VCPUS=4; MEM=8G ;;
          esac
          # A imagem é DESCOBERTA e não construída por nome. Os builds passaram a
          # carimbar a versão no ficheiro (`pve-9.2-1.qcow2`) para duas releases
          # poderem coexistir, e os nomes fixos que estavam aqui
          # (`/mnt/appliances/pve.qcow2`) deixariam este passo a apontar para um
          # ficheiro que já não existe — depois de o build inteiro ter corrido.
          # O `-bootcheck` é o overlay de rascunho do `verify-boot.sh`.
          IMG=$(ls -1 /mnt/appliances/"$STEM".qcow2 /mnt/appliances/"$STEM"-*.qcow2 2>/dev/null \
                | grep -v -- '-bootcheck\.qcow2$' | head -1)
          test -n "$IMG" || { echo "::error::nenhuma imagem /mnt/appliances/$STEM*.qcow2"; ls -l /mnt/appliances; exit 1; }
          echo "imagem: $IMG"
          # A versão EXACTA sai do nome do ficheiro quando o input veio vazio —
          # é o script que decide a versão fixada, e os metadados têm de dizer o
          # que lá está mesmo e não «unknown».
          VER='${{ inputs.version }}'
          [ -n "$VER" ] || VER=$(basename "$IMG" .qcow2 | sed -n "s/^$STEM-//p")
          # A versão que se DESCARREGA e a tag que se PUBLICA são coisas
          # diferentes, e estavam acopladas. O fabricante publica o ficheiro pela
          # versão exacta (`OPNsense-26.1.2-nano-amd64.img`), mas a convenção de
          # tags deste projecto é a SÉRIE — é o que a golden faz
          # (`delonix-vm-k8s:1.34`, não `:1.34.9`). Com um só input era
          # impossível pedir uma: `version=26.1` fazia o download falhar, porque
          # esse ficheiro não existe no mirror.
          #
          # O `--release` guarda a versão EXACTA de propósito: a tag diz a série,
          # os metadados dizem o que lá está mesmo.
          TAG='${{ inputs.tag }}'
          # O sufixo de build do Proxmox cai ANTES do corte da série: a versão
          # é `9.2-1` e a tag publicada é `9.2` (foi assim que as quatro de
          # 2026-08-13 entraram, ao lado de `proxmox-ve-9.1`). Sem tirar o `-1`
          # o `cut` por pontos devolvia `9.2-1`, porque só há um ponto.
          [ -n "$TAG" ] || TAG="$(echo "${VER%%-*}" | cut -d. -f1-2)"
          echo "versão descarregada: $VER · tag publicada: $TAG"
          # `--appliance`: nenhuma destas corre cloud-init, e sem esta marca o
          # `vm create` do outro lado voltaria a anexar-lhes um seed NoCloud.
          $D image vm import "$IMG" -t "$N:$TAG" --appliance \
            --distro "$N" --release "$VER" \
            --default-vcpus "$VCPUS" --default-memory "$MEM"
          $D image vm ls
          echo "${GHCR_TOKEN:-$GITHUB_TOKEN}" | $D image login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          $D image --vm push "$N:$TAG" "${{ inputs.dest_repo }}:$N-$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sumário
        run: |
          {
            echo "### Appliance publicada"
            echo
            echo '```bash'
            echo "delonix vm pull ${{ inputs.dest_repo }}:${{ steps.vars.outputs.name }}-${{ steps.publish.outputs.tag }}"
            echo "delonix vm create meu-${{ inputs.product }} --disk ${{ steps.vars.outputs.name }}-${{ steps.publish.outputs.tag }}"
            echo '```'
            echo
            echo "Não corre cloud-init: configura-a no primeiro arranque (consola ou interface web)."
          } >> "$GITHUB_STEP_SUMMARY"
