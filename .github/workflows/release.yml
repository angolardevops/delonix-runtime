# Release — compila e publica os binários quando uma tag `v*` é feita push.
#
# Porquê em CI e não na máquina de quem faz a release: o build precisa de
# `protoc` (delonix-cri) e o artefacto deve sair de um ambiente reprodutível.
# Runner ubuntu-22.04 DE PROPÓSITO: glibc 2.35 — o binário corre em qualquer
# distro igual ou mais recente (RHEL 9, Debian 12, Ubuntu 22.04+); um runner
# `latest` (24.04, glibc 2.39) excluiria as enterprise ainda em uso.
#
# Assets publicados (nomes estáveis — o scripts/install.sh depende deles):
#   delonix-x86_64-linux, delonix-cri-x86_64-linux, SHA256SUMS,
#   SHA256SUMS.minisig, install.sh
#
# ASSINATURA (porquê): o SHA256SUMS sozinho prova INTEGRIDADE DE TRANSFERÊNCIA,
# não AUTENTICIDADE DE ORIGEM — vem da mesma URL que o binário, por isso quem
# consiga publicar uma release adulterada (conta comprometida, token de CI
# roubado) publica um SHA256SUMS a condizer e a verificação passa. A assinatura
# minisign fecha isso: a chave privada nunca está na release, e o install.sh
# traz a pública embutida. Sem o secret MINISIGN_SECRET_KEY configurado, a
# release sai SEM assinatura e o install.sh recusa instalar (fail-closed) a não
# ser com --insecure-skip-signature.
#
# Notas da release: docs/releases/<tag>.md se existir; senão, autogeradas.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compila (release, x86-64 genérico)
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri
      - name: Guarda binários genéricos
        run: |
          mkdir -p dist-release
          cp target/release/delonix     dist-release/delonix-x86_64-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-linux
      # Variante x86-64-v3 (AVX2/BMI2/FMA — Zen 2+/Haswell+): o instalador
      # escolhe-a automaticamente quando o CPU a suporta; o genérico continua
      # a ser o fallback universal. target-cpu diferente ⇒ rebuild completo.
      - name: Compila (release, x86-64-v3)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri
      - name: Prepara assets
        run: |
          cp target/release/delonix     dist-release/delonix-x86_64-v3-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-v3-linux
          strip dist-release/delonix-*-linux
          cp scripts/install.sh dist-release/install.sh
          cd dist-release && sha256sum delonix-x86_64-linux delonix-x86_64-v3-linux delonix-cri-x86_64-linux delonix-cri-x86_64-v3-linux install.sh > SHA256SUMS
      - name: Sanidade — o binário arranca e reporta a versão da tag
        run: |
          V=$(dist-release/delonix-x86_64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${GITHUB_REF_NAME#v}" || { echo "::error::versão do binário ($V) != tag ($GITHUB_REF_NAME) — esqueceu-se o bump no Cargo.toml?"; exit 1; }
      - name: Assina o SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::secret MINISIGN_SECRET_KEY em falta — a release sairia SEM assinatura e o install.sh recusa-a. Ver docs/SECURITY-RELEASES.md"
            exit 1
          fi
          sudo apt-get install -y minisign
          # A chave privada só existe no disco do runner durante este passo.
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          cd dist-release
          minisign -S -s /tmp/minisign.key -m SHA256SUMS \
            -c "delonix-runtime $GITHUB_REF_NAME" -t "delonix-runtime $GITHUB_REF_NAME"
          shred -u /tmp/minisign.key 2>/dev/null || rm -f /tmp/minisign.key
          # Confirma que a assinatura verifica com a pública que o install.sh
          # traz embutida — apanha uma troca de chave ANTES de publicar, não
          # depois, quando todos os instaladores já falham.
          PUB=$(grep -oP '^MINISIGN_PUBKEY="\K[^"]+' ../scripts/install.sh)
          [ "$PUB" != "__POR_PREENCHER__" ] \
            || { echo "::error::MINISIGN_PUBKEY ainda é o placeholder em scripts/install.sh — preenche a chave pública antes de assinar releases (ver docs/SECURITY-RELEASES.md)"; exit 1; }
          echo "untrusted comment: delonix-runtime" > /tmp/pub.pub
          echo "$PUB" >> /tmp/pub.pub
          minisign -V -p /tmp/pub.pub -m SHA256SUMS \
            || { echo "::error::a assinatura NÃO verifica com a chave pública embutida no install.sh — chave trocada?"; exit 1; }
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            # Título = primeira linha (heading) das notas — convenção das releases anteriores.
            TITLE=$(head -1 "$NOTES" | sed 's/^#* *//')
            gh release create "$GITHUB_REF_NAME" dist-release/* --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # Documentação DINÂMICA por release: o apêndice docs/RELEASES.md (features
      # por release) regenera-se das notas e é comitado no main — a doc nunca
      # fica atrás da release. [skip ci] evita re-disparar a CI por isto.
      - name: Actualiza o apêndice de releases no main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          bash scripts/gen-releases.sh
          if ! git diff --quiet -- docs/RELEASES.md; then
            git add docs/RELEASES.md
            git commit -m "docs(releases): apêndice actualizado para ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          else
            echo "docs/RELEASES.md já actualizado — nada a comitar"
          fi
