# Release — compila e publica os binários quando uma tag `v*` é feita push.
#
# Porquê em CI e não na máquina de quem faz a release: o build precisa de
# `protoc` (delonix-cri) e o artefacto deve sair de um ambiente reprodutível.
# Runner ubuntu-22.04 DE PROPÓSITO: glibc 2.35 — o binário corre em qualquer
# distro igual ou mais recente (RHEL 9, Debian 12, Ubuntu 22.04+); um runner
# `latest` (24.04, glibc 2.39) excluiria as enterprise ainda em uso.
#
# Assets publicados (nomes estáveis — o scripts/install.sh depende deles):
#   delonix-x86_64-linux, delonix-cri-x86_64-linux, SHA256SUMS,
#   SHA256SUMS.minisig, install.sh
#   plus the aarch64 twins (delonix[-cri|-mcp|-mgmt]-aarch64-linux), built on a
#   native arm64 runner by the `build-arm64` job. There is no -v3 variant on
#   arm64: one binary per component.
#
# ASSINATURA (porquê): o SHA256SUMS sozinho prova INTEGRIDADE DE TRANSFERÊNCIA,
# não AUTENTICIDADE DE ORIGEM — vem da mesma URL que o binário, por isso quem
# consiga publicar uma release adulterada (conta comprometida, token de CI
# roubado) publica um SHA256SUMS a condizer e a verificação passa. A assinatura
# minisign fecha isso: a chave privada nunca está na release, e o install.sh
# traz a pública embutida. Sem o secret MINISIGN_SECRET_KEY configurado, a
# release sai SEM assinatura e o install.sh recusa instalar (fail-closed) a não
# ser com --insecure-skip-signature.
#
# Notas da release: docs/releases/<tag>.md se existir; senão, autogeradas.
name: Release

# TRIGGER (2026-09-23): only a manual request. It used to be `push: tags: ["v*"]`,
# which meant the release built the moment a tag reached the remote — including a
# tag pushed by accident (`git push --tags`, `push.followTags=true`), and with no
# step between "the tag exists" and "the world has a binary". Now the tag and the
# release are two decisions: tag when the version is cut, publish when you say so.
#
#     gh workflow run release.yml -f tag=v4.4.0
#
# Consequence, stated because it is the cost of the change: pushing a tag now
# publishes NOTHING. A tag with no release is a normal intermediate state here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish — must ALREADY exist on the remote (e.g. v4.4.0)"
        required: true

# Every job and step reads the tag from here, never from the ref this workflow was
# dispatched on: the ref is whatever branch the operator happened to have selected,
# and a release that builds one commit and labels it another is the worst kind of
# wrong. `guard` below is what makes this variable trustworthy.
env:
  TAG: ${{ inputs.tag }}

permissions:
  contents: write
  # For `actions/attest-build-provenance`: it signs with an ephemeral OIDC
  # identity of the runner itself (Sigstore/Fulcio), so there is no private key
  # to store anywhere — unlike minisign, whose key is a secret. The two coexist
  # on purpose and answer different questions: minisign proves the release is
  # OURS to whoever has the public key embedded in `install.sh`; provenance
  # proves WHERE and from WHICH COMMIT it was built, to whoever does not trust
  # us up front.
  id-token: write
  attestations: write

jobs:
  # The input is free text, and everything downstream trusts it: it picks the commit
  # to build, names the GitHub release, and is compared against the binary's own
  # version. `tag: main` would have checked out a branch and published a release
  # called "main". So it is validated BEFORE any runner spends ten minutes building:
  # the shape must be `vX.Y.Z[-suffix]`, and the tag must already exist on the remote.
  guard:
    name: guard (the tag is real)
    runs-on: ubuntu-latest
    steps:
      - name: The tag has the shape of a release tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag exists, and the release does not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null \
            || { echo "::error::tag $TAG does not exist — create and push it first"; exit 1; }
          # Republishing over an existing release is how assets silently change
          # underneath people who already downloaded them. `gh release create` would
          # refuse anyway; failing here says WHY, before the build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — delete it first if you mean to republish"
            exit 1
          fi
          echo "$TAG -> $(git rev-parse --short "refs/tags/$TAG^{commit}")"

  # Native arm64 build (issue #438). Built on a real aarch64 runner, not cross
  # compiled: a cross build would ship binaries whose `#[cfg(target_arch)]`
  # branches were never executed. ubuntu-22.04 on purpose, like the x86 job:
  # same glibc 2.35 floor. Stripped and version-checked HERE, because the x86
  # runner's `strip` does not recognise aarch64 ELF.
  build-arm64:
    name: build (arm64)
    needs: guard
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned toolchain
        run: rustup show
      - name: Runner architecture
        run: test "$(uname -m)" = aarch64
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, aarch64)
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri -p delonix-mcp-bin -p delonix-mgmt-bin
      - name: Stage, strip and version-check
        run: |
          mkdir -p dist-arm64
          cp target/release/delonix      dist-arm64/delonix-aarch64-linux
          cp target/release/delonix-cri  dist-arm64/delonix-cri-aarch64-linux
          cp target/release/delonix-mcp  dist-arm64/delonix-mcp-aarch64-linux
          cp target/release/delonix-mgmt dist-arm64/delonix-mgmt-aarch64-linux
          strip dist-arm64/delonix-*-aarch64-linux
          file dist-arm64/delonix-aarch64-linux | grep -q 'ARM aarch64'
          V=$(dist-arm64/delonix-aarch64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${TAG#v}" || { echo "::error::binary version ($V) != tag ($TAG) — was the Cargo.toml bump forgotten?"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arm64
          path: dist-arm64/
          if-no-files-found: error

  release:
    name: build & publish
    needs: build-arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compila (release, x86-64 genérico)
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri -p delonix-mcp-bin -p delonix-mgmt-bin
      - name: Guarda binários genéricos
        run: |
          mkdir -p dist-release
          cp target/release/delonix     dist-release/delonix-x86_64-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-linux
          cp target/release/delonix-mcp dist-release/delonix-mcp-x86_64-linux
          cp target/release/delonix-mgmt dist-release/delonix-mgmt-x86_64-linux
      # O SITE PUBLICADO TEM DE SER O GERADO POR ESTE BINÁRIO.
      #
      # Este gate existe no `ci.yml` e disparou na v0.48.0 — e a release saiu na
      # mesma, porque um workflow não olha para o outro. O resultado foi o site
      # ao vivo a anunciar uma versão que nunca teve tag e a esconder um comando
      # novo, durante horas, com o CI vermelho ao lado a dizê-lo.
      #
      # Aqui a verificação corre ANTES de qualquer coisa ser publicada, e com o
      # binário que ESTA release vai entregar — que é o único contra o qual a
      # pergunta faz sentido.
      - name: O site publicado tem de ser o gerado (gate de publicação)
        run: |
          sudo apt-get install -y python3-markdown || pip install --break-system-packages markdown
          PATH="$PWD/target/release:$PATH" python3 docs/gen.py
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ está desactualizado face ao binário desta tag."
            echo "Corre 'python3 docs/gen.py' com um build de release e commita ANTES de cortar a tag."
            git diff --stat -- docs/
            exit 1
          fi
      # Variante x86-64-v3 (AVX2/BMI2/FMA — Zen 2+/Haswell+): o instalador
      # escolhe-a automaticamente quando o CPU a suporta; o genérico continua
      # a ser o fallback universal. target-cpu diferente ⇒ rebuild completo.
      - name: Compila (release, x86-64-v3)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri -p delonix-mcp-bin -p delonix-mgmt-bin
      - name: Fetch the arm64 binaries built natively
        uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist-arm64
      - name: Prepara assets
        run: |
          cp target/release/delonix     dist-release/delonix-x86_64-v3-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-v3-linux
          cp target/release/delonix-mcp dist-release/delonix-mcp-x86_64-v3-linux
          cp target/release/delonix-mgmt dist-release/delonix-mgmt-x86_64-v3-linux
          strip dist-release/delonix-*-x86_64*-linux
          cp scripts/install.sh dist-release/install.sh
          cp dist-arm64/* dist-release/
          cd dist-release && sha256sum delonix-aarch64-linux delonix-cri-aarch64-linux delonix-mcp-aarch64-linux delonix-mgmt-aarch64-linux delonix-x86_64-linux delonix-x86_64-v3-linux delonix-cri-x86_64-linux delonix-cri-x86_64-v3-linux delonix-mcp-x86_64-linux delonix-mcp-x86_64-v3-linux delonix-mgmt-x86_64-linux delonix-mgmt-x86_64-v3-linux install.sh > SHA256SUMS
      - name: SBOM (SPDX 2.3, do Cargo.lock)
        run: |
          python3 scripts/sbom.py --version "${TAG#v}" > dist-release/delonix-sbom.spdx.json
          # The SBOM goes into the SHA256SUMS that is signed below. Publishing
          # it outside the signature would give an inventory anyone can swap —
          # and a tampered SBOM is worse than none, because it is believed.
          cd dist-release && sha256sum delonix-sbom.spdx.json >> SHA256SUMS
      - name: The editor extension, from its own repository
        # The extension lives in `angolardevops/delonix-vscode` and releases on
        # its own cadence. It is copied in here — instead of being fetched from
        # there by the installer — so it lands inside the SAME signed
        # SHA256SUMS as everything else: one supply chain, one signature.
        #
        # Best-effort ON PURPOSE. A release of the engine cannot fail because a
        # separate repository has no artefact yet; without the asset the
        # installer takes its `skip editor` path, which says so out loud.
        run: |
          # The failure is REPORTED, not guessed at. A bare `else` here would
          # announce "no extension release yet" for a token that cannot read the
          # other repository, or for a network blip — sending whoever reads the
          # log to look in the wrong place. `2>&1` into a variable keeps the
          # reason and still lets the step succeed.
          if ERR=$(gh release download --repo angolardevops/delonix-vscode \
                     --pattern '*.vsix' --dir /tmp/vsix 2>&1); then
            cp /tmp/vsix/*.vsix dist-release/delonix-vscode
            cd dist-release && sha256sum delonix-vscode >> SHA256SUMS
          else
            echo "::notice::this engine release ships without the editor extension: $ERR"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sanidade — o binário arranca e reporta a versão da tag
        run: |
          V=$(dist-release/delonix-x86_64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${TAG#v}" || { echo "::error::versão do binário ($V) != tag ($TAG) — esqueceu-se o bump no Cargo.toml?"; exit 1; }
      - name: Assina o SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          PUB=$(grep -oP '^MINISIGN_PUBKEY="\K[^"]+' scripts/install.sh)
          # A guarda dura só se aplica quando a assinatura JÁ é esperada, i.e.
          # quando o install.sh tem uma chave pública real embutida. Aí, sair
          # sem assinar partiria TODOS os instaladores (fail-closed do lado do
          # cliente) — é um erro, não um aviso. Antes disso, assinar ainda não
          # é esperado e a release sai sem assinatura, com aviso alto.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$PUB" != "__POR_PREENCHER__" ]; then
              echo "::error::MINISIGN_PUBKEY está configurado mas o secret MINISIGN_SECRET_KEY falta — esta release sairia sem assinatura e TODOS os instaladores a recusariam. Ver docs/SECURITY-RELEASES.md"
              exit 1
            fi
            echo "::warning::release SEM assinatura — a chave ainda não foi configurada (ver docs/SECURITY-RELEASES.md). O install.sh avisa e verifica só integridade de transferência."
            exit 0
          fi
          # minisign NÃO está no índice apt deste runner (mirror Azure, sem o
          # componente `universe` servido) — `apt-get install minisign` falhou
          # DETERMINISTICAMENTE em 3 corridas da v0.38.0, mesmo com o universe
          # "adicionado" e o `update` limpo. Em vez do apt, descarrega o binário
          # estático OFICIAL, com versão + SHA256 FIXADOS e verificados (o mesmo
          # padrão de confiança-por-digest do resto do projecto — nunca um
          # download sem verificar). Fail-closed: um checksum errado aborta aqui.
          MINISIGN_VER=0.12
          MINISIGN_SHA=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          curl -fsSL -o /tmp/minisign.tgz \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VER}/minisign-${MINISIGN_VER}-linux.tar.gz"
          echo "${MINISIGN_SHA}  /tmp/minisign.tgz" | sha256sum -c -
          tar xzf /tmp/minisign.tgz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
          # A chave privada só existe no disco do runner durante este passo.
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          cd dist-release
          # A password vai por STDIN — o minisign lê-a de lá quando não há tty.
          # Sem isto o passo ficava pendurado à espera de input (uma chave gerada
          # com -W, sem password, ignora o pipe sem problema).
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s /tmp/minisign.key -m SHA256SUMS \
                -c "delonix-runtime $TAG" -t "delonix-runtime $TAG"
          shred -u /tmp/minisign.key 2>/dev/null || rm -f /tmp/minisign.key
          # Confirma que a assinatura verifica com a pública que o install.sh
          # traz embutida — apanha uma troca de chave ANTES de publicar, não
          # depois, quando todos os instaladores já falham.
          echo "untrusted comment: delonix-runtime" > /tmp/pub.pub
          echo "$PUB" >> /tmp/pub.pub
          minisign -V -p /tmp/pub.pub -m SHA256SUMS \
            || { echo "::error::a assinatura NÃO verifica com a chave pública embutida no install.sh — chave trocada?"; exit 1; }
      # SLSA provenance for the published binaries. The action is GitHub's own,
      # not a third party — the alternative (installing cosign on the runner)
      # would add supply-chain surface to the step that exists to guarantee it,
      # which is also why the SBOM comes from a script of ours and not a `syft`.
      #
      # Verify with: gh attestation verify <file> --repo angolardevops/delonix-runtime
      - name: Proveniência (SLSA) dos binários
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist-release/delonix-x86_64-linux
            dist-release/delonix-x86_64-v3-linux
            dist-release/delonix-cri-x86_64-linux
            dist-release/delonix-cri-x86_64-v3-linux
            dist-release/delonix-mcp-x86_64-linux
            dist-release/delonix-mcp-x86_64-v3-linux
            dist-release/delonix-mgmt-x86_64-linux
            dist-release/delonix-mgmt-x86_64-v3-linux
            dist-release/delonix-aarch64-linux
            dist-release/delonix-cri-aarch64-linux
            dist-release/delonix-mcp-aarch64-linux
            dist-release/delonix-mgmt-aarch64-linux
            dist-release/delonix-sbom.spdx.json
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            # Título = primeira linha (heading) das notas — convenção das releases anteriores.
            TITLE=$(head -1 "$NOTES" | sed 's/^#* *//')
            gh release create "$TAG" dist-release/* --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist-release/* --title "$TAG" --generate-notes
          fi
      # Documentação DINÂMICA por release: o apêndice docs/RELEASES.md (features
      # por release) regenera-se das notas e é comitado no main — a doc nunca
      # fica atrás da release. [skip ci] evita re-disparar a CI por isto.
      - name: Actualiza o apêndice de releases no main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Walter Angolar"
          git config user.email "angolar.devops@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          bash scripts/gen-releases.sh
          # The generated facts of the contributor handbook follow the release too;
          # the narrative is reviewed by a person after the release is validated.
          # A generator failure must not cost the release appendix, which was independent
          # of it before: warn loudly and commit what did regenerate.
          python3 scripts/dev_docs.py || echo "::warning::dev_docs.py falhou — os factos de docs/dev ficam por regenerar nesta release"
          { python3 -m pip install --break-system-packages markdown && python3 scripts/dev_docs_site.py; } \
            || echo "::warning::dev_docs_site.py falhou — o site do manual fica por regenerar nesta release"
          # `git status`, not `git diff`: a page added to the handbook is an UNTRACKED
          # file, which `git diff --quiet` does not see.
          if [ -n "$(git status --porcelain -- docs/RELEASES.md docs/dev docs/handbook)" ]; then
            git add docs/RELEASES.md docs/dev docs/handbook
            git commit -m "docs(releases): apêndice e factos do manual actualizados para ${TAG} [skip ci]"
            git push origin main
          else
            echo "docs/RELEASES.md e docs/dev já actualizados — nada a comitar"
          fi
