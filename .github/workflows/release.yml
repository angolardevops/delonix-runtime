# Release — compila e publica os binários quando uma tag `v*` é feita push.
#
# Porquê em CI e não na máquina de quem faz a release: o build precisa de
# `protoc` (delonix-cri) e o artefacto deve sair de um ambiente reprodutível.
# Runner ubuntu-22.04 DE PROPÓSITO: glibc 2.35 — o binário corre em qualquer
# distro igual ou mais recente (RHEL 9, Debian 12, Ubuntu 22.04+); um runner
# `latest` (24.04, glibc 2.39) excluiria as enterprise ainda em uso.
#
# Assets publicados (nomes estáveis — o scripts/install.sh depende deles):
#   delonix-x86_64-linux, delonix-cri-x86_64-linux, SHA256SUMS,
#   SHA256SUMS.minisig, install.sh
#
# ASSINATURA (porquê): o SHA256SUMS sozinho prova INTEGRIDADE DE TRANSFERÊNCIA,
# não AUTENTICIDADE DE ORIGEM — vem da mesma URL que o binário, por isso quem
# consiga publicar uma release adulterada (conta comprometida, token de CI
# roubado) publica um SHA256SUMS a condizer e a verificação passa. A assinatura
# minisign fecha isso: a chave privada nunca está na release, e o install.sh
# traz a pública embutida. Sem o secret MINISIGN_SECRET_KEY configurado, a
# release sai SEM assinatura e o install.sh recusa instalar (fail-closed) a não
# ser com --insecure-skip-signature.
#
# Notas da release: docs/releases/<tag>.md se existir; senão, autogeradas.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For `actions/attest-build-provenance`: it signs with an ephemeral OIDC
  # identity of the runner itself (Sigstore/Fulcio), so there is no private key
  # to store anywhere — unlike minisign, whose key is a secret. The two coexist
  # on purpose and answer different questions: minisign proves the release is
  # OURS to whoever has the public key embedded in `install.sh`; provenance
  # proves WHERE and from WHICH COMMIT it was built, to whoever does not trust
  # us up front.
  id-token: write
  attestations: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compila (release, x86-64 genérico)
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri
      - name: Guarda binários genéricos
        run: |
          mkdir -p dist-release
          cp target/release/delonix     dist-release/delonix-x86_64-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-linux
      # O SITE PUBLICADO TEM DE SER O GERADO POR ESTE BINÁRIO.
      #
      # Este gate existe no `ci.yml` e disparou na v0.48.0 — e a release saiu na
      # mesma, porque um workflow não olha para o outro. O resultado foi o site
      # ao vivo a anunciar uma versão que nunca teve tag e a esconder um comando
      # novo, durante horas, com o CI vermelho ao lado a dizê-lo.
      #
      # Aqui a verificação corre ANTES de qualquer coisa ser publicada, e com o
      # binário que ESTA release vai entregar — que é o único contra o qual a
      # pergunta faz sentido.
      - name: O site publicado tem de ser o gerado (gate de publicação)
        run: |
          sudo apt-get install -y python3-markdown || pip install --break-system-packages markdown
          PATH="$PWD/target/release:$PATH" python3 docs/gen.py
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ está desactualizado face ao binário desta tag."
            echo "Corre 'python3 docs/gen.py' com um build de release e commita ANTES de cortar a tag."
            git diff --stat -- docs/
            exit 1
          fi
      # Variante x86-64-v3 (AVX2/BMI2/FMA — Zen 2+/Haswell+): o instalador
      # escolhe-a automaticamente quando o CPU a suporta; o genérico continua
      # a ser o fallback universal. target-cpu diferente ⇒ rebuild completo.
      - name: Compila (release, x86-64-v3)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri
      - name: Prepara assets
        run: |
          cp target/release/delonix     dist-release/delonix-x86_64-v3-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-v3-linux
          strip dist-release/delonix-*-linux
          cp scripts/install.sh dist-release/install.sh
          cd dist-release && sha256sum delonix-x86_64-linux delonix-x86_64-v3-linux delonix-cri-x86_64-linux delonix-cri-x86_64-v3-linux install.sh > SHA256SUMS
      - name: SBOM (SPDX 2.3, do Cargo.lock)
        run: |
          python3 scripts/sbom.py --version "${GITHUB_REF_NAME#v}" > dist-release/delonix-sbom.spdx.json
          # The SBOM goes into the SHA256SUMS that is signed below. Publishing
          # it outside the signature would give an inventory anyone can swap —
          # and a tampered SBOM is worse than none, because it is believed.
          cd dist-release && sha256sum delonix-sbom.spdx.json >> SHA256SUMS
      - name: Sanidade — o binário arranca e reporta a versão da tag
        run: |
          V=$(dist-release/delonix-x86_64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${GITHUB_REF_NAME#v}" || { echo "::error::versão do binário ($V) != tag ($GITHUB_REF_NAME) — esqueceu-se o bump no Cargo.toml?"; exit 1; }
      - name: Assina o SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          PUB=$(grep -oP '^MINISIGN_PUBKEY="\K[^"]+' scripts/install.sh)
          # A guarda dura só se aplica quando a assinatura JÁ é esperada, i.e.
          # quando o install.sh tem uma chave pública real embutida. Aí, sair
          # sem assinar partiria TODOS os instaladores (fail-closed do lado do
          # cliente) — é um erro, não um aviso. Antes disso, assinar ainda não
          # é esperado e a release sai sem assinatura, com aviso alto.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$PUB" != "__POR_PREENCHER__" ]; then
              echo "::error::MINISIGN_PUBKEY está configurado mas o secret MINISIGN_SECRET_KEY falta — esta release sairia sem assinatura e TODOS os instaladores a recusariam. Ver docs/SECURITY-RELEASES.md"
              exit 1
            fi
            echo "::warning::release SEM assinatura — a chave ainda não foi configurada (ver docs/SECURITY-RELEASES.md). O install.sh avisa e verifica só integridade de transferência."
            exit 0
          fi
          # minisign NÃO está no índice apt deste runner (mirror Azure, sem o
          # componente `universe` servido) — `apt-get install minisign` falhou
          # DETERMINISTICAMENTE em 3 corridas da v0.38.0, mesmo com o universe
          # "adicionado" e o `update` limpo. Em vez do apt, descarrega o binário
          # estático OFICIAL, com versão + SHA256 FIXADOS e verificados (o mesmo
          # padrão de confiança-por-digest do resto do projecto — nunca um
          # download sem verificar). Fail-closed: um checksum errado aborta aqui.
          MINISIGN_VER=0.12
          MINISIGN_SHA=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          curl -fsSL -o /tmp/minisign.tgz \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VER}/minisign-${MINISIGN_VER}-linux.tar.gz"
          echo "${MINISIGN_SHA}  /tmp/minisign.tgz" | sha256sum -c -
          tar xzf /tmp/minisign.tgz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
          # A chave privada só existe no disco do runner durante este passo.
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          cd dist-release
          # A password vai por STDIN — o minisign lê-a de lá quando não há tty.
          # Sem isto o passo ficava pendurado à espera de input (uma chave gerada
          # com -W, sem password, ignora o pipe sem problema).
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s /tmp/minisign.key -m SHA256SUMS \
                -c "delonix-runtime $GITHUB_REF_NAME" -t "delonix-runtime $GITHUB_REF_NAME"
          shred -u /tmp/minisign.key 2>/dev/null || rm -f /tmp/minisign.key
          # Confirma que a assinatura verifica com a pública que o install.sh
          # traz embutida — apanha uma troca de chave ANTES de publicar, não
          # depois, quando todos os instaladores já falham.
          echo "untrusted comment: delonix-runtime" > /tmp/pub.pub
          echo "$PUB" >> /tmp/pub.pub
          minisign -V -p /tmp/pub.pub -m SHA256SUMS \
            || { echo "::error::a assinatura NÃO verifica com a chave pública embutida no install.sh — chave trocada?"; exit 1; }
      # SLSA provenance for the published binaries. The action is GitHub's own,
      # not a third party — the alternative (installing cosign on the runner)
      # would add supply-chain surface to the step that exists to guarantee it,
      # which is also why the SBOM comes from a script of ours and not a `syft`.
      #
      # Verify with: gh attestation verify <file> --repo angolardevops/delonix-runtime
      - name: Proveniência (SLSA) dos binários
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist-release/delonix-x86_64-linux
            dist-release/delonix-x86_64-v3-linux
            dist-release/delonix-cri-x86_64-linux
            dist-release/delonix-cri-x86_64-v3-linux
            dist-release/delonix-sbom.spdx.json
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            # Título = primeira linha (heading) das notas — convenção das releases anteriores.
            TITLE=$(head -1 "$NOTES" | sed 's/^#* *//')
            gh release create "$GITHUB_REF_NAME" dist-release/* --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # Documentação DINÂMICA por release: o apêndice docs/RELEASES.md (features
      # por release) regenera-se das notas e é comitado no main — a doc nunca
      # fica atrás da release. [skip ci] evita re-disparar a CI por isto.
      - name: Actualiza o apêndice de releases no main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Walter Angolar"
          git config user.email "angolar.devops@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          bash scripts/gen-releases.sh
          if ! git diff --quiet -- docs/RELEASES.md; then
            git add docs/RELEASES.md
            git commit -m "docs(releases): apêndice actualizado para ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          else
            echo "docs/RELEASES.md já actualizado — nada a comitar"
          fi
