name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução por ref — cancela a anterior ainda a correr (poupa runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- Estilo: rustfmt tem de estar aplicado (ver .git-blame-ignore-revs) ----
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honra o rust-toolchain.toml (canal + componentes rustfmt/clippy).
      - name: Instala toolchain fixada
        run: rustup show
      - run: cargo fmt --all --check

  # ---- Language: this code is written in English (ratchet, see LANG-01) ----
  lang:
    name: lang ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identifiers, comments and user-facing messages still in Portuguese
        run: python3 scripts/lang_ratchet.py

  # ---- The dependency direction of ADR-0040, enforced while the move happens ----
  # Phase P0: the rails go in BEFORE any crate moves, so the restructuring cannot
  # regress while it is under way. The rules (layer direction, purity of the
  # foundation, one interface per binary) fail immediately unless declared as an
  # exception naming the phase that removes it; the two numbers (self-exec sites,
  # library prints) are ratchets with the same semantics as `lang_ratchet.py`.
  arch:
    name: arch fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala toolchain fixada
        run: rustup show
      - name: Layer direction, foundation purity and the debt ratchets
        run: python3 scripts/arch_fitness.py
      # The contributor handbook's FACTS (crates, layers, dependencies, binaries,
      # toolchain, CI jobs) are generated from the same sources this job checks.
      # Hand-written, they rotted twice; generated, a stale page fails here.
      - name: Contributor handbook facts match the code (docs/dev)
        run: python3 scripts/dev_docs.py --check

  # ---- The node contract: format, lint, compatibility and the generated OpenAPI ----
  # ADR-0040 P1. Tool versions are pinned — a newer buf or generator changing its output
  # would read as a contract change nobody made.
  contract:
    name: contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: buf and protoc-gen-openapi (pinned)
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Contract gate
        run: python3 scripts/contract_gate.py

  # ---- The version stays aligned with the published tags ----
  # Equal to the newest tag the commit contains, or above it only in the release
  # commit (with its notes); and a branch that predates the newest release fails
  # until origin/main is merged in. Needs every tag, hence fetch-depth: 0.
  version:
    name: version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Workspace version vs. tags
        run: python3 scripts/version_gate.py

  # ---- The CLI surface does not grow without someone deciding the destination ----
  # Phase CLI-0 (docs/discovery/51_CLI_INVENTARIO.md) classified the 233 leaves of
  # the public tree. A command added without entering the baseline fails here,
  # instead of being deleted by omission when CLI-5 runs the clean cut.
  # Needs the binary built: the tree is read from the real `--help`, never from
  # the source — reading it any other way is how this phase's first measurement
  # ended up six commands behind.
  cli-surface:
    name: cli surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` builds the CRI .proto through prost/tonic — needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p delonix-runtime-bin
      - name: Every CLI leaf has a decided destination
        run: scripts/cli-tree.sh --gate
      # The other half of the same question. `--gate` above guards the tree
      # against growing without a decision; this one guards the DOCUMENTATION
      # against still teaching a command the tree no longer has. Two removals in
      # a row (`pod ls` in v2.0.0, `vm status` in v3.0.0) left eight current
      # pages teaching `unrecognized subcommand`, and nothing here noticed.
      - name: Every `delonix …` in the current docs resolves in the tree
        run: python3 scripts/docs_cli_gate.py

  # ---- Lint: clippy a falhar em QUALQUER warning (gate estrito) ----
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` compila os .proto do CRI via prost/tonic — precisa de protoc.
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---- Testes: a suite toda (os testes que exigem privilégio auto-skipam) ----
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` compila os .proto do CRI via prost/tonic — precisa de protoc.
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  # ---- The same build and the same suite, natively on arm64 ----
  #
  # The engine's Linux boundary is architecture-specific in exactly one place —
  # the seccomp allowlist, whose syscall numbers differ between x86_64 and
  # aarch64 — and no job here ever looked at it. Three faults reached a user
  # through that gap: `sendfile` denied on arm64 (a static HTTP response came
  # back with its headers and an empty body), `fadvise64` denied the same way,
  # and a custom OCI profile losing both rules without a message.
  #
  # NATIVE, and not cross-compiled. A cross build type-checks the aarch64 `cfg`
  # branches and runs none of them, and all three faults compile perfectly:
  # a missing syscall number is not a compile error, it is a denied syscall.
  # `ubuntu-24.04-arm` is a GitHub-hosted arm64 runner, free for public
  # repositories.
  #
  # `clippy -D warnings` is deliberately NOT here yet. On arm64 it fails today
  # on a true warning — `allowed_syscalls` declares `let mut v` and never
  # extends it, because the only `extend_from_slice` is behind
  # `cfg(target_arch = "x86_64")`. That warning goes away with the syscall work,
  # not with a CI change, so the lint gate turns on in the PR that fixes it
  # rather than being silenced here.
  test-arm64:
    name: test (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` builds the CRI .proto through prost/tonic — needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  # ---- Supply-chain: advisories RUSTSEC + licenças + fontes (ver deny.toml) ----
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # ---- O site e os exemplos: gerados do binário, e por isso verificáveis ----
  #
  # Duas classes de falha que só se descobriam à mão, e ambas já aconteceram:
  #
  #  1. `docs/gen.py` rebenta a MEIO (uma lista PT/EN que divergiu no tamanho,
  #     por exemplo) e deixa o site PARCIALMENTE escrito — com a página velha no
  #     lugar e nada a dizê-lo. Aqui falha alto.
  #  2. O site commitado deixa de ser o gerado. É o mesmo contrato que o
  #     `docs/schema/v1/delonix.json` já tem em teste (ADR-0007): se a fonte é o
  #     código, o publicado tem de bater com o que ela produz.
  #
  # E os `examples/` passam pelo `--dry-run` e pelo `validate` do binário desta
  # árvore — um exemplo publicado é o que as pessoas copiam. O `--dry-run` apanha
  # um Kind depreciado e um erro de parsing; o `validate` apanha uma referência
  # cruzada que não resolve. **Um campo desconhecido fica de fora**, e é medido,
  # não suposto: o `warn_unknown_fields` só corre no apply REAL, e um apply real
  # em CI criaria recursos — a verificação promete o que faz.
  docs:
    name: generated docs and valid examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - run: cargo build --release --locked -p delonix-runtime-bin
      - name: Dependências do gerador
        # `gen.py`'s `c4_page`/`architecture_page` render ARCHITECTURE.md with
        # the `markdown` module. Without it the generator dies with
        # ModuleNotFoundError and this job fails on a missing dependency rather
        # than on anything about the docs — which is what happened here.
        run: python3 -m pip install --break-system-packages markdown
      - name: Regenera o site
        run: python3 docs/gen.py
      # The contributor handbook site (docs/handbook/<lang>/) is generated from
      # docs/dev/; publishing it hand-edited or stale would show readers pages
      # that no longer match the Markdown they review.
      - name: Contributor handbook site matches docs/dev
        run: python3 scripts/dev_docs_site.py --check
      - name: O site publicado tem de ser o gerado
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ está desactualizado — corre 'python3 docs/gen.py' e commita."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
      - name: As manpages geram, e o roff é válido
        # As páginas NÃO são commitadas: são geradas pelo binário (`delonix man
        # --dir`, que é o que o `install.sh` corre) a partir da mesma árvore
        # `clap::Command` que serve o `--help`. Commitá-las era uma segunda
        # cópia da superfície da CLI, e a única com nada a vigiá-la.
        #
        # O que se verifica aqui é o que pode partir em silêncio: um escape roff
        # errado não falha a geração — a linha simplesmente DESAPARECE da página
        # renderizada. Por isso o `groff -z`, que só imprime avisos, com `-ww`
        # (todos) e o resultado tratado como erro.
        run: |
          sudo apt-get install -y groff-base
          ./target/release/delonix man --dir /tmp/dlxman --index
          n=$(ls /tmp/dlxman/man1/*.1 | wc -l)
          echo "geradas $n páginas"
          [ "$n" -ge 200 ] || { echo "::error::só $n páginas — a árvore não foi percorrida"; exit 1; }
          rc=0
          for f in /tmp/dlxman/man1/*.1; do
            out=$(groff -mandoc -ww -z "$f" 2>&1) || { echo "::error file=$f::groff falhou"; rc=1; }
            if [ -n "$out" ]; then echo "::error file=$f::roff inválido"; echo "$out" | head -5; rc=1; fi
          done
          exit $rc
      - name: Nenhum exemplo depreciado, e todas as referências resolvem
        run: |
          rc=0
          for f in examples/*.yaml; do
            # o cloud-config da VM de validação NFS não é um manifesto Delonix
            head -1 "$f" | grep -q '^#cloud-config' && continue
            out=$(./target/release/delonix stack apply -f "$f" --dry-run 2>&1) || {
              echo "::error file=$f::$f não passa no --dry-run"; echo "$out" | head -5; rc=1; continue; }
            if echo "$out" | grep -iq deprecated; then
              echo "::error file=$f::$f usa uma forma depreciada"
              echo "$out" | grep -i deprecated; rc=1
            fi
            vout=$(./target/release/delonix stack validate -f "$f" 2>&1) || {
              echo "::error file=$f::$f não passa no validate"; echo "$vout" | head -5; rc=1; }
          done
          exit $rc
