name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução por ref — cancela a anterior ainda a correr (poupa runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- Estilo: rustfmt tem de estar aplicado (ver .git-blame-ignore-revs) ----
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honra o rust-toolchain.toml (canal + componentes rustfmt/clippy).
      - name: Instala toolchain fixada
        run: rustup show
      - run: cargo fmt --all --check

  # ---- Lint: clippy a falhar em QUALQUER warning (gate estrito) ----
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` compila os .proto do CRI via prost/tonic — precisa de protoc.
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---- Testes: a suite toda (os testes que exigem privilégio auto-skipam) ----
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `delonix-cri` compila os .proto do CRI via prost/tonic — precisa de protoc.
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  # ---- Supply-chain: advisories RUSTSEC + licenças + fontes (ver deny.toml) ----
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # ---- O site e os exemplos: gerados do binário, e por isso verificáveis ----
  #
  # Duas classes de falha que só se descobriam à mão, e ambas já aconteceram:
  #
  #  1. `docs/gen.py` rebenta a MEIO (uma lista PT/EN que divergiu no tamanho,
  #     por exemplo) e deixa o site PARCIALMENTE escrito — com a página velha no
  #     lugar e nada a dizê-lo. Aqui falha alto.
  #  2. O site commitado deixa de ser o gerado. É o mesmo contrato que o
  #     `docs/schema/v1/delonix.json` já tem em teste (ADR-0007): se a fonte é o
  #     código, o publicado tem de bater com o que ela produz.
  #
  # E os `examples/` passam pelo `--dry-run` e pelo `validate` do binário desta
  # árvore — um exemplo publicado é o que as pessoas copiam. O `--dry-run` apanha
  # um Kind depreciado e um erro de parsing; o `validate` apanha uma referência
  # cruzada que não resolve. **Um campo desconhecido fica de fora**, e é medido,
  # não suposto: o `warn_unknown_fields` só corre no apply REAL, e um apply real
  # em CI criaria recursos — a verificação promete o que faz.
  docs:
    name: docs geradas e exemplos válidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Instala toolchain fixada
        run: rustup show
      - run: cargo build --release --locked -p delonix-runtime-bin
      - name: Dependências do gerador
        # `gen.py`'s `c4_page`/`architecture_page` render ARCHITECTURE.md with
        # the `markdown` module. Without it the generator dies with
        # ModuleNotFoundError and this job fails on a missing dependency rather
        # than on anything about the docs — which is what happened here.
        run: python3 -m pip install --break-system-packages markdown
      - name: Regenera o site
        run: python3 docs/gen.py
      - name: O site publicado tem de ser o gerado
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ está desactualizado — corre 'python3 docs/gen.py' e commita."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
      - name: As manpages geram, e o roff é válido
        # As páginas NÃO são commitadas: são geradas pelo binário (`delonix man
        # --dir`, que é o que o `install.sh` corre) a partir da mesma árvore
        # `clap::Command` que serve o `--help`. Commitá-las era uma segunda
        # cópia da superfície da CLI, e a única com nada a vigiá-la.
        #
        # O que se verifica aqui é o que pode partir em silêncio: um escape roff
        # errado não falha a geração — a linha simplesmente DESAPARECE da página
        # renderizada. Por isso o `groff -z`, que só imprime avisos, com `-ww`
        # (todos) e o resultado tratado como erro.
        run: |
          sudo apt-get install -y groff-base
          ./target/release/delonix man --dir /tmp/dlxman --index
          n=$(ls /tmp/dlxman/man1/*.1 | wc -l)
          echo "geradas $n páginas"
          [ "$n" -ge 200 ] || { echo "::error::só $n páginas — a árvore não foi percorrida"; exit 1; }
          rc=0
          for f in /tmp/dlxman/man1/*.1; do
            out=$(groff -mandoc -ww -z "$f" 2>&1) || { echo "::error file=$f::groff falhou"; rc=1; }
            if [ -n "$out" ]; then echo "::error file=$f::roff inválido"; echo "$out" | head -5; rc=1; fi
          done
          exit $rc
      - name: Nenhum exemplo depreciado, e todas as referências resolvem
        run: |
          rc=0
          for f in examples/*.yaml; do
            # o cloud-config da VM de validação NFS não é um manifesto Delonix
            head -1 "$f" | grep -q '^#cloud-config' && continue
            out=$(./target/release/delonix stack apply -f "$f" --dry-run 2>&1) || {
              echo "::error file=$f::$f não passa no --dry-run"; echo "$out" | head -5; rc=1; continue; }
            if echo "$out" | grep -iq deprecated; then
              echo "::error file=$f::$f usa uma forma depreciada"
              echo "$out" | grep -i deprecated; rc=1
            fi
            vout=$(./target/release/delonix stack validate -f "$f" 2>&1) || {
              echo "::error file=$f::$f não passa no validate"; echo "$vout" | head -5; rc=1; }
          done
          exit $rc
