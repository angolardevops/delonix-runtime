# Constrói a imagem VM dourada oficial e publica-a no ghcr — a que o
# `delonix vm pull` (sem argumento) descarrega. Reprodutível e independente
# de qualquer máquina de desenvolvimento: corre no runner, com o binário
# construído do próprio commit.
#
# Disparo MANUAL (`workflow_dispatch`) — publicar a imagem oficial é uma
# decisão explícita, não um efeito de cada push. O `GITHUB_TOKEN` do Actions
# já traz `packages: write`, por isso não são precisos segredos.
#
# Nota: o `virt-customize` corre com o modo `--offline` do delonix (obtém os
# .deb do k8s no host, verificados, e instala-os sem rede no appliance) — é o
# caminho que dispensa DHCP/DNS no guest. Os runners Linux do GitHub têm
# /dev/kvm (nested virt); sem ele, o libguestfs cai para TCG (mais lento, mas
# funciona).
name: VM image (golden)

on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: "Versão do Kubernetes (tag da imagem) — ignorado se no_k8s=true"
        default: "1.36"
      ubuntu_release:
        description: "Cloud image Ubuntu base (usado quando distro=ubuntu)"
        default: "24.04"
      image:
        description: "Repositório OCI de destino"
        default: "ghcr.io/angolardevops/delonix-vm-k8s"
      no_k8s:
        description: "Construir a variante SEM Kubernetes (só delonix + rootless)"
        type: boolean
        default: false
      distro:
        description: "Distro base para builds --no-k8s"
        type: choice
        options:
          - ubuntu
          - debian
          - rocky
          - fedora
        default: ubuntu
      debian_release:
        description: "Codinome Debian (usado quando distro=debian, builds --no-k8s)"
        default: "bookworm"
      rocky_release:
        description: "Versão major do Rocky (usado quando distro=rocky, builds --no-k8s)"
        default: "9"
      fedora_release:
        description: "Release E build do Fedora (ex.: 42-1.1) — o build não se deduz da versão"
        default: "42-1.1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas de build da golden
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libguestfs-tools qemu-utils cloud-image-utils
          # O supermin/libguestfs precisa de ler o kernel do host (runners: 0600).
          sudo chmod 0644 /boot/vmlinuz-* || true
      - name: Instala toolchain fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Compila delonix + delonix-cri
        run: cargo build --release --locked -p delonix-runtime-bin -p delonix-cri
      - name: Calcula tag/repositório de destino
        id: vars
        run: |
          if [ "${{ inputs.no_k8s }}" = "true" ]; then
            if [ "${{ inputs.distro }}" = "debian" ]; then
              echo "tag=delonix-vm-base:debian-${{ inputs.debian_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=debian-${{ inputs.debian_release }}" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.distro }}" = "rocky" ]; then
              echo "tag=delonix-vm-base:rocky-${{ inputs.rocky_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=rocky-${{ inputs.rocky_release }}" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.distro }}" = "fedora" ]; then
              # A tag leva só o MAJOR. O `--fedora-release` tem de trazer o build
              # (`42-1.1`) porque o nome do artefacto do fabricante o carrega e a
              # versão não o determina — mas `fedora-42-1.1` como tag OCI não diz
              # mais nada a quem a lê do que `fedora-42`, e desalinhava-se das
              # irmãs (`ubuntu-24.04`, `rocky-9`).
              FED_MAJOR="${{ inputs.fedora_release }}"; FED_MAJOR="${FED_MAJOR%%-*}"
              echo "tag=delonix-vm-base:fedora-${FED_MAJOR}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=fedora-${FED_MAJOR}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=delonix-vm-base:ubuntu-${{ inputs.ubuntu_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=ubuntu-${{ inputs.ubuntu_release }}" >> "$GITHUB_OUTPUT"
            fi
            echo "dest_repo=ghcr.io/angolardevops/delonix-vm-base" >> "$GITHUB_OUTPUT"
          else
            echo "tag=delonix-vm-k8s:${{ inputs.k8s_version }}" >> "$GITHUB_OUTPUT"
            echo "dest_tag=${{ inputs.k8s_version }}" >> "$GITHUB_OUTPUT"
            echo "dest_repo=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Constrói a imagem VM dourada (offline)
        if: ${{ inputs.no_k8s != 'true' }}
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          ./target/release/delonix image --vm build \
            --tag "${{ steps.vars.outputs.tag }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --k8s-version "${{ inputs.k8s_version }}" \
            --cri-bin ./target/release/delonix-cri \
            --delonix-bin ./target/release/delonix \
            --offline
          ./target/release/delonix image --vm ls
      # Ao contrário da golden (`--offline`, sem rede no appliance), uma build
      # `--no-k8s` INSTALA pacotes lá dentro e precisa mesmo de rede. Quem a dá é
      # o passt, e o do Ubuntu 24.04 — o runner — é o mesmo que falha nos dois
      # modos já medidos: ou recusa o `$XDG_RUNTIME_DIR` do libguestfs por
      # AppArmor, ou arranca, nunca dá lease, deixa o `dhclient` pendurar 300s e
      # o build segue SEM rede até o gestor de pacotes não resolver um mirror.
      # Daí as duas metades: um runtime dir que o perfil permite, e um passt
      # actual PRIMEIRO no PATH (o libguestfs procura-o com `passt --help`, logo
      # compilá-lo sem o pôr no PATH não muda nada).
      - name: passt actual (a build --no-k8s precisa de rede no appliance)
        if: ${{ inputs.no_k8s == 'true' }}
        run: |
          git clone --depth 1 https://passt.top/passt /tmp/passt-src
          make -C /tmp/passt-src -j"$(nproc)"
          mkdir -p /tmp/delonix-run && chmod 700 /tmp/delonix-run
          echo "/tmp/passt-src" >> "$GITHUB_PATH"
      - name: Constrói a imagem VM dourada (sem Kubernetes)
        if: ${{ inputs.no_k8s == 'true' }}
        env:
          LIBGUESTFS_BACKEND: direct
          XDG_RUNTIME_DIR: /tmp/delonix-run
        run: |
          if [ "${{ inputs.distro }}" = "debian" ]; then
            ./target/release/delonix image --vm build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro debian \
              --debian-release "${{ inputs.debian_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          elif [ "${{ inputs.distro }}" = "rocky" ]; then
            ./target/release/delonix image --vm build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro rocky \
              --rocky-release "${{ inputs.rocky_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          elif [ "${{ inputs.distro }}" = "fedora" ]; then
            ./target/release/delonix image --vm build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro fedora \
              --fedora-release "${{ inputs.fedora_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          else
            ./target/release/delonix image --vm build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --ubuntu-release "${{ inputs.ubuntu_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          fi
          ./target/release/delonix image --vm ls
      - name: Login no ghcr e push
        env:
          # Um PAT com `write:packages` (secret GHCR_TOKEN) tem precedência; sem
          # ele, o GITHUB_TOKEN — que só publica quando as "Workflow permissions"
          # do repo estão em "Read and write" (Settings → Actions → General).
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "${GHCR_TOKEN:-$GITHUB_TOKEN}" | ./target/release/delonix image login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          ./target/release/delonix image --vm push \
            "${{ steps.vars.outputs.tag }}" \
            "${{ steps.vars.outputs.dest_repo }}:${{ steps.vars.outputs.dest_tag }}"
      - name: Sumário
        run: |
          echo "### Imagem VM dourada publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.vars.outputs.dest_repo }}:${{ steps.vars.outputs.dest_tag }}\` — testa com \`delonix vm pull\`." >> "$GITHUB_STEP_SUMMARY"
