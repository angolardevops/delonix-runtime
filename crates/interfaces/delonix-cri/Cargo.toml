[package]
name = "delonix-cri"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-cri` — servidor CRI (`runtime.v1`), instalado dentro do guest de uma
# VM (ex.: a imagem dourada `delonix image --vm build`) para o kubelet falar
# com o `delonix-runtime` em vez de containerd/CRI-O. Ver `dist/delonix-cri.service`.
[[bin]]
name = "delonix-cri"
path = "src/bin/delonix-cri.rs"

[dependencies]
delonix-state = { workspace = true }
delonix-runtime-core = { workspace = true }
delonix-telemetry = { workspace = true }
delonix-compute = { workspace = true }
delonix-linux = { workspace = true }
delonix-oci = { workspace = true }
delonix-sdn = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true, features = ["sink"] }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
flate2 = { workspace = true, features = ["zlib-rs"] }
libc = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# Só para o round-trip gRPC de `tests/grpc_status.rs` — o cliente gerado precisa
# de um conector para socket unix, que o tonic não traz por si.
tower = { workspace = true, features = ["util"] }
hyper-util = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
