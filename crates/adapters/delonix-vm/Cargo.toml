[package]
name = "delonix-vm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
delonix-node = { workspace = true }
delonix-model = { workspace = true }
delonix-state = { workspace = true }
delonix-compute = { workspace = true }
# The composition root registers the local backends until the application
# layer (P5) exists: a declared, phase-tagged exception in
# `scripts/arch_fitness.py` (ADR-0044 P4b.4, docs/discovery/61).
delonix-provider-libvirt = { workspace = true }
delonix-provider-cloud-hypervisor = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
# For VmImageJsonDefaults (ADR-0076 D3): reads the 3 fields of an image's own
# recorded defaults straight off its JSON sidecar, without depending on
# bins/delonix-runtime-bin's VmImageStore.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# A per-test temp dir that is removed when the test ends, also on panic
# (`scripts/tmp_roots_gate.py`).
tempfile = { workspace = true }

[lints]
workspace = true
