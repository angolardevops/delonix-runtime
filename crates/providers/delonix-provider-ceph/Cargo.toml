[package]
name = "delonix-provider-ceph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Native Ceph support (ADR-0081): the `ceph-rbd` and `cephfs` storage pool
# drivers, and the RGW object-store port. Every backend is reached by running
# the native Ceph client tools (`ceph`, `rbd`, `rados`, `radosgw-admin`) through
# the storage `Run` port — the shape the zfs/lvm/btrfs drivers already have —
# never by linking librados.
[dependencies]
delonix-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A bucket is created by an S3 PUT, which `radosgw-admin` cannot do — the one
# place this crate speaks the gateway's data-plane protocol instead of shelling
# out to a native tool. AWS Signature V2 (HMAC-SHA1 + base64), signed against an
# RFC 1123 `Date`; `http://` endpoint, no TLS backend pulled in by default.
reqwest = { workspace = true, features = ["blocking", "rustls-tls-webpki-roots"] }
ring = { workspace = true }
base64 = { workspace = true }
httpdate = { workspace = true }

[dev-dependencies]
delonix-storage = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
