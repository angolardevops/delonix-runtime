[package]
name = "delonix-proxmox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delonix-runtime-core = { workspace = true }
delonix-vm = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The same client, features and TLS stack as `delonix-image` and
# `delonix-truenas`. It lives HERE and not in `delonix-vm`: that crate has four
# dependencies and a motor crate does not grow an HTTP client (ADR-0008).
reqwest = { workspace = true, features = ["blocking", "rustls-tls-webpki-roots", "json"] }

