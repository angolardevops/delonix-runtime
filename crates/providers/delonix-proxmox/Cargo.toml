[package]
name = "delonix-proxmox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delonix-compute = { workspace = true }
delonix-model = { workspace = true }
delonix-vm = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The same client, features and TLS stack as `delonix-oci` and
# `delonix-truenas`. It lives HERE and not in `delonix-vm`: that crate has four
# dependencies and a motor crate does not grow an HTTP client (ADR-0008).
reqwest = { workspace = true, features = ["blocking", "rustls-tls-webpki-roots", "json"] }

[lints]
workspace = true

[dev-dependencies]
# A TLS mock node: the client only speaks https, so every failure-injection
# test (401/403/404/409/5xx, truncated body, task failed, timeout) needs a
# listener with a certificate. `ring` is the provider already in the tree.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rcgen = { workspace = true, features = ["ring", "pem"] }
tempfile = { workspace = true }
