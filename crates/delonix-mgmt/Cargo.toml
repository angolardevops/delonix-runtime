[package]
name = "delonix-mgmt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "API de gestão local do Delonix Runtime (HTTP+JSON sobre unix socket)."
repository = "https://github.com/angolardevops/delonix-runtime"

[dependencies]
delonix-runtime-core = { path = "../delonix-runtime-core" }
delonix-runtime = { path = "../delonix-runtime" }
delonix-volume = { path = "../delonix-volume" }
delonix-image = { path = "../delonix-image" }
delonix-scan = { path = "../delonix-scan" }
delonix-vm = { path = "../delonix-vm" }
delonix-net = { path = "../delonix-net" }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "server"] }
tower = { workspace = true, features = ["util"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[lints]
workspace = true
