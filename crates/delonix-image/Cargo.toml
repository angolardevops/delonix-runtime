[package]
name = "delonix-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
delonix-runtime-core = { path = "../delonix-runtime-core" }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
nix = { workspace = true }
# Tipos OCI canónicos do schema image (manifesto/config/index/descritor).
oci-spec = { workspace = true, features = ["image"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "json"] }
zstd = "0.13"
base64 = "0.22"
# Verificação de assinaturas cosign/sigstore (B8): ECDSA P-256.
ring = "0.17"

[dev-dependencies]
# Property-based robustness ("fuzz on stable"): the repo pins to stable Rust, so
# `cargo-fuzz` (nightly + libfuzzer) is out — `proptest` throws structured/arbitrary
# input at the pure parsers and asserts they never panic. Dev-only: never in the
# release tree (`cargo tree -e normal` stays clean). See the `delonix-testing` skill.
proptest = "1"
# Micro-benchmarks (dev-only, stable). Pre-blessed in dependency-map.md §4.
criterion = "0.5"

[[bench]]
name = "parse_reference"
harness = false
