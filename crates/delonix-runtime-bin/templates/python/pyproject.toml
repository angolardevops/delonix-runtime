[project]
name = "__NAME__"
version = "0.1.0"
description = "A FastAPI service scaffolded by `delonix init -t python -v __TEMPLATE_VERSION__`."
requires-python = ">=3.11"
dependencies = [
    # `==X.Y.*`, not `>=X.Y`: a patch release lands with a plain `uv sync`, a
    # minor/major upgrade needs a new `-v` (see `delonix init -t python -v`).
    "fastapi==__TEMPLATE_VERSION__.*",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

# PEP 735 dev dependency group — installed by `uv sync`, excluded by `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__MODULE__"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
