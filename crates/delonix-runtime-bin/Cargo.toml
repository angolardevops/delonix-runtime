[package]
name = "delonix-runtime-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

# O `delonix` — CLI opensource completa deste motor (container/image/build/vm/
# volumes/network), agrupada em comandos semânticos. Sem a API/Console/tenant
# do PaaS privado (isso é `delonix-cli`/`delonix-paas`, outro repo).
[[bin]]
name = "delonix"
path = "src/main.rs"

[dependencies]
delonix-runtime-core = { path = "../delonix-runtime-core" }
delonix-runtime = { path = "../delonix-runtime" }
delonix-image = { path = "../delonix-image" }
delonix-vm = { path = "../delonix-vm" }
delonix-volume = { path = "../delonix-volume" }
# Provisioning on a NAS (ADR-0009). Only the bin depends on it — a motor crate
# does not grow an HTTP client.
delonix-truenas = { path = "../delonix-truenas" }
# The Proxmox VM backend (ADR-0008). Same reason it lives outside `delonix-vm`,
# and the bin is where its target (endpoint, node, credential) is known — so
# this is the process that registers it.
delonix-proxmox = { path = "../delonix-proxmox" }
delonix-scan = { path = "../delonix-scan" }
# The node's security decisions (ADR-0026). Pure: three dependencies, no daemon,
# no privileges — see the crate doc for what it deliberately does NOT do.
delonix-security-runtime = { path = "../delonix-security-runtime" }
delonix-cri = { path = "../delonix-cri" }
delonix-mgmt = { path = "../delonix-mgmt" }
# The MCP server (ADR-0025) — a local, tenancy-free AI control surface. Kept
# out of the workspace's dependency-clean engine crates for the same reason
# `delonix-mgmt` already is: it carries `rmcp` + its own tokio runtime.
delonix-mcp = { path = "../delonix-mcp" }
# Reverse-proxy L7 embutido (`delonix ingress-proxy`, kind: HTTPRoute) — hyper puro
# + hyper-util. JÁ estão na árvore do bin (transitivos via delonix-cri/tonic), por
# isso não acrescentam superfície de supply-chain nova; só passam a deps directas.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "io-util", "signal"] }
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
# TLS do proxy (Fase 3): tokio-rustls já está na árvore (via delonix-cri). O
# provider é o `ring` (já presente) — não puxamos aws-lc-rs. `rustls-pemfile`
# carrega cert/chave BYO (PEM do kind: Secret); `rcgen` gera o self-signed.
tokio-rustls = { workspace = true, features = ["ring", "logging", "tls12"] }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true, features = ["ring", "pem"] }
# `__volsnap` (tar.gz do _data de um volume, no userns mapeado) — ja no workspace,
# nao acrescenta nada a arvore de dependencias do repo publico.
tar = { workspace = true }
flate2 = { workspace = true }
delonix-net = { path = "../delonix-net" }
clap = { workspace = true }
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls-webpki-roots"] }
libc = { workspace = true }
# `delonix dash` — TUI interactivo (tiles/tabela/gráfico estilo htop). Só o BIN a
# usa (os crates de motor ficam dep-limpos); o modo `--once` (snapshot de texto)
# não precisa de tty. ratatui traz o crossterm.
ratatui = { workspace = true }
oci-spec = { workspace = true, features = ["runtime"] }
schemars = { workspace = true, features = ["derive"] }

[lints]
workspace = true
