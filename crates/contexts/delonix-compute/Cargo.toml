[package]
name = "delonix-compute"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
delonix-node = { workspace = true }
delonix-model = { workspace = true }
delonix-net-rules = { workspace = true }
serde = { workspace = true }
# The guest agent's answers (ADR-0068 D4) are JSON whoever relays them; already
# in the tree through `schemars`, so no new crate.
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The spec types derive their JSON Schema next to their definition, so the
# published schema cannot drift from the types (ADR-0040: the generated schema
# belongs to the contexts, not to the CLI).
schemars = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
