# Wazuh (SIEM/XDR) — built by the repository's appliance builder.
#
#   delonix vm build -f images/wazuh/vm.yaml
#
# This image is not described as edits to a cloud image: the vendor's installer has
# to RUN. So the recipe names a BUILDER, not a script path — `builder: X` runs
# scripts/appliances/build-X.sh from this repository, with an isolated OUT_DIR,
# and registers the disk it leaves there. Nothing outside that directory can be
# reached from this file.
version: 1

images:
  wazuh:
    tag: "wazuh-${WAZUH_VERSION:-4.14.7-1}-r${IMAGE_REV:-1}"
    distro: ubuntu
    release: "24.04"
    vcpus: 4
    memory: 8G
    appliance:
      builder: wazuh
      env:
        WAZUH_VERSION: "${WAZUH_VERSION:-4.14.7-1}"
        IMAGE_REV: "${IMAGE_REV:-1}"
      # false: a true appliance, no cloud-init. true: a cloud image with software installed.
      cloud_init: true
