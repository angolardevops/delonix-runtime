# Debian cloud image, built by `delonix vm build`.
#
#   delonix vm build -f images/debian/vm.yaml -t bookworm
#
# `-t` is the name of the result AND `${TAG}` below, which this file uses as
# the codename of the base (`bookworm`, `trixie`). Every relative path in this file
# is relative to THIS folder, wherever you run the command from.
#
# It builds with NO network inside the guest, so the first build works on any
# host. Turn `network` on and use `packages` when you need to install software.
version: 1

images:
  debian:
    tag: debian-${TAG:-bookworm}

    # ── base ──────────────────────────────────────────────────────────────
    distro: debian
    release: "${TAG:-bookworm}"
    size: 10G                     # grown BEFORE any step runs

    # ── identity & defaults recorded in the image (used by `vm create`) ────
    hostname: debian
    vcpus: 2
    memory: 2G
    labels:
      org.delonix.image: debian

    # ── build-time network. Off: a build that reaches the internet gives a ─
    # ── different image depending on the day.                              ─
    network: false

    # ── what goes IN ──────────────────────────────────────────────────────
    # To install software: set `network: true` above and list it here
    # (the guest agent is not in the base image). Installed with apt.
    # packages:
    #   upgrade: false
    #   install: [qemu-guest-agent]
    files:
      - src: artifacts/motd
        dst: /etc/motd
        mode: "0644"
    env:
      DELONIX_IMAGE: debian
    users:
      - name: delonix
        sudo: true
        groups: [adm]
        shell: /bin/bash

    # ── what goes OUT — removed after everything above ran ────────────────
    # Here: `unattended-upgrades`, so the image does not patch itself behind your back.
    remove:
      packages: [unattended-upgrades]
      paths:
        - /usr/share/info
        - /usr/share/man

    # ── first boot ────────────────────────────────────────────────────────
    cloud_init: cloud-init/user-data

    # ── housekeeping (these are the defaults; say false to keep) ──────────
    cleanup:
      package_cache: true
      logs: true
      history: true
      tmp: true
      machine_id: true
      ssh_host_keys: false
