# Proxmox (VE, Backup Server, Mail Gateway, Datacenter Manager) — built by the repository's appliance builder.
#
#   delonix vm build -f images/proxmox/vm.yaml --target pve -t 9.2-1
#
# This image is not described as edits to a cloud image: the vendor's installer has
# to RUN. So the recipe names a BUILDER, not a script path — `builder: X` runs
# scripts/appliances/build-X.sh from this repository, with an isolated OUT_DIR,
# and registers the disk it leaves there. Nothing outside that directory can be
# reached from this file.
#
# `-t` is the name of the result AND `${TAG}`, which this file uses as the version.
version: 1

images:
  pve:
    tag: "proxmox-ve-${TAG:-9.2-1}"
    distro: proxmox-ve
    release: "${TAG:-9.2-1}"
    vcpus: 4
    memory: 4G
    appliance:
      builder: proxmox
      args: [pve, "${TAG:-9.2-1}"]
      # false: a true appliance, no cloud-init. true: a cloud image with software installed.
      cloud_init: false

  pbs:
    tag: "proxmox-backup-server-${TAG:-4.2-1}"
    distro: proxmox-backup-server
    release: "${TAG:-4.2-1}"
    vcpus: 2
    memory: 2G
    appliance:
      builder: proxmox
      args: [pbs, "${TAG:-4.2-1}"]
      # false: a true appliance, no cloud-init. true: a cloud image with software installed.
      cloud_init: false

  pmg:
    tag: "proxmox-mail-gateway-${TAG:-9.1-1}"
    distro: proxmox-mail-gateway
    release: "${TAG:-9.1-1}"
    vcpus: 2
    memory: 2G
    appliance:
      builder: proxmox
      args: [pmg, "${TAG:-9.1-1}"]
      # false: a true appliance, no cloud-init. true: a cloud image with software installed.
      cloud_init: false

  pdm:
    tag: "proxmox-datacenter-manager-${TAG:-1.1-1}"
    distro: proxmox-datacenter-manager
    release: "${TAG:-1.1-1}"
    vcpus: 2
    memory: 2G
    appliance:
      builder: proxmox
      args: [pdm, "${TAG:-1.1-1}"]
      # false: a true appliance, no cloud-init. true: a cloud image with software installed.
      cloud_init: false
