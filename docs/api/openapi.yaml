components:
    schemas:
        delonix.node.v1.ApplyStackRequest:
            type: object
            properties:
                stack:
                    type: string
                manifest:
                    type: string
                    format: bytes
                prune:
                    type: boolean
                replace:
                    type: array
                    items:
                        type: string
                request_id:
                    type: string
        delonix.node.v1.BuildImageRequest:
            type: object
            properties:
                context_path:
                    type: string
                    description: |-
                        Build context as a path on this node. Uploading a context over the socket is a
                         later addition, deliberately not in v1.
                file:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                target_stage:
                    type: string
                platform:
                    type: string
                build_args:
                    type: object
                    additionalProperties:
                        type: string
                secret_refs:
                    type: array
                    items:
                        type: string
                no_cache:
                    type: boolean
                request_id:
                    type: string
        delonix.node.v1.CancelOperationRequest:
            type: object
            properties:
                id:
                    type: string
        delonix.node.v1.Capability:
            type: object
            properties:
                name:
                    type: string
                supported:
                    type: boolean
                detail:
                    type: string
                state:
                    type: string
                    description: |-
                        One of the catalog's states (ADR-0050 D2): "supported" | "partial" |
                         "unsupported-by-provider" | "requires-external-component" | "not-implemented" |
                         "unavailable-on-host". `supported` above is the boolean reading of it.
            description: |-
                A named optional capability a provider declares (topology §6: discovery, not the
                 lowest common denominator). A request needing a capability the selected provider lacks
                 is FAILED_PRECONDITION with ErrorDetail.reason = "CapabilityNotSupported".
        delonix.node.v1.Capacity:
            type: object
            properties:
                cpu_millis_total:
                    type: string
                cpu_millis_allocatable:
                    type: string
                memory_bytes_total:
                    type: string
                memory_bytes_allocatable:
                    type: string
                pids_allocatable:
                    type: string
                filesystems:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.FilesystemCapacity'
                containers_running:
                    type: integer
                    format: int32
                vms_running:
                    type: integer
                    format: int32
                unmeasured:
                    type: array
                    items:
                        type: string
                    description: |-
                        Fields that could not be measured are listed here instead of being reported as 0.
                         A zero that comes from a failed measurement is not a zero.
        delonix.node.v1.CloudInit:
            type: object
            properties:
                hostname:
                    type: string
                ssh_authorized_keys:
                    type: array
                    items:
                        type: string
                user_data:
                    type: string
        delonix.node.v1.Condition:
            type: object
            properties:
                type:
                    type: string
                status:
                    type: integer
                    format: enum
                reason:
                    type: string
                message:
                    type: string
                last_transition_time:
                    type: string
                    format: date-time
            description: 'Kubernetes-style condition: the observed state, with the reason machine-readable.'
        delonix.node.v1.ConnectContainerRequest:
            type: object
            properties:
                network:
                    type: string
                container:
                    type: string
                namespace:
                    type: string
                ipv4_address:
                    type: string
        delonix.node.v1.Container:
            type: object
            properties:
                meta:
                    $ref: '#/components/schemas/delonix.node.v1.ResourceMeta'
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.ContainerSpec'
                status:
                    $ref: '#/components/schemas/delonix.node.v1.ContainerStatus'
        delonix.node.v1.ContainerSpec:
            type: object
            properties:
                image:
                    type: string
                entrypoint:
                    type: array
                    items:
                        type: string
                command:
                    type: array
                    items:
                        type: string
                env:
                    type: object
                    additionalProperties:
                        type: string
                secrets:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.SecretRef'
                    description: Secret references, resolved at spawn and never persisted as plaintext.
                workdir:
                    type: string
                user:
                    type: string
                hostname:
                    type: string
                resources:
                    $ref: '#/components/schemas/delonix.node.v1.Resources'
                mounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Mount'
                networks:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.NetworkAttachment'
                ports:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.PortMapping'
                security:
                    $ref: '#/components/schemas/delonix.node.v1.SecurityContext'
                restart:
                    $ref: '#/components/schemas/delonix.node.v1.RestartPolicy'
                health_check:
                    $ref: '#/components/schemas/delonix.node.v1.HealthCheck'
                pod:
                    type: string
                    description: The pod this container joins (shares net/ipc/uts). Empty = standalone.
                devices:
                    type: array
                    items:
                        type: string
                tmpfs:
                    type: array
                    items:
                        type: string
                read_only_rootfs:
                    type: boolean
                sysctls:
                    type: object
                    additionalProperties:
                        type: string
                log_format:
                    type: string
        delonix.node.v1.ContainerStats:
            type: object
