                name:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.VolumeSpec'
                request_id:
                    type: string
        delonix.node.v1.DeleteImageRequest:
            type: object
            properties:
                reference:
                    type: string
        delonix.node.v1.DestroyStackRequest:
            type: object
            properties:
                stack:
                    type: string
                manifest:
                    type: string
                    format: bytes
                request_id:
                    type: string
        delonix.node.v1.DisconnectContainerRequest:
            type: object
            properties:
                network:
                    type: string
                container:
                    type: string
                namespace:
                    type: string
                ipv4_address:
                    type: string
        delonix.node.v1.ErrorDetail:
            type: object
            properties:
                reason:
                    type: string
                resource:
                    type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                retryable:
                    type: boolean
                    description: True only when retrying the SAME request can succeed (transport, lock contention).
                retry_after:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
            description: |-
                Attached to every non-OK gRPC status (as a binary detail) and every non-2xx REST body.
                 `reason` is the stable DX_* code the CLI already exits with (cmd/exitcode.rs), so a
                 script, the CLI and an API client classify a failure the same way.
        delonix.node.v1.Event:
            type: object
            properties:
                time:
                    type: string
                    format: date-time
                kind:
                    type: string
                action:
                    type: string
                target:
                    type: string
                namespace:
                    type: string
                attributes:
                    type: object
                    additionalProperties:
                        type: string
                trace_id:
                    type: string
        delonix.node.v1.FilesystemCapacity:
            type: object
            properties:
                role:
                    type: string
                mountpoint:
                    type: string
                bytes_total:
                    type: string
                bytes_available:
                    type: string
                inodes_total:
                    type: string
                inodes_available:
                    type: string
        delonix.node.v1.Health:
            type: object
            properties:
                overall:
                    type: integer
                    description: |-
                        Overall = worst of the parts. Each part is a Condition with a stable reason:
                         "NetworkReady", "StoreWritable", "CgroupDelegated", "ProvidersAvailable".
                    format: enum
                conditions:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Condition'
        delonix.node.v1.HealthCheck:
            type: object
            properties:
                command:
                    type: array
                    items:
                        type: string
                interval:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                timeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                retries:
                    type: integer
                    format: int32
                start_period:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
        delonix.node.v1.Image:
            type: object
