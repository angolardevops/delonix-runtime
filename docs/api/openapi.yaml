                cpu_usage_nanos:
                    type: string
                memory_working_set_bytes:
                    type: string
                memory_limit_bytes:
                    type: string
                pids:
                    type: string
                network_rx_bytes:
                    type: string
                network_tx_bytes:
                    type: string
                writable_layer_bytes:
                    type: string
