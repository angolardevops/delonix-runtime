                    type: string
        delonix.node.v1.StopContainerRequest:
            type: object
            properties:
                name:
                    type: string
                namespace:
                    type: string
                grace_period:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
        delonix.node.v1.StopVirtualMachineRequest:
            type: object
            properties:
                name:
                    type: string
                namespace:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.VirtualMachine:
            type: object
            properties:
                meta:
                    $ref: '#/components/schemas/delonix.node.v1.ResourceMeta'
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.VirtualMachineSpec'
                status:
                    $ref: '#/components/schemas/delonix.node.v1.VirtualMachineStatus'
        delonix.node.v1.VirtualMachineSpec:
            type: object
            properties:
                image:
                    type: string
                    description: |-
                        Image store reference or path. Resolved by the engine the same way for every
                         entry point (the CLI and the manifest diverged on this once).
                vcpus:
                    type: integer
                    format: int32
                memory_bytes:
                    type: string
                disk_bytes:
                    type: string
                networks:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.NetworkAttachment'
                cloud_init:
                    $ref: '#/components/schemas/delonix.node.v1.CloudInit'
                provider:
                    type: string
                    description: |-
                        Provider selection is a REQUIREMENT, not a name: the engine picks a provider that
                         supports every listed capability, or honours `provider` when set explicitly.
                required_capabilities:
                    type: array
                    items:
                        type: string
                extensions:
                    $ref: '#/components/schemas/delonix.node.v1.ProviderExtensions'
                restart:
                    type: integer
                    format: enum
        delonix.node.v1.VirtualMachineStatus:
            type: object
            properties:
                phase:
                    type: integer
                    format: enum
                provider:
                    type: string
                ip_addresses:
                    type: array
                    items:
                        type: string
                ip_predicted:
                    type: boolean
                    description: |-
                        True when the address is computed (e.g. derived from the MAC) rather than observed
                         from the guest. "Has an IP" is only "is up" when this is false.
                conditions:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Condition'
        delonix.node.v1.Volume:
            type: object
