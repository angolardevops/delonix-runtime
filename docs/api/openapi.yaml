                aliases:
                    type: array
                    items:
                        type: string
        delonix.node.v1.NetworkSpec:
            type: object
            properties:
                topology:
                    type: integer
                    description: |-
                        Topology, not implementation: "bridge" (single-node L2) or "overlay" (multi-node).
                         WHICH dataplane realizes it is the network provider's choice; the implementation
                         name never appears in a field the caller writes.
                    format: enum
                ipv4_cidr:
                    type: string
                overlay:
                    $ref: '#/components/schemas/delonix.node.v1.OverlaySpec'
                extensions:
                    $ref: '#/components/schemas/delonix.node.v1.ProviderExtensions'
        delonix.node.v1.NodeInfo:
            type: object
            properties:
                engine_version:
                    type: string
                engine_commit:
                    type: string
                api_version:
                    type: string
                hostname:
                    type: string
                kernel:
                    type: string
                arch:
                    type: string
                rootless:
                    type: boolean
                cgroup_driver:
                    type: string
                cgroup_delegated:
                    type: boolean
                supported_workload_types:
                    type: array
                    items:
                        type: string
        delonix.node.v1.Operation:
            type: object
            properties:
                id:
                    type: string
                state:
                    type: integer
                    format: enum
                target:
                    type: string
                    description: '"Container/web", "Stack/shop" — what the operation acts on.'
                verb:
                    type: string
                progress_message:
                    type: string
                    description: Human progress line, and a 0..100 figure when the operation can measure one (-1 if not).
                progress_percent:
                    type: integer
                    format: int32
                create_time:
                    type: string
                    format: date-time
                end_time:
                    type: string
                    format: date-time
                result:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Any'
                    description: 'Set when state = SUCCEEDED: the typed result (e.g. a Container).'
                error:
                    allOf:
                        - $ref: '#/components/schemas/delonix.node.v1.ErrorDetail'
                    description: Set when state = FAILED.
                request_id:
                    type: string
                    description: The caller's request_id this operation answered, for idempotent retries.
                trace_id:
                    type: string
                    description: W3C trace id of the request that started it, so an operation and its spans join up.
        delonix.node.v1.OverlayPeer:
            type: object
            properties:
                node_ip:
                    type: string
                public_key:
                    type: string
                tunnel_ip:
                    type: string
        delonix.node.v1.OverlaySpec:
            type: object
            properties:
                vni:
                    type: integer
                    format: uint32
                encrypted:
                    type: boolean
                peers:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.OverlayPeer'
        delonix.node.v1.PageResponse:
            type: object
            properties:
                next_page_token:
                    type: string
