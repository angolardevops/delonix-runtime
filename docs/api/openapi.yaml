                    $ref: '#/components/schemas/delonix.node.v1.PodSpec'
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Container'
                conditions:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Condition'
        delonix.node.v1.PodSpec:
            type: object
