                         never from a ResourceMeta whose server-owned fields the engine would have to ignore.
                name:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.VirtualMachineSpec'
                request_id:
                    type: string
