                seccomp_profile:
                    type: string
                apparmor_profile:
                    type: string
                no_new_privileges:
                    type: boolean
                masked_paths:
                    type: array
                    items:
                        type: string
                readonly_paths:
                    type: array
                    items:
                        type: string
        delonix.node.v1.ShareOf:
            type: object
            properties:
                parent_volume:
                    type: string
        delonix.node.v1.Snapshot:
            type: object
            properties:
                name:
