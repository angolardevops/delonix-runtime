                phase:
                    type: integer
                    format: enum
                pid:
                    type: integer
                    format: int32
                exit_code:
                    type: integer
                    description: |-
                        Set once the container has exited AND the code was actually observed. Absent means
                         "not captured" — never a fabricated 137.
                    format: int32
                reason:
                    type: string
                    description: 'Machine-readable termination reason: "OOMKilled", "Error", "Completed", "StoppedByUser".'
                ip_addresses:
                    type: array
                    items:
                        type: string
                conditions:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Condition'
                image_digest:
                    type: string
        delonix.node.v1.CreateContainerRequest:
            type: object
            properties:
                namespace:
                    type: string
                    description: |-
                        Identity comes from the request — the same `namespace`/`name` the path carries — and
                         never from a ResourceMeta whose server-owned fields the engine would have to ignore.
                name:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.ContainerSpec'
                request_id:
                    type: string
                    description: |-
                        Idempotency key: the same request_id within the retention window returns the SAME
                         Operation instead of creating a second container.
                start:
                    type: boolean
        delonix.node.v1.CreateNetworkRequest:
            type: object
            properties:
                namespace:
                    type: string
                    description: |-
                        Identity comes from the request — the same `namespace`/`name` the path carries — and
                         never from a ResourceMeta whose server-owned fields the engine would have to ignore.
                name:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.NetworkSpec'
                request_id:
                    type: string
        delonix.node.v1.CreatePodRequest:
            type: object
            properties:
                namespace:
                    type: string
                    description: |-
                        Identity comes from the request — the same `namespace`/`name` the path carries — and
                         never from a ResourceMeta whose server-owned fields the engine would have to ignore.
                name:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                spec:
                    $ref: '#/components/schemas/delonix.node.v1.PodSpec'
                request_id:
                    type: string
        delonix.node.v1.CreateSnapshotRequest:
            type: object
            properties:
                virtual_machine:
                    type: string
                namespace:
                    type: string
                snapshot:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.CreateVirtualMachineRequest:
            type: object
