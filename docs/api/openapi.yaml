                namespace:
                    type: string
                snapshot:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.ResumeVirtualMachineRequest:
            type: object
            properties:
                name:
                    type: string
                namespace:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.ScanImageRequest:
            type: object
            properties:
                reference:
                    type: string
        delonix.node.v1.SecretRef:
            type: object
            properties:
