                by_provider:
                    type: object
                    additionalProperties:
                        type: object
            description: |-
                Provider-specific options, namespaced by provider id ("libvirt", "proxmox", …).
                 The contract never names a provider; a provider validates its own entry against its
                 own schema and fails closed on unknown keys.
        delonix.node.v1.ProviderInfo:
            type: object
            properties:
                id:
                    type: string
                kind:
                    type: string
                available:
                    type: boolean
                capabilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.Capability'
                health:
                    $ref: '#/components/schemas/delonix.node.v1.Condition'
                catalog_version:
                    type: string
                    description: The version of the capability catalog the names are drawn from (ADR-0050 D1).
        delonix.node.v1.ProvisionRequest:
            type: object
            properties:
                provider:
                    type: string
                extensions:
                    $ref: '#/components/schemas/delonix.node.v1.ProviderExtensions'
        delonix.node.v1.PullImageRequest:
            type: object
            properties:
                reference:
                    type: string
                platform:
                    type: string
                credentials_secret:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.PushImageRequest:
            type: object
            properties:
                reference:
                    type: string
                destination:
                    type: string
                credentials_secret:
                    type: string
                request_id:
                    type: string
        delonix.node.v1.RemoteShare:
            type: object
            properties:
                protocol:
                    type: integer
                    format: enum
                server:
                    type: string
                share:
                    type: string
                credentials_secret:
                    type: string
                read_only:
                    type: boolean
        delonix.node.v1.ResourceMeta:
            type: object
            properties:
                name:
                    type: string
                    description: Name, unique per (kind, namespace). Immutable.
                namespace:
                    type: string
                    description: Engine isolation namespace. Empty means "default".
                uid:
                    type: string
                    description: Engine-assigned id. Immutable, never reused.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                annotations:
                    type: object
                    additionalProperties:
                        type: string
                create_time:
                    type: string
                    format: date-time
                update_time:
                    type: string
                    format: date-time
                etag:
                    type: string
                    description: |-
                        Opaque version for optimistic concurrency. Send it back on update/delete; a stale
                         etag is FAILED_PRECONDITION, never a silent overwrite.
            description: Identity and bookkeeping common to every resource the engine manages.
        delonix.node.v1.Resources:
            type: object
            properties:
                memory_limit_bytes:
                    type: string
                memory_reservation_bytes:
                    type: string
                cpu_limit_millis:
                    type: string
                cpu_weight:
                    type: string
                cpuset:
                    type: string
                pids_limit:
                    type: string
            description: |-
                Resource quantities in base units — bytes and millicores — never "1G" strings on the
                 wire. Parsing human sizes is an edge concern (CLI, manifest), not a contract concern.
        delonix.node.v1.RestartPolicy:
            type: object
            properties:
                mode:
                    type: integer
                    format: enum
                max_retries:
                    type: integer
                    format: int32
        delonix.node.v1.RestoreSnapshotRequest:
