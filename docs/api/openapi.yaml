                containers:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.NamedContainer'
                share_process_namespace:
                    type: boolean
                networks:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.NetworkAttachment'
                ports:
                    type: array
                    items:
                        $ref: '#/components/schemas/delonix.node.v1.PortMapping'
        delonix.node.v1.PortMapping:
            type: object
            properties:
                host_ip:
                    type: string
                host_port:
                    type: integer
                    format: int32
                container_port:
                    type: integer
                    format: int32
                protocol:
                    type: integer
                    format: enum
        delonix.node.v1.ProviderExtensions:
            type: object
