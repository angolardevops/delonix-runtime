#cloud-config
# ===========================================================================
#  The build seed for the FreePBX 17 image (FreePBX 17 + Asterisk on Debian
#  12, open-source modules only). Consumed ONLY by build-freepbx.sh, inside
#  QEMU, never by a deployed VM.
# ===========================================================================
# `@FREEPBX_INSTALLER_COMMIT@`/`@FREEPBX_INSTALLER_SHA256@`/`@FREEPBX_KEY_FPR@`/
# `@ASTERISK_MAJOR@`/`@DEBIAN_BUILD@`/`@IMAGE_REV@` are substituted by the
# script, and `@FREEPBX_FIRST_BOOT@` is replaced by freepbx-first-boot.
#
# One script, not a list of `runcmd` entries: cloud-init keeps going after a
# failed `runcmd` element, and a half-installed PBX still looks like a server
# that boots.

# The vendor installer refuses to run without a fully qualified name.
fqdn: freepbx-build.localdomain
manage_etc_hosts: true

write_files:
  # `delonix vm create --ssh-key` creates the `delonix` account, but a golden
  # image built from a plain cloud image gives it no sudo.
  - path: /etc/sudoers.d/90-delonix
    permissions: "0440"
    content: |
      delonix ALL=(ALL) NOPASSWD:ALL
  # Per-clone secrets, once, on the clone's first boot -- see the file itself.
  - path: /usr/local/sbin/delonix-freepbx-first-boot
    permissions: "0700"
    content: |
@FREEPBX_FIRST_BOOT@
  - path: /etc/systemd/system/delonix-freepbx-first-boot.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Delonix FreePBX: per-clone admin and AMI secrets
      After=network-online.target mariadb.service freepbx.service
      Wants=network-online.target
      ConditionPathExists=!/var/lib/delonix/freepbx-first-boot.done

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/delonix-freepbx-first-boot
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  - path: /root/build.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/delonix-freepbx-build.log) 2>&1
      echo "=== delonix freepbx build: FreePBX 17 + Asterisk @ASTERISK_MAJOR@ (installer @FREEPBX_INSTALLER_COMMIT@) ==="
      export DEBIAN_FRONTEND=noninteractive

      retry() {
        local n=0 max=${2:-5}
        until eval "$1"; do
          n=$((n+1))
          [ "$n" -ge "$max" ] && { echo "!! gave up after $max attempts: $1"; return 1; }
          echo "==> attempt $n failed, retrying in $((n*10))s: $1"
          sleep $((n*10))
        done
      }

      echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/99delonix-retries
      retry "timeout 300 apt-get update"
      retry "timeout 600 apt-get install -y curl ca-certificates gnupg openssl"

      # ------------------------------------------------------------------
      #  The vendor's installer, pinned by commit, checked by sha256.
      #  Nothing runs before it matches.
      # ------------------------------------------------------------------
      retry "curl -fsSL --max-time 120 -o /root/sng_freepbx_debian_install.sh https://raw.githubusercontent.com/FreePBX/sng_freepbx_debian_install/@FREEPBX_INSTALLER_COMMIT@/sng_freepbx_debian_install.sh"
      echo "@FREEPBX_INSTALLER_SHA256@  /root/sng_freepbx_debian_install.sh" | sha256sum -c - \
        || { echo "!! FreePBX installer checksum mismatch"; exit 1; }

      # ONE patch to the vendor's script, applied after the checksum and
      # checked to touch exactly one line. Measured on the first build
      # (2026-09-30): with --opensourceonly the installer pipes every
      # commercial module into `xargs fwconsole ma -f remove`, and the vendor's
      # own `oracle_connector` fails its un-installation scripts -- under the
      # installer's `set -e` that aborts the whole install. The line right
      # after it already does `fwconsole ma -f remove firewall ... || true`;
      # this gives the same tolerance to the line before, and the result is
      # CHECKED below instead of trusted: no commercial module may be left
      # enabled.
      REMOVE_LINE='xargs -t -I {} fwconsole ma -f remove {} >> "$log"$'
      [ "$(grep -cF 'xargs -t -I {} fwconsole ma -f remove {} >> "$log"' /root/sng_freepbx_debian_install.sh)" = 1 ] \
        || { echo "!! the installer's commercial-module removal line is not where the patch expects it"; exit 1; }
      sed -i "s#$REMOVE_LINE#& || true#" /root/sng_freepbx_debian_install.sh
      [ "$(grep -cF 'fwconsole ma -f remove {} >> "$log" || true' /root/sng_freepbx_debian_install.sh)" = 1 ] \
        || { echo "!! the installer patch did not apply"; exit 1; }

      # --opensourceonly: no commercial modules (and, with them, no sysadmin
      #   or Responsive Firewall -- fail2ban stays). --skipversion: the
      #   installer would otherwise fetch a newer copy of itself, which is the
      #   pin undone.
      if ! ASTVERSION=@ASTERISK_MAJOR@ bash /root/sng_freepbx_debian_install.sh --opensourceonly --skipversion; then
        echo "!! the FreePBX installer failed. Its own log:"
        tail -80 /var/log/pbx/freepbx17-install-*.log || true
        exit 1
      fi

      # The installer fetched the repository key over plain http. It is only
      # trusted if it is the key we pinned.
      FPR=$(gpg --show-keys --with-colons /etc/apt/trusted.gpg.d/freepbx.gpg 2>/dev/null | awk -F: '/^fpr/ {print $10; exit}')
      if [ "$FPR" != "@FREEPBX_KEY_FPR@" ]; then
        echo "!! the FreePBX apt key is $FPR, not the pinned @FREEPBX_KEY_FPR@"; exit 1
      fi
      echo "==> FreePBX apt key matches the pinned fingerprint"

      # ------------------------------------------------------------------
      #  What was installed -- read from the running system, not assumed.
      # ------------------------------------------------------------------
      for i in $(seq 1 60); do asterisk -rx "core show version" >/dev/null 2>&1 && break; sleep 2; done
      AST_VER=$(asterisk -rx "core show version" | awk '/^Asterisk/ {print $2; exit}')
      case "$AST_VER" in
        @ASTERISK_MAJOR@.*) echo "==> Asterisk $AST_VER" ;;
        *) echo "!! Asterisk is '$AST_VER', not @ASTERISK_MAJOR@.x"; exit 1 ;;
      esac
      FW_VER=$(fwconsole ma list 2>/dev/null | awk -F'|' '$2 ~ /^ *framework *$/ {gsub(/ /,"",$3); print $3; exit}')
      [ -n "$FW_VER" ] || { echo "!! could not read the FreePBX framework version"; exit 1; }
      mkdir -p /etc/delonix

      # The other half of the patch above: whatever the vendor's removal left
      # behind gets a second try, then a disable; an ENABLED commercial module
      # fails the build.
      commercial() { fwconsole ma list 2>/dev/null | awk -F'|' '/Commercial/ {gsub(/ /,"",$2); print $2}'; }
      LEFT=$(commercial | tr '\n' ' ')
      for m in $LEFT; do
        echo "==> commercial module still present after the installer: $m"
        fwconsole ma -f remove "$m" || fwconsole ma -f disable "$m" || true
      done
      ENABLED=$(fwconsole ma list 2>/dev/null | awk -F'|' '/Commercial/ && /Enabled/ {gsub(/ /,"",$2); print $2}' | tr '\n' ' ')
      [ -z "${ENABLED// /}" ] || { echo "!! commercial modules still enabled: $ENABLED"; exit 1; }
      LEFT_AFTER=$(commercial | tr '\n' ' ')
      echo "==> commercial modules left (none enabled): ${LEFT_AFTER:-none}"
      fwconsole ma list > /etc/delonix/freepbx-modules.txt 2>&1 || true

      # The AMI secret and the admin login are rotated on each clone's first
      # boot. Keep a hash of the build's AMI secret so verify-freepbx.sh can
      # prove the rotation happened -- the hash, never the secret.
      AMI_BUILD_SHA=$(mysql -N asterisk -e "SELECT value FROM freepbx_settings WHERE keyword='AMPMGRPASS'" | tr -d '[:space:]' | sha256sum | cut -d' ' -f1)
      systemctl enable delonix-freepbx-first-boot.service

      {
        echo "{"
        echo "  \"freepbx_framework\": \"$FW_VER\","
        echo "  \"asterisk_version\": \"$AST_VER\","
        echo "  \"installer_commit\": \"@FREEPBX_INSTALLER_COMMIT@\","
        echo "  \"apt_key_fingerprint\": \"@FREEPBX_KEY_FPR@\","
        echo "  \"debian_build\": \"@DEBIAN_BUILD@\","
        echo "  \"modules\": \"open-source only\","
        echo "  \"commercial_modules_left_disabled\": \"${LEFT_AFTER% }\","
        echo "  \"installer_patch\": \"commercial-module removal tolerates a failing module (oracle_connector)\","
        echo "  \"web_port\": 80,"
        echo "  \"ami_build_secret_sha256\": \"$AMI_BUILD_SHA\","
        echo "  \"image_revision\": @IMAGE_REV@"
        echo "}"
      } > /etc/delonix/freepbx-image.json
      cat /etc/delonix/freepbx-image.json
      # What key material the install left behind, for the first real build
      # to decide on (a key baked here is shared by every clone).
      echo "==> key material under /etc/asterisk/keys:"; ls -la /etc/asterisk/keys 2>/dev/null || echo "   (none)"

      apt-get clean
      rm -rf /var/lib/apt/lists/*
      rm -f /root/sng_freepbx_debian_install.sh

      # No build identity in a golden image: hostname, machine-id, SSH host keys.
      echo localhost > /etc/hostname
      cloud-init clean --logs --seed
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub

runcmd:
  # The marker, and only the marker, is what the build script believes.
  - |
    if /root/build.sh; then
      echo "DELONIX-FREEPBX-BUILD-OK" > /dev/console
    else
      echo "DELONIX-FREEPBX-BUILD-FAIL rc=$?" > /dev/console
      tail -60 /var/log/delonix-freepbx-build.log > /dev/console
    fi
    sync
    poweroff
