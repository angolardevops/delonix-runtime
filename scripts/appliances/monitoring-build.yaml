         "gridPos": {
          "h": 8,
          "w": 12,
          "x": 0,
          "y": 12
         },
         "targets": [
          {
           "expr": "probe_duration_seconds",
           "legendFormat": "{{job}} {{instance}}",
           "instant": false,
           "refId": "A"
          }
         ],
         "fieldConfig": {
          "defaults": {
           "unit": "s"
          },
          "overrides": []
         }
        },
        {
         "id": 8,
         "type": "timeseries",
         "title": "CPU (%)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "gridPos": {
          "h": 8,
          "w": 6,
          "x": 12,
          "y": 12
         },
         "targets": [
          {
           "expr": "100 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100",
           "legendFormat": "{{instance}}",
           "instant": false,
           "refId": "A"
          }
         ],
         "fieldConfig": {
          "defaults": {
           "unit": "percent"
          },
          "overrides": []
         }
        },
        {
         "id": 9,
         "type": "timeseries",
         "title": "Memória usada (%)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "gridPos": {
          "h": 8,
          "w": 6,
          "x": 18,
          "y": 12
         },
         "targets": [
          {
           "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
           "legendFormat": "{{instance}}",
           "instant": false,
           "refId": "A"
          }
         ],
         "fieldConfig": {
          "defaults": {
           "unit": "percent"
          },
          "overrides": []
         }
        },
        {
         "id": 10,
         "type": "logs",
         "title": "Logs (syslog da rede + journal)",
         "datasource": {
          "type": "loki",
          "uid": "loki"
         },
         "gridPos": {
          "h": 10,
          "w": 24,
          "x": 0,
          "y": 20
         },
         "targets": [
          {
           "expr": "{job=~\".+\"}",
           "refId": "A",
           "queryType": "range"
          }
         ],
         "options": {
          "showTime": true,
          "wrapLogMessage": true,
          "sortOrder": "Descending"
         }
        }
       ],
       "editable": true
      }
      JSON
      chown -R grafana:grafana /var/lib/grafana/dashboards
      systemctl restart grafana-server

      # ------------------------------------------------------------------
      #  What a clone actually has -- readable from inside any VM cloned
      #  from this image, same two-carrier idea as the golden k8s template
      #  and the OpenStack image: the filename says what was asked for,
      #  this file says what is there.
      # ------------------------------------------------------------------
      mkdir -p /etc/delonix
      {
        echo "{"
        echo "  \"zabbix_version\": \"@ZABBIX_VERSION@\","
        echo "  \"grafana_version\": \"@GRAFANA_VERSION@\","
        echo "  \"grafana_zabbix_app_version\": \"@ZABBIX_GRAFANA_APP_VERSION@\","
        echo "  \"zabbix_db\": \"postgresql-local\","
        echo "  \"zabbix_frontend_port\": 80,"
        echo "  \"grafana_port\": 3000,"
        echo "  \"prometheus_version\": \"@PROMETHEUS_VERSION@\","
        echo "  \"alertmanager_version\": \"@ALERTMANAGER_VERSION@\","
        echo "  \"blackbox_exporter_version\": \"@BLACKBOX_VERSION@\","
        echo "  \"node_exporter_version\": \"@NODE_EXPORTER_VERSION@\","
        echo "  \"loki_version\": \"@LOKI_VERSION@\","
        echo "  \"alloy_version\": \"@ALLOY_VERSION@\","
        echo "  \"syslog_port\": 1514,"
        echo "  \"image_revision\": @IMAGE_REV@"
        echo "}"
      } > /etc/delonix/monitoring-image.json
      cat /etc/delonix/monitoring-image.json

      apt-get clean
      rm -rf /var/lib/apt/lists/*

      # This image must not carry this boot's identity -- the same lesson
      # every golden image in this repo already learned: without it every
      # clone comes up with the same machine-id and SSH host keys.
      cloud-init clean --logs --seed
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub

runcmd:
  # The marker, and only the marker, is what the build script believes --
  # the same two lessons openstack-build.yaml already paid for: QEMU exits 0
  # whether the guest finished or panicked, and cloud-init reports success
  # for a `runcmd` whose script failed.
  - |
    if /root/build.sh; then
      echo "DELONIX-MONITORING-BUILD-OK" > /dev/console
    else
      echo "DELONIX-MONITORING-BUILD-FAIL rc=$?" > /dev/console
      tail -60 /var/log/delonix-monitoring-build.log > /dev/console
    fi
    sync
    poweroff
