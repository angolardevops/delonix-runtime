[package]
name = "delonix-mcp-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-mcp` — the MCP server's own executable (ADR-0040 D2.4 as amended).
# People reach it as `delonix mcp`, which runs this binary: the server lives in
# one executable and `delonix` stays the only name a user needs.
[[bin]]
name = "delonix-mcp"
path = "src/main.rs"

[dependencies]
delonix-mcp = { workspace = true }
delonix-runtime-core = { workspace = true }
delonix-telemetry = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json = { workspace = true }

[lints]
workspace = true
