version: "3.9"
# Docker Compose alternative to Delonix Stack. Use either:
#   delonix secret create __NAME__-app --from-literal "APP_KEY=base64:$(head -c 32 /dev/urandom | base64)"
#   delonix stack apply                  (uses delonix-manifest.yaml)
#
#   docker-compose up                    (uses this file, adjust APP_KEY below)
#
# Both approaches run the same application. Choose based on your preference:
# - delonix stack: declarative, edge-triggered, production-ready
# - docker-compose: simpler, stateless, great for development
services:
  __NAME__:
    build:
      context: .
      dockerfile: Dockerfile
    image: __NAME__:dev
    container_name: __NAME__
    restart: always
    ports:
      - "__PORT__:__PORT__"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - SHUTDOWN_TIMEOUT=15s
      - APP_KEY=base64:change-me
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/lib/app/database.sqlite
    volumes:
      - __NAME__-data:/var/lib/app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:__PORT__/api/v1/health/live') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "app"
    tmpfs:
      - /tmp
      - /data
      - /config

  __NAME__-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: __NAME__:dev
    container_name: __NAME__-worker
    restart: always
    command: ["worker"]
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - APP_KEY=base64:change-me
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/lib/app/database.sqlite
    volumes:
      - __NAME__-data:/var/lib/app
    user: "app"
    tmpfs:
      - /tmp
    depends_on:
      - __NAME__

volumes:
  __NAME__-data:
    driver: local
