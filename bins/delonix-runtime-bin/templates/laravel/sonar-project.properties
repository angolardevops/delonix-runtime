sonar.projectKey=__NAME__
sonar.projectName=__NAME__
sonar.sources=app,bootstrap,config,database,routes
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**
sonar.sourceEncoding=UTF-8
# For coverage: `vendor/bin/phpunit --coverage-clover coverage/clover.xml`
# (needs the xdebug or pcov extension), then scan.
sonar.php.coverage.reportPaths=coverage/clover.xml
