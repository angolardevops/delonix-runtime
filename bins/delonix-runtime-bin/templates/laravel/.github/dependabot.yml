version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups:
      opentelemetry:
        patterns: ["open-telemetry/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
