# Delonix manifest — the service as it runs. Apply with:
#   delonix build -t __NAME__:dev .
#   delonix stack apply
apiVersion: delonix.io/v1
kind: Container
metadata:
  name: __NAME__
  labels:
    app: __NAME__
spec:
  image: __NAME__:dev
  restart: always
  # The unprivileged user of the image (`node`, uid 1000). Named here because the engine
  # applies an image's USER only when the manifest asks for it.
  user: "node"
  ports:
    - "__PORT__:__PORT__"
  env:
    - "APP_ENV=production"
    - "LOG_LEVEL=info"
    - "SHUTDOWN_TIMEOUT=15s"
    - "HOSTNAME=0.0.0.0"
  # Webhook secrets come from a Delonix secret, never from this file:
  #   delonix secret create __NAME__-webhooks --from-literal WEBHOOK_INBOUND_SECRET=whsec_...
  # then add under env (grouped form):
  #   env:
  #     vars: ["APP_ENV=production"]
  #     secrets: [__NAME__-webhooks]
  memory: 512M
  cpus: "1.0"
  readOnly: true
  tmpfs:
    - "/tmp"
