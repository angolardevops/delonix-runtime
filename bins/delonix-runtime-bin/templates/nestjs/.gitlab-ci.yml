# Same gate as .github/workflows/ci.yml.
image: node:24-slim

stages:
  - check

check:
  stage: check
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  before_script:
    - test -f pnpm-lock.yaml || { echo "pnpm-lock.yaml is missing — run 'pnpm install' once and commit it; CI installs with --frozen-lockfile"; exit 1; }
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm check
    - pnpm audit --prod
