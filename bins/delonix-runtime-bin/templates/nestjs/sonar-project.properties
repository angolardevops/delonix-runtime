sonar.projectKey=__NAME__
sonar.projectName=__NAME__
sonar.sources=src
sonar.exclusions=src/**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts
sonar.sourceEncoding=UTF-8
# `pnpm test:cov` before a Sonar scan, if you want coverage reported.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
