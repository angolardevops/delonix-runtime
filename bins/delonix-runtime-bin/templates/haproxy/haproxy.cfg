# HAProxy __TEMPLATE_VERSION__ — L7 reverse proxy / load balancer.
# Validated at build time (`haproxy -c`, see the Delonixfile).

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode    http
    log     global
    option  dontlognull
    option  http-server-close
    option  forwardfor
    # Explicit timeouts: a slow client cannot hold a connection open, and a
    # backend that stops answering fails the request instead of hanging it.
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s
    timeout http-keep-alive 5s
    timeout queue           30s

frontend http_in
    bind *:__PORT__

    # Correlation: keep the caller's X-Request-ID, or mint one; forward it to
    # the backend, log it, and return it to the client.
    unique-id-format %{+X}o%ci%cp%fi%fp%Ts%rt%pid
    http-request set-header X-Request-ID %[unique-id] unless { req.hdr(x-request-id) -m found }
    http-request set-var(txn.request_id) req.hdr(x-request-id)

    # Structured access log on stdout: one JSON object per request.
    log-format '{"time":"%[date,utime(%Y-%m-%dT%H:%M:%SZ)]","request_id":"%[var(txn.request_id)]","remote_addr":"%ci","method":"%HM","uri":"%HPO","status":%ST,"bytes_sent":%B,"duration_ms":%Ta,"backend":"%b","server":"%s","termination":"%tsc"}'

    # Health answered by the proxy itself (no backend needed), kept out of the log.
    http-request set-log-level silent if { path /healthz }
    http-request return status 200 content-type "text/plain" string "ok\n" if { path /healthz }

    # Security headers on every response. `http-after-response`, not
    # `http-response`: the responses the proxy generates itself (`/healthz`,
    # the standalone backend below, its own errors) skip `http-response` rules.
    http-after-response set-header X-Request-ID %[var(txn.request_id)]
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header X-Frame-Options DENY
    http-after-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-after-response del-header Server

    default_backend app

    # TLS — terminate here only when nothing in front does. Mount a PEM with
    # the certificate and key (never COPY a key into the image), publish 8443
    # in delonix-manifest.yaml, and uncomment:
    # bind *:8443 ssl crt /usr/local/etc/haproxy/tls/site.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2
    # http-after-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Prometheus metrics (built into the official image). Not published by the
# manifest: reachable from inside the container or from another container on
# the same Delonix network.
frontend metrics
    bind *:8405
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

backend app
    balance roundrobin
    # Real deployment: point at your app containers (same Delonix network,
    # container name or networkAlias) with health checks, then delete the
    # standalone `http-request return` below:
    #   option httpchk GET /healthz
    #   server app1 app:3000 check
    #   server app2 app2:3000 check
    # Standalone scaffold: the proxy answers directly so it runs out of the box.
    http-request return status 200 content-type "text/html" string "<h1>__NAME__ via HAProxy</h1>\n"
