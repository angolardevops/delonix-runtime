# HAProxy __TEMPLATE_VERSION__ — L7 reverse proxy / load balancer, HTTPS on.
# Validated at build time (`haproxy -c`, see the Delonixfile).

global
    log stdout format raw local0 info
    # Connections this process accepts in total. Each one is a descriptor on
    # each side, which is why the manifest raises `nofile` to 65535.
    maxconn 20000
    # One thread per CPU the container is ALLOWED. Left alone, HAProxy counts
    # the host's cores. Keep this equal to `cpus:` in the manifest.
    nbthread 2
    # Start as root (the manifest says `user: "0"`) to read the private key,
    # then drop to the unprivileged account for everything that touches traffic.
    user  haproxy
    group haproxy
    # Mozilla "intermediate": TLS 1.2 + 1.3, forward-secret AEAD suites only.
    ssl-default-bind-options     ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.cachesize 40000

defaults
    mode    http
    log     global
    option  dontlognull
    option  forwardfor
    # Keep connections to the backends open and share idle ones between
    # requests: under load, a new TCP (or TLS) handshake per request is the
    # first thing that saturates.
    option  http-keep-alive
    http-reuse safe
    option  redispatch
    retries 2
    maxconn 19000
    # Explicit timeouts: a slow client cannot hold a connection open, and a
    # backend that stops answering fails the request instead of hanging it.
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s
    timeout http-keep-alive 5s
    timeout queue           30s

frontend http_in
    bind *:__PORT__ backlog 4096
    # The PEM (certificate + key in one file) is MOUNTED from ./tls, never in
    # the image: `delonix init` generated a local one, `scripts/tls.sh` renews
    # it or replaces it with a publicly trusted one.
    bind *:__TLS_PORT__ ssl crt /usr/local/etc/haproxy/tls/tls.pem alpn h2,http/1.1 backlog 4096

    # Correlation: keep the caller's X-Request-ID, or mint one; forward it to
    # the backend, log it, and return it to the client.
    unique-id-format %{+X}o%ci%cp%fi%fp%Ts%rt%pid
    http-request set-header X-Request-ID %[unique-id] unless { req.hdr(x-request-id) -m found }
    http-request set-var(txn.request_id) req.hdr(x-request-id)

    # Structured access log on stdout: one JSON object per request.
    log-format '{"time":"%[date,utime(%Y-%m-%dT%H:%M:%SZ)]","request_id":"%[var(txn.request_id)]","remote_addr":"%ci","method":"%HM","uri":"%HPO","status":%ST,"bytes_sent":%B,"duration_ms":%Ta,"backend":"%b","server":"%s","termination":"%tsc"}'

    # Health answered by the proxy itself (no backend needed), kept out of the log.
    http-request set-log-level silent if { path /healthz }
    http-request return status 200 content-type "text/plain" string "ok\n" if { path /healthz }

    # Plain HTTP only answers the health probe; everything else goes to HTTPS.
    # The redirect names the port THIS project publishes; drop `:__TLS_PORT__`
    # once the manifest publishes 443.
    http-request redirect location https://%[req.hdr(host),field(1,:)]:__TLS_PORT__%[pathq] code 308 unless { ssl_fc }
    # Behind a tunnel (delonix-tunnel.yaml) the visitor's scheme arrives in
    # X-Forwarded-Proto: one who came in over plain HTTP goes to https on the
    # public address, which has no port. A direct client that sends the
    # header only redirects itself.
    http-request redirect scheme https code 308 if { ssl_fc } { req.hdr(x-forwarded-proto) -i http }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # Security headers on every response. `http-after-response`, not
    # `http-response`: the responses the proxy generates itself (`/healthz`,
    # the standalone backend below, its own errors) skip `http-response` rules.
    http-after-response set-header X-Request-ID %[var(txn.request_id)]
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header X-Frame-Options DENY
    http-after-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-after-response del-header Server

    default_backend app

    # HSTS is OFF on purpose: it pins the HOST NAME, every port of it. With
    # the generated `localhost` certificate it would force every other service
    # on this machine's localhost to HTTPS. Turn it on for a real domain:
    # http-after-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains" if { ssl_fc }

# Prometheus metrics (built into the official image). Not published by the
# manifest: reachable from inside the container or from another container on
# the same Delonix network.
frontend metrics
    bind *:8405
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

backend app
    balance roundrobin
    # Real deployment: point at your app containers (same Delonix network,
    # container name or networkAlias) with health checks, then delete the
    # standalone `http-request return` below:
    #   option httpchk GET /healthz
    #   default-server check inter 2s fall 3 rise 2 maxconn 500
    #   server app1 app:3000
    #   server app2 app2:3000
    # Standalone scaffold: the proxy answers directly so it runs out of the box.
    http-request return status 200 content-type "text/html" string "<h1>__NAME__ via HAProxy</h1>\n"
