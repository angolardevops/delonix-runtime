# A local OpenTelemetry Collector for development: receives OTLP over HTTP
# and prints what it gets. Run it next to the service (see
# docs/runbooks/operations.md) and point the service at it with
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<collector-host>:4318
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
