# Apache httpd __TEMPLATE_VERSION__ — this template's settings, included at the
# END of the image's own conf/httpd.conf (see the Delonixfile), so anything here
# overrides the defaults. Validated at build time with `httpd -t`.

# mod_unique_id is commented out in the image's httpd.conf; it mints the
# per-request id used for correlation below.
LoadModule unique_id_module modules/mod_unique_id.so

# Without a ServerName httpd guesses one from the container's address and
# logs AH00558 on every start. Set the public name here when there is one.
ServerName localhost

# --- No version or OS in headers and error pages; no TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- Limits and timeouts, explicit (httpd's defaults are 300 s / unlimited).
Timeout 30
KeepAliveTimeout 5
LimitRequestBody 10485760
<IfModule reqtimeout_module>
    RequestReadTimeout header=15-30,MinRate=500 body=15,MinRate=500
</IfModule>

# --- Correlation: keep the caller's X-Request-ID, or use mod_unique_id's.
#     The same id goes into the access log and back to the client; mod_proxy
#     forwards request headers, so an upstream receives it too.
RequestHeader setifempty X-Request-ID "%{UNIQUE_ID}e"
Header always set X-Request-ID "expr=%{req:X-Request-ID}"

# --- Security headers.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
# Once the site is served over HTTPS only:
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# --- Structured access log on stdout (the image's `common` line is disabled
#     by the Delonixfile). One JSON object per request; no cookies, no
#     Authorization. Health probes are left out.
SetEnvIf Request_URI "^/healthz$" dontlog
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t%{%z}t\",\"request_id\":\"%{X-Request-ID}i\",\"remote_addr\":\"%a\",\"method\":\"%m\",\"uri\":\"%U\",\"status\":%>s,\"bytes_sent\":%B,\"duration_us\":%D,\"user_agent\":\"%{User-Agent}i\"}" json
CustomLog /proc/self/fd/1 json env=!dontlog

# --- Health: a static file, answered as plain text.
<Files "healthz">
    ForceType text/plain
</Files>

# --- Status counters for a scraper, reachable only from inside the container.
<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

# --- Reverse-proxy example — uncomment the modules and the block, and point it
#     at an app on the same Delonix network (container name or networkAlias):
# LoadModule proxy_module      modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# ProxyPreserveHost On
# ProxyTimeout 30
# ProxyPass        "/api/" "http://app:3000/" connectiontimeout=5 timeout=30
# ProxyPassReverse "/api/" "http://app:3000/"
# RequestHeader set X-Forwarded-Proto "http"

