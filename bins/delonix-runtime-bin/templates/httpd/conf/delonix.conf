# Apache httpd __TEMPLATE_VERSION__, HTTPS on — this template's settings, included at the
# END of the image's own conf/httpd.conf (see the Delonixfile), so anything here
# overrides the defaults. Validated at build time with `httpd -t`.

# mod_unique_id is commented out in the image's httpd.conf; it mints the
# per-request id used for correlation below.
LoadModule unique_id_module modules/mod_unique_id.so
# TLS, its session cache, HTTP/2, and the HTTP→HTTPS redirect.
LoadModule ssl_module           modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule http2_module         modules/mod_http2.so
LoadModule rewrite_module       modules/mod_rewrite.so

# --- Capacity (event MPM, the image's default). httpd's stock numbers are
#     sized for a small VM: 400 workers, 25 threads per process. These give
#     4 x 64 = 256 request threads, and the event MPM parks idle keep-alive
#     connections outside them (AsyncRequestWorkerFactor), so the connection
#     ceiling is several times that. Raise ServerLimit AND MaxRequestWorkers
#     together, with `cpus`/`memory` in the manifest (~1 MiB per thread).
<IfModule mpm_event_module>
    ThreadLimit              64
    ServerLimit              4
    StartServers             2
    ThreadsPerChild          64
    MinSpareThreads          64
    MaxSpareThreads          192
    MaxRequestWorkers        256
    AsyncRequestWorkerFactor 4
    MaxConnectionsPerChild   0
</IfModule>
ListenBackLog 4096

# Without a ServerName httpd guesses one from the container's address and
# logs AH00558 on every start. Set the public name here when there is one.
ServerName localhost

# --- No version or OS in headers and error pages; no TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- Limits and timeouts, explicit (httpd's defaults are 300 s / unlimited).
Timeout 30
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
LimitRequestBody 10485760
<IfModule reqtimeout_module>
    RequestReadTimeout header=15-30,MinRate=500 body=15,MinRate=500
</IfModule>

# --- Correlation: keep the caller's X-Request-ID, or use mod_unique_id's.
#     The same id goes into the access log and back to the client; mod_proxy
#     forwards request headers, so an upstream receives it too.
RequestHeader setifempty X-Request-ID "%{UNIQUE_ID}e"
Header always set X-Request-ID "expr=%{req:X-Request-ID}"

# --- Security headers.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
# HSTS is OFF on purpose: it pins the HOST NAME, every port of it. With the
# generated `localhost` certificate it would force every other service on this
# machine's localhost to HTTPS. Turn it on once this serves a real domain with
# a publicly trusted certificate:
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# --- Structured access log on stdout (the image's `common` line is disabled
#     by the Delonixfile). One JSON object per request; no cookies, no
#     Authorization. Health probes are left out.
SetEnvIf Request_URI "^/healthz$" dontlog
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t%{%z}t\",\"request_id\":\"%{X-Request-ID}i\",\"remote_addr\":\"%a\",\"method\":\"%m\",\"uri\":\"%U\",\"status\":%>s,\"bytes_sent\":%B,\"duration_us\":%D,\"user_agent\":\"%{User-Agent}i\"}" json
CustomLog /proc/self/fd/1 json env=!dontlog

# --- Health: a static file, answered as plain text.
<Files "healthz">
    ForceType text/plain
</Files>

# --- Status counters for a scraper, reachable only from inside the container.
<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

# --- Reverse-proxy example — uncomment the modules and the block, and point it
#     at an app on the same Delonix network (container name or networkAlias):
# LoadModule proxy_module      modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# ProxyPreserveHost On
# ProxyTimeout 30
# ProxyPass        "/api/" "http://app:3000/" connectiontimeout=5 timeout=30
# ProxyPassReverse "/api/" "http://app:3000/"
# RequestHeader set X-Forwarded-Proto "https"

# --- HTTP (__PORT__): health, the status page, the ACME challenge — and a
#     redirect to HTTPS for everything else. The redirect names the port THIS
#     project publishes; drop `:__TLS_PORT__` once the manifest publishes 443.
Alias "/.well-known/acme-challenge/" "/usr/local/apache2/acme/.well-known/acme-challenge/"
<Directory "/usr/local/apache2/acme">
    Options None
    AllowOverride None
    ForceType text/plain
    Require all granted
</Directory>
<VirtualHost *:__PORT__>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/healthz$
    RewriteCond %{REQUEST_URI} !^/server-status
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1:__TLS_PORT__%{REQUEST_URI} [R=308,L]
</VirtualHost>

# --- HTTPS (__TLS_PORT__): the site. The certificate and key are MOUNTED from ./tls
#     (never baked into the image): `delonix init` generated a local one,
#     `scripts/tls.sh` renews it or replaces it with a publicly trusted one.
Listen __TLS_PORT__
# Mozilla "intermediate": TLS 1.2 + 1.3, forward-secret AEAD suites only.
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
# The session cache is a memory-mapped file: on a tmpfs (see `tmpfs:` in the
# manifest) it never touches the disk.
SSLSessionCache "shmcb:/run/httpd/ssl_scache(4194304)"
SSLSessionCacheTimeout 86400
<VirtualHost *:__TLS_PORT__>
    Protocols h2 http/1.1
    SSLEngine on
    SSLCertificateFile    /usr/local/apache2/conf/tls/tls.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/tls/tls.key
    # Behind a tunnel (delonix-tunnel.yaml) the visitor's scheme arrives in
    # X-Forwarded-Proto: one who came in over plain HTTP goes to https on the
    # public address, which has no port. A direct client that sends the
    # header only redirects itself.
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>
