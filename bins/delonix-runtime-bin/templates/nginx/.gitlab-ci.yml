# Same gate as .github/workflows/ci.yml: both run scripts/ci-check.sh, which
# starts the real server and runs scripts/smoke.sh against it.
image: nginx:__TEMPLATE_VERSION__

stages:
  - check

check:
  stage: check
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl openssl
  script:
    - sh scripts/ci-check.sh
