sonar.projectKey=__NAME__
sonar.projectName=__NAME__
# A config-only project: what Sonar can analyse here is the shell (the TLS and
# smoke scripts), the static site, and the Delonixfile.
sonar.sources=.
sonar.exclusions=tls/**,acme/**,letsencrypt/**
sonar.tests=scripts
sonar.test.inclusions=scripts/smoke.sh,scripts/ci-check.sh
sonar.sourceEncoding=UTF-8
