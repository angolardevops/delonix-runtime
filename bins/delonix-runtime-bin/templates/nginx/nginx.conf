# nginx __TEMPLATE_VERSION__ — static site + reverse-proxy-ready edge, HTTPS on.
# Validated at build time (`nginx -t`, see the Delonixfile); re-check a live
# edit with `delonix container exec __NAME__ nginx -t`.

# One worker per CPU the container is ALLOWED, not per CPU of the host: inside
# a container `auto` counts the host's cores, and 32 workers under a 2-CPU
# ceiling only fight each other. Keep this equal to `cpus:` in the manifest.
worker_processes 2;
# Each connection is one descriptor (two when proxying). The manifest raises
# the container's own limit to match (`ulimit: nofile=65535`).
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;            # no version in headers or error pages

    # --- Limits and timeouts: explicit, so a slow or oversized client cannot
    #     hold a worker. Raise client_max_body_size for upload endpoints only.
    client_max_body_size   10m;
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;
    keepalive_timeout      30s;
    keepalive_requests     1000;
    reset_timedout_connection on;

    # --- Static files: remember descriptors and misses instead of a stat() and
    #     an open() per request.
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # --- Correlation: keep the caller's X-Request-ID, or mint one. The same id
    #     goes into the access log, back to the client, and (in the proxy
    #     example below) to the upstream.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # --- Structured access log on stdout (`delonix container logs`). One JSON
    #     object per line; no cookies, no Authorization, no query-string
    #     values beyond the request line itself.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$req_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # --- Per-client limits — off by default. Every client that reaches a
    #     published port through `localhost` arrives with the same source
    #     address, so a per-address limit there throttles all of them together.
    #     Enable on a host that sees real client addresses:
    # limit_req_zone  $binary_remote_addr zone=perip:10m rate=50r/s;
    # limit_conn_zone $binary_remote_addr zone=conns:10m;
    # (and inside the HTTPS server:)  limit_req zone=perip burst=100 nodelay;  limit_conn conns 100;

    # --- HTTP (__PORT__): health, the ACME challenge, and a redirect to HTTPS.
    server {
        listen      __PORT__ backlog=4096;
        server_name _;

        location = /healthz {
            access_log   off;          # probes every few seconds are noise
            default_type text/plain;
            return 200 "ok\n";
        }

        # Connection/request counters for a scraper — reachable only from
        # inside the container (the healthcheck, `delonix container exec`).
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny  all;
        }

        # Let's Encrypt HTTP-01: the challenge must be answered over plain
        # HTTP, so it is the one path that is not redirected. `./acme` on the
        # host is mounted here (see scripts/letsencrypt.sh).
        location ^~ /.well-known/acme-challenge/ {
            root         /var/www/acme;
            default_type text/plain;
            try_files    $uri =404;
        }

        # Everything else goes to HTTPS. The port is the one THIS project
        # publishes; drop `:__TLS_PORT__` once the manifest publishes 443.
        location / {
            return 308 https://$host:__TLS_PORT__$request_uri;
        }
    }

    # --- HTTPS (__TLS_PORT__): the site. The certificate and key are MOUNTED from
    #     ./tls (never baked into the image): `delonix init` generated a local
    #     one, `scripts/tls.sh` renews it, `scripts/letsencrypt.sh` replaces it
    #     with a publicly trusted one.
    server {
        listen      __TLS_PORT__ ssl backlog=4096;
        http2       on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        # Mozilla "intermediate": TLS 1.2 + 1.3, forward-secret AEAD suites only.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:10m;   # ~40 000 sessions, shared by the workers
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root        /usr/share/nginx/html;
        index       index.html;

        # Security headers. `add_header` is NOT inherited by a location that
        # declares its own, so no location below uses add_header.
        add_header X-Request-ID              $req_id always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'" always;
        # HSTS is OFF on purpose: it pins the HOST NAME, every port of it. With
        # the generated `localhost` certificate it would force every other
        # service on this machine's localhost to HTTPS. Turn it on once this
        # serves a real domain with a publicly trusted certificate:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Reverse-proxy example — uncomment and point at your app (a container
        # on the same Delonix network, reached by its name or networkAlias):
        # location /api/ {
        #     proxy_pass            http://app:3000/;
        #     proxy_http_version    1.1;
        #     proxy_set_header      Host              $host;
        #     proxy_set_header      X-Request-ID      $req_id;
        #     proxy_set_header      X-Real-IP         $remote_addr;
        #     proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header      X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout    30s;
        #     proxy_read_timeout    30s;
        #     # For load: declare an `upstream app { server app:3000; keepalive 64; }`
        #     # above, proxy_pass http://app/, and `proxy_set_header Connection "";`
        #     # — otherwise every request opens a new connection to the app.
        # }
    }

}
