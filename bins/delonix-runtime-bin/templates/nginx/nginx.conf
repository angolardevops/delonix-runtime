# nginx __TEMPLATE_VERSION__ — static site + reverse-proxy-ready edge.
# Validated at build time (`nginx -t`, see the Delonixfile); re-check a live
# edit with `delonix container exec __NAME__ nginx -t`.
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;            # no version in headers or error pages

    # --- Limits and timeouts: explicit, so a slow or oversized client cannot
    #     hold a worker. Raise client_max_body_size for upload endpoints only.
    client_max_body_size   10m;
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;
    keepalive_timeout      30s;
    reset_timedout_connection on;

    # --- Correlation: keep the caller's X-Request-ID, or mint one. The same id
    #     goes into the access log, back to the client, and (in the proxy
    #     example below) to the upstream.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # --- Structured access log on stdout (`delonix container logs`). One JSON
    #     object per line; no cookies, no Authorization, no query-string
    #     values beyond the request line itself.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$req_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    server {
        listen      __PORT__;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Security headers. `add_header` is NOT inherited by a location that
        # declares its own, so no location below uses add_header.
        add_header X-Request-ID              $req_id always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'" always;
        # Once this site is served over HTTPS only, add:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /healthz {
            access_log   off;          # probes every few seconds are noise
            default_type text/plain;
            return 200 "ok\n";
        }

        # Connection/request counters for a scraper — reachable only from
        # inside the container (the healthcheck, `delonix container exec`).
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny  all;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Reverse-proxy example — uncomment and point at your app (a container
        # on the same Delonix network, reached by its name or networkAlias):
        # location /api/ {
        #     proxy_pass            http://app:3000/;
        #     proxy_http_version    1.1;
        #     proxy_set_header      Host              $host;
        #     proxy_set_header      X-Request-ID      $req_id;
        #     proxy_set_header      X-Real-IP         $remote_addr;
        #     proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header      X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout    30s;
        #     proxy_read_timeout    30s;
        # }
    }

    # TLS — terminate here when nothing in front of this container does.
    # Mount the certificate and key (never bake them into the image), publish
    # the port in delonix-manifest.yaml, and uncomment:
    # server {
    #     listen      8443 ssl;
    #     http2       on;
    #     server_name example.org;
    #     ssl_certificate     /etc/nginx/tls/tls.crt;
    #     ssl_certificate_key /etc/nginx/tls/tls.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_session_cache   shared:TLS:10m;
    #     root  /usr/share/nginx/html;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # }
}
