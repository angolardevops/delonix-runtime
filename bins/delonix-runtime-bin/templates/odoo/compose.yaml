# The single way to bring the Odoo stack up. One file, two engines:
#
#   docker compose up -d                  # Docker / Podman Compose
#   delonix compose up                    # Delonix' own Compose path
#
# It stays inside the subset BOTH engines serve: no `${VAR}` interpolation
# (Delonix does not expand shell variables), so every value is either literal
# here or supplied through `env_file: [.env]` — credentials live ONLY in .env
# (git-ignored, generated by `delonix init`), never in this file.
#
# This is the OFFICIAL odoo image (Odoo IS the app) wired to PostgreSQL. The
# addons and the production odoo.conf are BIND-MOUNTED from the project, so a
# Python/XML edit lands on the next `restart` with no image build — the same
# files delonix-manifest.yaml bakes in. The Delonixfile / `delonix build`
# path and the two manifests still work; this is the Compose-shaped way in.
#
# Default profile: Odoo + PostgreSQL. The `quality` profile adds SonarQube and
# its own database (heavy — start it only when you scan):
#
#   docker compose --profile quality up -d
#   delonix compose up --profile quality
#
# SonarQube needs a host setting Compose cannot make for you; `delonix compose
# up --profile quality` checks it and prints the fix. Set it once:
#   sudo sysctl -w vm.max_map_count=262144      # and persist in /etc/sysctl.d
services:
  __NAME__:
    image: odoo:__TEMPLATE_VERSION__
    restart: always
    # The official odoo entrypoint reads HOST / USER / PASSWORD for the
    # database connection; HOST=db matches the `db` service below. PASSWORD
    # comes from .env (the ONE generated Postgres secret). PORT is left at the
    # entrypoint's default (5432) on purpose — do not set it to the published
    # web port.
    env_file: [.env]
    environment:
      HOST: db
    ports:
      - "__PORT__:8069"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Prod-shaped config + custom addons, bind-mounted (edit on the host, no
      # rebuild). Matches what delonix-manifest.yaml bakes into the image.
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8069/web/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16            # Odoo 20 refuses anything older (MIN_PG_VERSION = 16)
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env. The SAME
    # password feeds Odoo's PASSWORD above — one secret, rotated in one place.
    env_file: [.env]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- quality profile: SonarQube + its database ----------------------------
  sonarqube:
    image: sonarqube:lts-community
    profiles: [quality]
    restart: always
    # SONAR_JDBC_* come from .env; they match the sonar-db credentials there.
    env_file: [.env]
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    # No container healthcheck: the official image ships no curl/wget, and first
    # start migrates the database for a few minutes. Watch readiness with
    # `curl -s localhost:9000/api/system/status` (expect `"status":"UP"`).

  sonar-db:
    image: postgres:16-alpine
    profiles: [quality]
    restart: always
    # The sonar database is `sonar`/`sonar`; .env carries only ONE Postgres
    # password (shared with Odoo's db), so USER and DB are pinned here, out of
    # .env's reach. SONAR_JDBC_PASSWORD in .env matches this POSTGRES_PASSWORD.
    env_file: [.env]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
    driver: local
  odoo-data:
    driver: local
  sonarqube-data:
    driver: local
  sonarqube-extensions:
    driver: local
  sonarqube-logs:
    driver: local
  sonar-db-data:
    driver: local
