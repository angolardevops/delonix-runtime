name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA (the tag is in the comment); Dependabot
      # (.github/dependabot.yml) proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The addons under `addons/` are this project's code: this is the gate
      # that covers them from the first one you write. Addon TESTS need a live
      # database (`--test-tags /<addon>`, see README.md) and are deliberately
      # not here — a job that silently tests nothing would be worse than one
      # that says what it covers.
      - run: pipx install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
