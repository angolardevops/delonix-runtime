[options]
; Odoo __TEMPLATE_VERSION__ — DEV config. delonix-manifest.dev.yaml
; bind-mounts this file over /etc/odoo/odoo.conf, so editing it takes effect
; on the next `delonix container restart __NAME__` — no image rebuild.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Odoo's OWN live-reload, not a delonix mechanism:
;   - "reload": the dev server watches every module's .py files and restarts
;     itself on change (odoo/service/server.py, `dev_mode`/AUTORELOAD).
;   - "qweb"/"xml": templates are re-read from disk on every request, no
;     restart at all — the fastest loop for view/template work.
; `all` expands to reload+qweb+xml, which is what "complete live reload for
; dev" means: edit Python and the server restarts itself; edit a view and it
; is picked up on the next page load.
dev_mode = all

; Workers are a multi-process deployment shape that `dev_mode = reload` does
; not support (there's no single process to restart) — 0 is not a smaller
; version of prod, it's the only value autoreload works with at all.
workers = 0

list_db = True
without_demo = False
log_level = debug
logfile =
