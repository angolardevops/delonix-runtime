[options]
; Odoo __TEMPLATE_VERSION__ — PRODUCTION config, baked into the image by the
; Delonixfile. db_host/db_port/db_user/db_password are intentionally OMITTED:
; the official image's entrypoint.sh only writes HOST/PORT/USER/PASSWORD env
; vars into those keys when they are NOT already present here (grep'd against
; this uncommented file) — leave them out and delonix-manifest.yaml's
; `env.secrets` keeps working. See https://github.com/odoo/docker.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; --- OCA / Odoo S.A. recommended production hardening ---
; https://www.odoo.com/documentation/__TEMPLATE_VERSION__/administration/on_premise/deploy.html
list_db = False
proxy_mode = True
without_demo = all

; Multi-process (worker) mode — required for cron jobs and longpolling/bus
; to run at all once workers > 0. 0 keeps the single-process dev-style
; server (fine for small deployments); Odoo's own sizing rule of thumb is
; workers = (2 * cpu_cores) + 1, plus 1 extra for the cron/gevent workers.
workers = 0
max_cron_threads = 1

; Per-worker resource ceilings — only enforced when workers > 0.
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; Log to stdout (logfile empty) so `delonix container logs` sees it — never
; write server logs into a volume no one is watching.
logfile =
log_level = info

; dev_mode is deliberately ABSENT here (see config/odoo-dev.conf) — autoreload
; and unminified assets have a real runtime cost and no place in production.
