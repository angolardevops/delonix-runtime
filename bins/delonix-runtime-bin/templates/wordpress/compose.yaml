# The single way to bring the stack up. One file, two engines:
#
#   docker compose up -d                  # Docker / Podman Compose
#   delonix compose up                    # Delonix' own Compose path
#
# WordPress IS the image (the official `wordpress:` PHP-Apache build) and
# MariaDB is its database — WordPress will not install without one, so this is
# a two-service stack, not a lone container.
#
# It stays inside the subset BOTH engines serve: no `${VAR}` interpolation
# (Delonix does not expand shell variables), so every value is either literal
# here or supplied through `env_file: [.env]` — credentials live ONLY in .env
# (git-ignored, generated by `delonix init`), never in this file. The ONE DB
# password in .env feeds both the MariaDB image (MYSQL_PASSWORD /
# MYSQL_ROOT_PASSWORD) and WordPress (WORDPRESS_DB_PASSWORD).
#
# Default profile: WordPress + MariaDB. The `quality` profile adds SonarQube
# and its database (heavy — start it only when you scan):
#
#   docker compose --profile quality up -d
#   delonix compose up --profile quality
#
# SonarQube needs a host setting Compose cannot make for you; set it once:
#   sudo sysctl -w vm.max_map_count=262144      # and persist in /etc/sysctl.d
services:
  __NAME__:
    image: wordpress:__TEMPLATE_VERSION__
    restart: always
    # WORDPRESS_DB_HOST/USER/PASSWORD/NAME come from .env; the hostname `db`
    # resolves to the MariaDB service on the Compose network.
    env_file: [.env]
    ports:
      - "__PORT__:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # WordPress core + bundled themes/plugins live in this named volume so a
      # fresh install works out of the box. Your OWN themes/plugins live under
      # ./wp-content and are baked into the image by the Delonixfile (prod) or
      # bind-mounted by delonix-manifest.dev.yaml (live dev) — see README.md.
      - wordpress-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fopen('http://127.0.0.1:80/wp-login.php','r')?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mariadb:11
    restart: always
    # MYSQL_DATABASE/USER/PASSWORD/ROOT_PASSWORD come from .env (the MariaDB
    # image honours the MYSQL_* names). Not published to the host: WordPress
    # reaches it only on the internal Compose network.
    env_file: [.env]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- quality profile: SonarQube + its database ----------------------------
  sonarqube:
    image: sonarqube:lts-community
    profiles: [quality]
    restart: always
    # SONAR_JDBC_* come from .env; they match the sonar-db credentials there.
    env_file: [.env]
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    # No container healthcheck: the official image ships no curl/wget, and first
    # start migrates the database for a few minutes. Watch readiness with
    # `curl -s localhost:9000/api/system/status` (expect `"status":"UP"`).

  sonar-db:
    image: postgres:16-alpine
    profiles: [quality]
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.
    env_file: [.env]
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wordpress-data:
    driver: local
  db-data:
    driver: local
  sonarqube-data:
    driver: local
  sonarqube-extensions:
    driver: local
  sonarqube-logs:
    driver: local
  sonar-db-data:
    driver: local
