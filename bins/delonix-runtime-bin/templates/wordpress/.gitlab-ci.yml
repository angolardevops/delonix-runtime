# Same gate as .github/workflows/ci.yml: lint the custom PHP under wp-content/
# with `php -l` (a pure syntax check — no WordPress runtime, no database).
image: php:8.3-cli

stages:
  - lint

lint:
  stage: lint
  script:
    - |
      set -eu
      fail=0
      any=0
      for f in $(find wp-content -type f -name '*.php'); do
        any=1
        php -l "$f" || fail=1
      done
      [ "$any" -eq 0 ] && echo "no PHP under wp-content yet — nothing to lint"
      [ "$fail" -eq 0 ]
