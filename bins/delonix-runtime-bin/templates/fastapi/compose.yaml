# The single way to bring the stack up. One file, two engines:
#
#   docker compose up -d --build          # Docker / Podman Compose
#   delonix compose up                    # Delonix' own Compose path
#
# It stays inside the subset BOTH engines serve: no `${VAR}` interpolation
# (Delonix does not expand shell variables), so every value is either literal
# here or supplied through `env_file: [.env]` — credentials live ONLY in .env
# (git-ignored, generated by `delonix init`), never in this file.
#
# Default profile: the app, Redis and RabbitMQ. The `quality` profile adds
# SonarQube and its database (heavy — start it only when you scan):
#
#   docker compose --profile quality up -d
#   delonix compose up --profile quality
#
# SonarQube needs a host setting Compose cannot make for you; `delonix compose
# up --profile quality` checks it and prints the fix. Set it once:
#   sudo sysctl -w vm.max_map_count=262144      # and persist in /etc/sysctl.d
services:
  __NAME__:
    build:
      context: .
      dockerfile: Dockerfile
    image: __NAME__:dev
    restart: always
    # Connection URLs and secrets come from .env (REDIS_URL, RABBITMQ_URL, ...).
    # The hostnames `redis` / `rabbitmq` resolve on the Compose network.
    env_file: [.env]
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      # Local HTTPS: the app listens with TLS on __PORT__ inside the container,
      # using the certificate `delonix init` generated into ./tls (mounted
      # read-only below). The host reaches it over HTTPS on __TLS_PORT__.
      TLS_CERT_FILE: /app/tls/tls.crt
      TLS_KEY_FILE: /app/tls/tls.key
    ports:
      # host __TLS_PORT__ (HTTPS) → container __PORT__.
      - "__TLS_PORT__:__PORT__"
    volumes:
      # Certificate + key, read-only, never baked into the image. The key must
      # be readable by the `app` user (see README → "Local HTTPS").
      - "./tls:/app/tls:ro"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request as u; u.urlopen('https://127.0.0.1:__PORT__/api/v1/health/live', timeout=2, context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    user: "app"
    tmpfs:
      - /tmp

  redis:
    image: redis:7.4-alpine
    restart: always
    # No auth: Redis is reachable only on the internal Compose network and is
    # not published to the host. Add `--requirepass` and a REDIS_URL password
    # before exposing it anywhere.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: always
    # RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS come from .env.
    env_file: [.env]
    ports:
      - "15672:15672"   # management UI (http://localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---- quality profile: SonarQube + its database ----------------------------
  sonarqube:
    image: sonarqube:lts-community
    profiles: [quality]
    restart: always
    # SONAR_JDBC_* come from .env; they match the sonar-db credentials there.
    env_file: [.env]
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    # No container healthcheck: the official image ships no curl/wget, and first
    # start migrates the database for a few minutes. Watch readiness with
    # `curl -s localhost:9000/api/system/status` (expect `"status":"UP"`).

  sonar-db:
    image: postgres:16-alpine
    profiles: [quality]
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.
    env_file: [.env]
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  sonarqube-data:
    driver: local
  sonarqube-extensions:
    driver: local
  sonarqube-logs:
    driver: local
  sonar-db-data:
    driver: local
