[project]
name = "__NAME__"
version = "0.1.0"
description = "A FastAPI service generated by `delonix init -t fastapi -v __TEMPLATE_VERSION__`."
requires-python = ">=3.13"
dependencies = [
    # `==X.Y.*`, not `>=X.Y`: a patch release lands with `uv lock --upgrade`,
    # a minor upgrade is a deliberate change (see README, "Upgrading").
    "fastapi==__TEMPLATE_VERSION__.*",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # Outbound webhooks. `httpx`, not `httpx2`: the OpenTelemetry httpx
    # instrumentation instruments `httpx`.
    "httpx>=0.28",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    # Contrib instrumentations are versioned 0.NNbN in lockstep with the SDK.
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

# PEP 735 dependency group: installed by `uv sync`, left out by `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "mypy>=2.3",
    "ruff>=0.16",
    # Starlette's TestClient prefers `httpx2` and warns on every run with `httpx`.
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__MODULE__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
# Any warning is an error: a deprecation reported by a dependency is fixed
# when it appears, not when the dependency removes the feature.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["__MODULE__"]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF",
    "S",      # bandit: security smells
    "ASYNC",  # blocking calls inside async code
    "DTZ",    # naive datetimes
    "T20",    # print() left in the code
    "PT",     # pytest style
]

# Line length is the formatter's job (it cannot split a string or an import path).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["__MODULE__", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests are type-checked too, but may leave test functions unannotated.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# The contrib instrumentation packages ship no type information.
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true
