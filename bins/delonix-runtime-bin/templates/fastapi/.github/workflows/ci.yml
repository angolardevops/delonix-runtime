name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Read-only token: this workflow builds and tests, it publishes nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA (the tag is in the comment); Dependabot
      # (.github/dependabot.yml) proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: uv.lock must be committed
        run: |
          test -f uv.lock || {
            echo "::error::uv.lock is missing. Run 'uv lock' locally and commit uv.lock: CI installs only what is locked."
            exit 1
          }
      - run: make install
      - run: make fmt-check
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
      - run: make audit
