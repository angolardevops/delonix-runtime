[project]
name = "__NAME__"
version = "0.1.0"
description = "A Django JSON service generated by `delonix init -t django -v __TEMPLATE_VERSION__`."
requires-python = ">=3.13"
dependencies = [
    # `==X.Y.*`: point releases (security fixes) arrive with `uv lock
    # --upgrade`; another feature release is a deliberate change here.
    "django==__TEMPLATE_VERSION__.*",
    "dj-database-url>=3.0",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
    "opentelemetry-instrumentation-django>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pyyaml>=6.0",
    "ruff>=0.9",
]

# Not a package: the project runs through manage.py and gunicorn, so uv only
# installs its dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# APP_ENV=test is set in tests/conftest.py before Django reads settings.

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DJ", "RUF"]
ignore = [
    "S101",  # assert is how pytest checks
    "S104",  # binding 0.0.0.0 is the point of a container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test secrets are fixtures, not credentials
"*/migrations/*" = ["RUF012"]  # Django's migration classes are declared this way
