[project]
name = "__NAME__"
version = "0.1.0"
description = "A Django project scaffolded by `delonix init -t django -v __TEMPLATE_VERSION__`."
requires-python = ">=3.11"
dependencies = [
    # `==X.Y.*`, not `>=X.Y`: a patch/point release lands with a plain `uv
    # sync`, a major upgrade needs a new `-v` (see `delonix init -t django -v`).
    "django==__TEMPLATE_VERSION__.*",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

# Not a package — a Django project is run via manage.py, so uv installs deps only.
[tool.uv]
package = false
