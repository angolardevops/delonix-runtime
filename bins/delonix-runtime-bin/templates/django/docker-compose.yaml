version: "3.9"
# Docker Compose alternative to Delonix Stack. Use either:
#   delonix stack apply                  (uses delonix-manifest.yaml)
#   docker-compose up                    (uses this file)
#
# Both approaches run the same application. Choose based on your preference:
# - delonix stack: declarative, edge-triggered, production-ready
# - docker-compose: simpler, stateless, great for development
services:
  __NAME__:
    build:
      context: .
      dockerfile: Dockerfile
    image: __NAME__:dev
    container_name: __NAME__
    restart: always
    ports:
      - "__PORT__:__PORT__"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - SHUTDOWN_TIMEOUT=15s
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=sqlite:////data/db.sqlite3
      - MIGRATE_ON_START=true
      - SECRET_KEY_FILE=/data/secret_key
      - SECURE_SSL_REDIRECT=false
      - SECURE_HSTS_SECONDS=0
    volumes:
      - __NAME__-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:__PORT__/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "app"
    tmpfs:
      - /tmp

volumes:
  __NAME__-data:
    driver: local
