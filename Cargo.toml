[workspace]
resolver = "2"
members = [
    "crates/adapters/delonix-linux",
    "bins/delonix-runtime-bin",
    "crates/adapters/delonix-oci",
    "crates/adapters/delonix-sdn",
    "crates/foundation/delonix-net-rules",
    "crates/adapters/delonix-vm",
    "crates/adapters/delonix-volume",
    "crates/interfaces/delonix-cri",
    "crates/interfaces/delonix-mgmt",
    "crates/adapters/delonix-scanner",
    "crates/adapters/delonix-state",
    "crates/contexts/delonix-security-runtime",
    "crates/providers/delonix-truenas",
    "crates/providers/delonix-proxmox",
    "crates/providers/delonix-opnsense",
    "crates/interfaces/delonix-mcp",
    "crates/foundation/delonix-model",
    "crates/contexts/delonix-stack",
    "crates/contexts/delonix-compute",
    "crates/contexts/delonix-node",
    "crates/adapters/delonix-telemetry",
    "bins/delonix-mcp-bin",
    "bins/delonix-mgmt-bin",
    "crates/interfaces/delonix-node-api",
    "bins/delonix-node-api-bin",
]

[workspace.package]
version = "4.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/angolardevops/delonix-runtime"

[workspace.dependencies]
# The engine's own crates, by path. ADR-0040 P0: the path of every crate is written
# HERE and nowhere else, so a move or a rename (phases P2-P4) edits one line and not
# every manifest that depends on it. The directory is the crate's LAYER, and
# `scripts/arch_fitness.py` fails when the two disagree.
delonix-linux = { path = "crates/adapters/delonix-linux" }
delonix-runtime-bin = { path = "bins/delonix-runtime-bin" }
delonix-oci = { path = "crates/adapters/delonix-oci" }
delonix-sdn = { path = "crates/adapters/delonix-sdn" }
delonix-net-rules = { path = "crates/foundation/delonix-net-rules" }
delonix-telemetry = { path = "crates/adapters/delonix-telemetry" }
delonix-vm = { path = "crates/adapters/delonix-vm" }
delonix-volume = { path = "crates/adapters/delonix-volume" }
delonix-cri = { path = "crates/interfaces/delonix-cri" }
delonix-mgmt = { path = "crates/interfaces/delonix-mgmt" }
delonix-node-api = { path = "crates/interfaces/delonix-node-api" }
delonix-scanner = { path = "crates/adapters/delonix-scanner" }
delonix-state = { path = "crates/adapters/delonix-state" }
delonix-security-runtime = { path = "crates/contexts/delonix-security-runtime" }
delonix-truenas = { path = "crates/providers/delonix-truenas" }
delonix-proxmox = { path = "crates/providers/delonix-proxmox" }
delonix-opnsense = { path = "crates/providers/delonix-opnsense" }
delonix-mcp = { path = "crates/interfaces/delonix-mcp" }
delonix-model = { path = "crates/foundation/delonix-model" }
delonix-stack = { path = "crates/contexts/delonix-stack" }
delonix-compute = { path = "crates/contexts/delonix-compute" }
delonix-node = { path = "crates/contexts/delonix-node" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nix = { version = "0.27", features = ["sched", "mount", "process", "hostname", "fs", "user", "signal"] }
libc = "0.2"
seccompiler = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
# Tipos OCI canónicos (image/distribution) — evita structs hand-rolled do schema.
oci-spec = { version = "0.10.0", default-features = false }
# Observabilidade: logging estruturado (fundação C1). Texto por omissão, JSON via
# DELONIX_LOG_FORMAT=json; nível por DELONIX_LOG/RUST_LOG (env-filter).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Observabilidade — 3.ª perna: spans distribuídos via OpenTelemetry (OTLP). Só
# activo quando `DELONIX_OTLP_ENDPOINT` está definido (ver `telemetry::init`).
# Versões alinhadas entre si (a compat OTel↔tracing-opentelemetry é frágil):
# opentelemetry/otlp/sdk 0.32.x + tracing-opentelemetry 0.33.x.
# Transporte OTLP por HTTP/protobuf, exportador em batch numa THREAD dedicada
# (`futures_executor::block_on`, sem runtime tokio ambiente — ver a nuance
# CLI-sync em `telemetry.rs`). Cliente `reqwest` em modo BLOQUEANTE e SEM backend
# de TLS (endpoint em texto simples, típico de um collector local em
# `http://…:4318`): evita arrastar aws-lc-sys/openssl/native-tls (C + licença
# OpenSSL) — mantém a supply-chain de um runtime público mínima e justificada.
# Um endpoint `https://` não é suportado por desenho (erro claro em runtime).
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
] }
tracing-opentelemetry = { version = "0.33", default-features = false }

# ADR-0040, P0: every version lives HERE, once. A member names only the features it
# needs (`{ workspace = true, features = [...] }`); a crate cannot re-enable
# default features the workspace turned off, so `default-features = false` is set
# here and nowhere else. `scripts/arch_fitness.py` fails on an inline version.
# Async runtime and HTTP (CRI, management API, L7 proxy, MCP)
tokio = "1"
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false }
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
bytes = "1"
axum = "0.7"
tower = "0.5"
tokio-rustls = { version = "0.26", default-features = false }
rustls-pemfile = "2"
# Server side of the TLS mock node `delonix-proxmox` tests against (dev-dependency
# only): the client refuses http://, so a failure-injection test needs a real
# listener with a certificate. Same 0.23 line reqwest already resolves to.
rustls = { version = "0.23", default-features = false }
rcgen = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false }
# gRPC (CRI)
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
# proto3 JSON for the node contract (delonix-node-api): the same files as the gRPC stubs.
pbjson = "0.7"
pbjson-types = "0.7"
pbjson-build = "0.7"
# Crypto, encoding, compression
chacha20poly1305 = "0.10"
getrandom = "0.2"
ring = "0.17"
base64 = "0.22"
zstd = "0.13"
# Kernel interfaces
rustix = "1.1"
# CLI, manifests, schema
clap_complete = "4.6"
serde_yaml = "0.9"
schemars = "1.2.2"
ratatui = "0.29"
# Telemetry and MCP
prometheus-client = "0.25"
rmcp = { version = "3", default-features = false }
# Tests and benchmarks
proptest = "1"
tempfile = "3"
criterion = "0.5"

# ADR-0040, P0: lints every crate inherits (`[lints] workspace = true`). An
# `unsafe` block states WHY it is sound, next to it — a justification three lines
# up, above an unrelated statement, is how a false one survives review.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Perfil de release dos binários publicados: LTO thin + 1 codegen unit dão
# um binário mais pequeno e mais rápido (inlining entre crates — o caminho
# quente hash/serde/parsing beneficia) por custo só em tempo de build no CI.
# O strip é feito no workflow de release, não aqui (os builds locais mantêm
# símbolos para depurar).
[profile.release]
lto = "thin"
codegen-units = 1
